<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Listar proformas</title>
    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="assets/static/css/sgtl.css">
</head>

<body>
    <div id="app">
        <div id="sidebar"></div>
        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>

            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloProformas">
                    <div class="card rounded">
                        <div class="card-header d-flex align-items-center justify-content-between gap-2">
                            <div>
                                <h1 id="tituloProformas" class="card-title h5 mb-1"><i class="bi bi-file-earmark-medical me-2" aria-hidden="true"></i>Listar proformas</h1>
                                <p class="text-muted mb-0">Proformas ya generadas. Los borradores se ven en Gestionar proformas.</p>
                            </div>
                            <button type="button" id="exportarProformas" class="btn btn-outline-secondary" data-bs-toggle="tooltip" title="Exportar" aria-label="Exportar">
                                <i class="bi bi-download" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <form id="busquedaProformas" class="row g-3 align-items-end mb-4" novalidate>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaNumero" class="form-label">Número</label>
                                    <input type="text" id="proformaNumero" class="form-control" maxlength="20" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaCliente" class="form-label">Cliente</label>
                                    <select id="proformaCliente" class="form-select">
                                        <option value="">Todos los clientes</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaFecha" class="form-label">Fecha</label>
                                    <input type="text" id="proformaFecha" class="form-control" placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaEstado" class="form-label">Estado</label>
                                    <select id="proformaEstado" class="form-select">
                                        <option value="">Todos</option>
                                        <option>Generada</option>
                                        <option>Aceptada</option>
                                        <option>Facturada</option>
                                        <option>Anulada</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaTipo" class="form-label">Tipo</label>
                                    <select id="proformaTipo" class="form-select">
                                        <option value="">Todos</option>
                                        <option value="Propia">Propia</option>
                                        <option value="Plataforma">De plataforma</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="proformaUsuario" class="form-label">Usuario</label>
                                    <input type="text" id="proformaUsuario" class="form-control" placeholder="Todos los usuarios" maxlength="50" autocomplete="off">
                                </div>
                                <div class="col-12 col-lg-6 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-light"><i class="bi bi-search me-1" aria-hidden="true"></i>Buscar</button>
                                </div>
                            </form>

                            <div class="table-responsive">
                                <table id="tablaProformas" class="table table-striped table-hover align-middle mb-0" aria-labelledby="tituloProformas">
                                    <thead class="text-nowrap">
                                        <tr>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="numero">Número<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="cliente">Cliente<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="fecha">Fecha<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-end"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="total">Total<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="usuario">Usuario<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center">Estado</th>
                                            <th scope="col" class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasProformas"></tbody>
                                </table>
                            </div>
                            <nav aria-label="Paginación de proformas">
                                <ul id="paginacionProformas" class="pagination justify-content-end"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/js/select-cliente-predictivo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="assets/static/js/proforma-pdf.js"></script>
    <script src="assets/static/js/proforma-detalle.js"></script>
    <script src="assets/static/js/listado-proformas.js"></script>
</body>

</html>
