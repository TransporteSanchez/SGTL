<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transporte Sánchez - Listar camiones</title>
    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
</head>

<body data-camiones="listado">
    <div id="cargandoApariencia" class="min-vh-100 d-flex align-items-center justify-content-center gap-2"
        role="status">
        <span class="spinner-border" aria-hidden="true"></span>
        <span>Cargando…</span>
    </div>
    <div id="app" class="d-none">
        <div id="sidebar"></div>
        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú"><i class="bi bi-justify fs-3"
                                aria-hidden="true"></i></a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>
            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloCamiones">
                    <div class="card rounded">
                        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                            <div>
                                <h1 id="tituloCamiones" class="card-title h5 mb-1"><i class="bi bi-truck me-2"
                                        aria-hidden="true"></i>Listar camiones</h1>
                                <p class="text-muted mb-0">Consultá los datos y los choferes asignados a cada camión.
                                </p>
                            </div>
                            <button type="button" id="btnDescargar" class="btn btn-secondary"
                                aria-label="Descargar reporte" data-bs-toggle="tooltip" title="Descargar reporte"
                                disabled><i class="bi bi-download" aria-hidden="true"></i></button>
                        </div>
                        <div class="card-body">
                            <form id="formBuscar" class="row g-3 align-items-end mb-4" novalidate>
                                <div class="col-12 col-md-4">
                                    <label for="fDominio" class="form-label">Dominio</label>
                                    <input id="fDominio" class="form-control" placeholder="Buscar por dominio"
                                        maxlength="7" autocomplete="off">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="fFecha" class="form-label">Fecha de alta</label>
                                    <input id="fFecha" class="form-control" placeholder="DD/MM/AAAA" autocomplete="off">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="fEstado" class="form-label">Estado</label>
                                    <select id="fEstado" class="form-select">
                                        <option value="Activo">Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                        <option value="">Todos</option>
                                    </select>
                                </div>
                                <div class="col-12 d-flex justify-content-end"><button type="submit"
                                        class="btn btn-light">Buscar</button></div>
                            </form>
                            <div class="table-responsive">
                                <table id="tablaCamiones" class="table table-striped table-hover align-middle mb-0"
                                    aria-labelledby="tituloCamiones">
                                    <thead>
                                        <tr>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Dominio">Dominio<i class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Marca">Marca<i class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Modelo">Modelo<i class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center"><button type="button"
                                                    class="sgtl-orden-boton" data-sgtl-orden="Fecha_Alta">Fecha de
                                                    alta<i class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center"><button type="button"
                                                    class="sgtl-orden-boton" data-sgtl-orden="EstadoCamion">Estado<i
                                                        class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasCamiones"></tbody>
                                </table>
                            </div>
                            <nav aria-label="Paginación de camiones">
                                <ul id="paginacionCamiones" class="pagination justify-content-end"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </main>
            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>
    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/js/camiones.js"></script>
</body>

</html>
