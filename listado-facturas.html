    <!-- Carga de diseño y roles -->
    <script>
        window.onload = function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            // Cargar header, footer y configuración
            window.loadHeader();
            window.loadFooter();

            loadSettings()
                .then(() => {
                    adjustVisibilityBasedOnRole();
                    loadingMessage.style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    if (typeof window.loadSidebar === 'function') { window.loadSidebar(); }
                })
                .catch((error) => {
                    console.error('Error al cargar el header, footer o los datos:', error);
                    loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
                });
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

    </script>

    <!-- Comportamiento tooltip -->
    <script>
        $(document).ready(function () {
            // Inicializa tooltips en todos los elementos estáticos
            $('[data-bs-toggle="tooltip"]').tooltip();

            // Aplica tooltips a elementos dinámicamente agregados en la tabla
            $(document).on('mouseenter', '[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('show');
            });

            $(document).on('mouseleave', '[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('hide');
            });

            // Manejo específico para tooltips en botones deshabilitados
            $(document).on('mouseenter', 'span[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('show');
            });

            $(document).on('mouseleave', 'span[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('hide');
            });
        });

    </script>

    <!-- ================= Listado de facturas (solo lectura) ================= -->
    <script>
        const API_LF = 'http://localhost:50222/api';
        let ultimaProforma = null;
        function d10(x) { return x ? String(x).substring(0, 10) : ''; }
        function money(x) { return Number(x || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

        function listarProformas() {
            $.ajax({ url: API_LF + '/Proformas', type: 'GET' })
                .done(function (data) {
                    const tb = $('#tablaProformas tbody').empty();
                    if (!data || !data.length) { tb.html('<tr><td colspan="8" class="text-center">No hay facturas generadas</td></tr>'); return; }
                    data.forEach(function (p) {
                        tb.append('<tr>' +
                            '<td>' + p.Proforma_ID + '</td>' +
                            '<td>' + (p.ClienteRazon || '') + '</td>' +
                            '<td>' + d10(p.FechaDesde) + '</td>' +
                            '<td>' + d10(p.FechaHasta) + '</td>' +
                            '<td>' + (p.CantidadViajes || '') + '</td>' +
                            '<td>$' + money(p.ImporteTotal) + '</td>' +
                            '<td>' + d10(p.FechaCreacion) + '</td>' +
                            '<td><button class="btn btn-primary btn-sm" onclick="verProforma(' + p.Proforma_ID + ')"><i class="bi bi-eye"></i></button></td>' +
                            '</tr>');
                    });
                })
                .fail(function () { $('#tablaProformas tbody').html('<tr><td colspan="8" class="text-center">No hay facturas generadas</td></tr>'); });
        }

        function cuerpoProformaHtml(r) {
            const p = r.Proforma; const det = r.Detalle;
            let filas = '';
            if (det && det.Viajes) {
                det.Viajes.forEach(function (v) {
                    filas += '<tr><td>' + v.Viaje_ID + '</td><td>' + d10(v.Fecha_Inicio) + '</td><td>' + (v.Origen || '') + '</td><td>' + (v.Destino || '') + '</td><td>' + (v.Num_Remito || '') + '</td><td>' + (v.Distancia_KM || '') + '</td><td>' + (v.TipoTarifa || '') + '</td><td style="text-align:right;">$' + money(v.Importe) + '</td></tr>';
                });
            }
            return '<h4 style="margin-bottom:4px;">Proforma N&deg; ' + p.Proforma_ID + '</h4>' +
                '<p style="margin:0;"><strong>Cliente:</strong> ' + (p.ClienteRazon || '') + '</p>' +
                '<p style="margin:0;"><strong>Per&iacute;odo:</strong> ' + d10(p.FechaDesde) + ' al ' + d10(p.FechaHasta) + '</p>' +
                '<p style="margin:0 0 10px 0;"><strong>Fecha de emisi&oacute;n:</strong> ' + d10(p.FechaCreacion) + '</p>' +
                '<table class="table table-bordered" style="width:100%;border-collapse:collapse;"><thead><tr><th>#</th><th>Fecha</th><th>Origen</th><th>Destino</th><th>Remito</th><th>Distancia</th><th>Tarifa</th><th style="text-align:right;">Importe</th></tr></thead><tbody>' + filas + '</tbody></table>' +
                '<h5 style="text-align:right;margin-top:10px;">Viajes: ' + (p.CantidadViajes || '0') + ' &nbsp;&nbsp; Total: $' + money(p.ImporteTotal) + '</h5>';
        }

        function verProforma(id) {
            $.ajax({ url: API_LF + '/Proformas/' + id, type: 'GET' })
                .done(function (r) { ultimaProforma = r; $('#cuerpoProforma').html(cuerpoProformaHtml(r)); $('#modalProforma').modal('show'); })
                .fail(function () { alert('No se pudo cargar la factura.'); });
        }

        function imprimirProforma() {
            if (!ultimaProforma) { return; }
            const w = window.open('', '_blank');
            w.document.write('<html><head><title>Proforma</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#222;} table{width:100%;border-collapse:collapse;margin-top:8px;} th,td{border:1px solid #999;padding:6px;font-size:13px;} th{background:#eee;}</style></head><body>' + cuerpoProformaHtml(ultimaProforma) + '</body></html>');
            w.document.close(); w.focus();
            setTimeout(function () { w.print(); }, 300);
        }

        $(document).ready(function () { listarProformas(); });
    </script>
