<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Listar viajes</title>
    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="assets/static/css/sgtl.css">
</head>

<body>
    <div id="app">
        <div id="sidebar"></div>
        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>

            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloViajes">
                    <div class="card rounded">
                        <div class="card-header d-flex align-items-center justify-content-between gap-2">
                            <div>
                                <h1 id="tituloViajes" class="card-title h5 mb-1"><i class="bi bi-calendar-check me-2" aria-hidden="true"></i>Listar viajes</h1>
                                <p class="text-muted mb-0">Recorrido, fechas y estado de cada viaje.</p>
                            </div>
                            <button type="button" id="exportarViajes" class="btn btn-outline-secondary" data-bs-toggle="tooltip" title="Exportar" aria-label="Exportar">
                                <i class="bi bi-download" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <form id="busquedaViajes" class="row g-3 align-items-end mb-4" novalidate>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeNumero" class="form-label">Número</label>
                                    <input type="text" id="viajeNumero" class="form-control" inputmode="numeric" maxlength="9" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeCliente" class="form-label">Cliente</label>
                                    <select id="viajeCliente" class="form-select">
                                        <option value="">Todos los clientes</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeInicio" class="form-label">Fecha de inicio</label>
                                    <input type="text" id="viajeInicio" class="form-control" placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeFin" class="form-label">Fecha de fin</label>
                                    <input type="text" id="viajeFin" class="form-control" placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeEstado" class="form-label">Estado</label>
                                    <select id="viajeEstado" class="form-select">
                                        <option value="">Todos</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="viajeReferencia" class="form-label">Remito, transporte o entrega</label>
                                    <input type="text" id="viajeReferencia" class="form-control" maxlength="20" autocomplete="off">
                                </div>
                                <div class="col-12 col-lg-6 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-light"><i class="bi bi-search me-1" aria-hidden="true"></i>Buscar</button>
                                </div>
                            </form>

                            <div class="table-responsive">
                                <table id="tablaViajes" class="table table-striped table-hover align-middle mb-0" aria-labelledby="tituloViajes">
                                    <thead class="text-nowrap">
                                        <tr>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="numeroViaje">Número<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="cliente">Cliente<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="fechaInicio">Fecha<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="origen">Recorrido<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-end"><button type="button" class="sgtl-orden-boton" data-sgtl-orden="km">Km<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i></button></th>
                                            <th scope="col" class="text-center">Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasViajes"></tbody>
                                </table>
                            </div>
                            <nav aria-label="Paginación de viajes">
                                <ul id="paginacionViajes" class="pagination justify-content-end"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/js/select-cliente-predictivo.js"></script>
    <script src="assets/static/js/listado-viajes.js"></script>
</body>

</html>
