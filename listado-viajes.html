<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar viajes · SGTL</title>

    <style>
        #app {
            display: none;
        }

        #loading-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        /* Asegura que la tabla se extienda completamente */
        .table-responsive {
            width: 100%;
        }

        #tablaViajes {
            width: 100%;
            text-align: center;
        }

        #tablaViajes th,
        #tablaViajes td {
            text-align: center;
            vertical-align: middle;
        }

        /* Ajusta el ancho de las columnas para que ocupen el mismo espacio */
        #tablaViajes th {
            width: auto;
            white-space: nowrap;
        }

        /* Centrar la paginación */
        .pagination {
            justify-content: center;
        }

        #listaSugerenciasClientes {
            max-height: 220px;
            overflow-y: auto;
        }

        #listaSugerenciasClientes .list-group-item-action {
            cursor: pointer;
        }
    </style>

    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">



    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
</head>

<body>
    <script src="assets/static/js/initTheme.js"></script>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <!--Header-->
            <header>

                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>

                        <!--btn para expandir Menú lateral-->

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <!--Llamado a las opciones del header-->

                        <div id="header-container"></div>

                        <script src="./assets/static/js/header.js"></script>

                    </div>
                </nav>
            </header>

            <div class="page-heading">

                <!--Comienzo sección de la tabla-->
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">
                        <div class="card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <h5 class="card-title mb-1">
                                    <i class="bi bi-calendar-check me-2"></i>Listar viajes
                                </h5>
                                <p class="text-muted mb-0">Consultá los viajes y su estado; para cambiarlos andá a Gestionar viajes.</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-outline-secondary" id="btnExportar"
                                    data-bs-toggle="tooltip" title="Exportar" aria-label="Exportar">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <form id="busquedaViajeForm" class="form">
                                <div class="d-flex flex-wrap justify-content-between align-items-end mb-3">
                                    <div class="d-flex flex-wrap">
                                        <!-- Campo de fecha de inicio -->
                                        <div class="me-3 mb-3">
                                            <label for="fechaRangoInicioViaje">Fecha de inicio</label>
                                            <input type="text" class="form-control" id="fechaRangoInicioViaje"
                                                placeholder="Desde y hasta">
                                        </div>
                                        <!-- Campo de fecha de fin -->
                                        <div class="me-3 mb-3">
                                            <label for="fechaRangoFinViaje">Fecha de fin</label>
                                            <input type="text" class="form-control" id="fechaRangoFinViaje"
                                                placeholder="Desde y hasta">
                                        </div>
                                        <!-- Filtro por cliente (autocompletar) -->
                                        <div class="me-3 mb-3 position-relative" style="min-width: 260px;">
                                            <label for="filtroClienteBusqueda">Cliente</label>
                                            <input type="text" class="form-control" id="filtroClienteBusqueda"
                                                placeholder="Escribí para buscar por razón social…" autocomplete="off">
                                            <input type="hidden" id="filtroClienteId" value="">
                                            <ul class="list-group position-absolute w-100 shadow-sm mt-1 d-none"
                                                id="listaSugerenciasClientes" role="listbox" style="z-index: 1050;">
                                            </ul>
                                        </div>
                                        <!-- Botón Buscar -->
                                        <div class="mb-3">
                                            <label>&nbsp;</label>
                                            <button type="button" class="btn btn-light d-block"
                                                onclick="buscarViajes()">Buscar</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="table-responsive">
                                <table class="table table-striped" id="tablaViajes">
                                    <thead>
                                        <tr>
                                            <th>Número de viaje</th>
                                            <th>Fecha de inicio</th>
                                            <th>Fecha de fin</th>
                                            <th>Origen</th>
                                            <th>Destino</th>
                                            <th>Número de remito</th>
                                            <th>Cantidad de KM</th>
                                            <th class="text-center">Estado</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Contenido llenado dinámicamente -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Paginación -->
                            <nav>
                                <ul class="pagination justify-content-end" id="pagination">
                                </ul>
                            </nav>
                        </div>
                    </div>

                </section>
                <!--Fin sección de la tabla-->
            </div>

            <!--Footer-->

            <footer>
                <div id="footer-container"></div>

                <script src="./assets/static/js/footer.js"></script>

                </script>
            </footer>
        </div>

        <!-- Modal Detalles-->
        <div class="modal fade text-left" id="DetallesViajeModal" tabindex="-1" role="dialog"
            aria-labelledby="DetallesViaje" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="DetallesViaje">Detalles del viaje</h4>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <i data-feather="x"></i>
                        </button>
                    </div>
                    <div class="modal-body mt-4 mb-4 mx-2">
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="modalIDviaje" class="form-label">Número de viaje</label>
                                        <input type="text" id="modalIDviaje" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalOrigen" class="form-label">Origen del viaje</label>
                                        <input type="text" id="modalOrigen" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalDestino" class="form-label">Destino del viaje</label>
                                        <input type="text" id="modalDestino" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalDistanciakm" class="form-label">Cantidad de KM</label>
                                        <input type="text" id="modalDistanciakm" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalNumRemito" class="form-label">Número de remito</label>
                                        <input type="text" id="modalNumRemito" class="form-control" readonly>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="modalNumCarga" class="form-label">Número de carga</label>
                                        <input type="text" id="modalNumCarga" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalFechaInicio" class="form-label">Fecha de inicio</label>
                                        <input type="text" id="modalFechaInicio" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalFechaFin" class="form-label">Fecha de fin</label>
                                        <input type="text" id="modalFechaFin" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalTarifaFija" class="form-label">Tarifa Fija</label>
                                        <input type="text" id="modalTarifaFija" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalTarifaKM" class="form-label">Tarifa por KM</label>
                                        <input type="text" id="modalTarifaKM" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalChoferCamion" class="form-label">Chofer asignado</label>
                                        <input type="text" id="modalChoferCamion" class="form-control" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label for="modalCliente" class="form-label">Cliente</label>
                                        <input type="text" id="modalCliente" class="form-control" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <!-- Scripts -->
        <script src="assets/extensions/jquery/jqueryajax.js"></script>
        <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
        <script src="assets/compiled/js/app.js"></script>
        <script src="assets/static/js/sgtl-ui.js"></script>
        <script src="assets/static/js/components/sidebar.js"></script>
        <script src="assets/static/js/sidebar-loader.js"></script>
        <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
        <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
        <script src="./assets/static/gestionContenido.js"></script>

        <!-- Comportamiento tooltip -->
        <script>
            $(document).ready(function () {
                // Inicializa tooltips en todos los elementos estáticos
                $('[data-bs-toggle="tooltip"]').tooltip();

                // Aplica tooltips a elementos dinámicamente agregados en la tabla
                $(document).on('mouseenter', '[data-bs-toggle="tooltip"]', function () {
                    $(this).tooltip('show');
                });

                $(document).on('mouseleave', '[data-bs-toggle="tooltip"]', function () {
                    $(this).tooltip('hide');
                });

                // Manejo específico para tooltips en botones deshabilitados
                $(document).on('mouseenter', 'span[data-bs-toggle="tooltip"]', function () {
                    $(this).tooltip('show');
                });

                $(document).on('mouseleave', 'span[data-bs-toggle="tooltip"]', function () {
                    $(this).tooltip('hide');
                });
            });

        </script>

        <!-- Carga de diseño y roles -->
        <script>
            window.onload = async function () {
                const loadingMessage = document.getElementById('loading-message');
                loadingMessage.style.display = 'block';
                document.getElementById('app').style.display = 'none';

                window.loadHeader();
                window.loadFooter();

                try {
                    if (typeof window.loadSidebar === 'function') {
                        await window.loadSidebar();
                    }
                    await loadSettings();  // o tu equivalente que llame applyStyles
                    adjustVisibilityBasedOnRole();  // si la página lo define
                    loadingMessage.style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                } catch (error) {
                    console.error('Error al cargar el header, footer o los datos:', error);
                    loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
                }
            };
            
            function adjustVisibilityBasedOnRole() {
                const userRole = localStorage.getItem('userRole');
                const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

                if (userRole && userRole.toLowerCase() === 'admin') {
                    gestionarContenidoBtn.style.display = 'block';
                } else {
                    gestionarContenidoBtn.style.display = 'none';
                }
            }

            async function loadSettings() {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                    xhr.onload = function () {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            const data = JSON.parse(xhr.responseText);
                            if (data) {
                                const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                                applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                                resolve();
                            } else {
                                console.error('La respuesta de la API no contiene los datos esperados.');
                                reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                            }
                        } else {
                            console.error('Error en la petición:', xhr.statusText);
                            reject(new Error('Error en la carga de la API'));
                        }
                    };

                    xhr.onerror = function () {
                        console.error('Error al cargar la configuración de la API.');
                        reject(new Error('Error de red'));
                    };

                    xhr.send();
                });
            }

        </script>

        <!-- Buscador y Listar -->
        <script>
            let pageSize = 15;
            let currentPage = 1;
            let clienteBusquedaTimer = null;

            function ocultarSugerenciasClientes() {
                $('#listaSugerenciasClientes').empty().addClass('d-none');
            }

            function seleccionarCliente(id, etiqueta) {
                $('#filtroClienteId').val(id);
                $('#filtroClienteBusqueda').val(etiqueta);
                ocultarSugerenciasClientes();
            }

            $('#filtroClienteBusqueda').on('input', function () {
                const q = $(this).val().trim();
                $('#filtroClienteId').val('');
                clearTimeout(clienteBusquedaTimer);
                if (q.length < 2) {
                    ocultarSugerenciasClientes();
                    return;
                }
                clienteBusquedaTimer = setTimeout(function () {
                    $.ajax({
                        url: 'http://localhost:50222/api/Clientes/Buscar',
                        type: 'GET',
                        data: { razonSocial: q, page: 1, pageSize: 15 },
                        success: function (data) {
                            const $ul = $('#listaSugerenciasClientes');
                            $ul.empty();
                            const rows = data.Results || [];
                            if (rows.length === 0) {
                                $ul.append(
                                    '<li class="list-group-item list-group-item-light small py-2">Sin coincidencias</li>'
                                );
                            } else {
                                rows.forEach(function (c) {
                                    const nombre = c.RazonSocial || '';
                                    const cuit = c.CUIT_Cliente ? ' — ' + String(c.CUIT_Cliente).trim() : '';
                                    const label = (nombre + cuit).trim() || ('Cliente #' + c.Cliente_ID);
                                    const $li = $('<li class="list-group-item list-group-item-action small py-2" role="option"></li>');
                                    $li.text(label);
                                    $li.data('id', c.Cliente_ID);
                                    $li.data('label', nombre || label);
                                    $ul.append($li);
                                });
                            }
                            $ul.removeClass('d-none');
                        },
                        error: function () {
                            ocultarSugerenciasClientes();
                        }
                    });
                }, 300);
            });

            $('#listaSugerenciasClientes').on('mousedown', 'li.list-group-item-action', function (e) {
                e.preventDefault();
                const $li = $(this);
                const id = $li.data('id');
                const label = $li.data('label');
                if (id) {
                    seleccionarCliente(id, label);
                }
            });

            $(document).on('click', function (e) {
                if (!$(e.target).closest('#filtroClienteBusqueda, #listaSugerenciasClientes').length) {
                    ocultarSugerenciasClientes();
                }
            });

            // Datepicker para el filtro de fecha de inicio de viaje
            $('#fechaRangoInicioViaje').daterangepicker({
                autoUpdateInput: false,
                locale: {
                    cancelLabel: 'Borrar',
                    format: 'DD/MM/YYYY',
                    applyLabel: 'Aplicar',
                    cancelLabel: 'Cancelar',
                    daysOfWeek: ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'],
                    monthNames: [
                        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                    ]
                }
            });

            $('#fechaRangoInicioViaje').on('apply.daterangepicker', function (ev, picker) {
                $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
                $(this).data('start', picker.startDate.format('YYYY-MM-DD'));
                $(this).data('end', picker.endDate.format('YYYY-MM-DD'));
            });

            $('#fechaRangoInicioViaje').on('cancel.daterangepicker input', function () {
                $(this).val('');
                $(this).removeData('start').removeData('end');
                buscarViajes(currentPage);
            });

            // Datepicker para el filtro de fecha de fin de viaje
            $('#fechaRangoFinViaje').daterangepicker({
                autoUpdateInput: false,
                locale: {
                    cancelLabel: 'Borrar',
                    format: 'DD/MM/YYYY',
                    applyLabel: 'Aplicar',
                    cancelLabel: 'Cancelar',
                    daysOfWeek: ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'],
                    monthNames: [
                        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                    ]
                }
            });

            $('#fechaRangoFinViaje').on('apply.daterangepicker', function (ev, picker) {
                $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
                $(this).data('start', picker.startDate.format('YYYY-MM-DD'));
                $(this).data('end', picker.endDate.format('YYYY-MM-DD'));
            });

            $('#fechaRangoFinViaje').on('cancel.daterangepicker input', function () {
                $(this).val('');
                $(this).removeData('start').removeData('end');
                buscarViajes(currentPage);
            });


            function formatearFecha(fecha) {
                if (!fecha) return '';
                const fechaObj = new Date(fecha);
                const dia = String(fechaObj.getDate()).padStart(2, '0');
                const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
                const anio = fechaObj.getFullYear();
                return `${dia}/${mes}/${anio}`;
            }

            function mostrarDetallesViaje(viaje) {
                $('#modalIDviaje').val(viaje.Viaje_ID);
                $('#modalOrigen').val(viaje.OrigenID);
                $('#modalDestino').val(viaje.DestinoID);
                $('#modalDistanciakm').val(viaje.Distancia_KM);
                $('#modalNumRemito').val(viaje.Num_Remito);
                $('#modalNumCarga').val(viaje.Num_de_Carga);
                $('#modalFechaInicio').val(formatearFecha(viaje.Fecha_Inicio));
                $('#modalFechaFin').val(formatearFecha(viaje.Fecha_Fin));
                $('#modalTarifaFija').val(viaje.TarifaFijaID);
                $('#modalTarifaKM').val(viaje.TarifaKmID);
                $('#modalChoferCamion').val(viaje.ChofCamID);
                $('#modalCliente').val(viaje.ClienteID);
                $('#DetallesViajeModal').modal('show');
            }

            // Etiquetas de estado; los colores salen de SGTL.estado (§4 del design system).
            const ESTADOS_VIAJE = {
                Registrado: 'Registrado',
                En_viaje: 'En viaje',
                Entregado: 'Entregado',
                Listo_para_facturar: 'Listo para facturar',
                Facturado: 'Facturado'
            };
            let viajesPagina = {};

            // Mismos filtros que la búsqueda; exporta todo lo filtrado, no solo la página visible (§1.2).
            async function exportarViajes() {
                const clienteIdRaw = $('#filtroClienteId').val().trim();
                const datos = {
                    fechaDesde: $('#fechaRangoInicioViaje').data('start') || null,
                    fechaHasta: $('#fechaRangoInicioViaje').data('end') || null,
                    fechaFinDesde: $('#fechaRangoFinViaje').data('start') || null,
                    fechaFinHasta: $('#fechaRangoFinViaje').data('end') || null,
                    page: 1,
                    pageSize: 0
                };
                if (clienteIdRaw) datos.clienteId = parseInt(clienteIdRaw, 10);
                const listo = SGTL.procesando('#btnExportar');
                try {
                    const data = await SGTL.ajax({ url: 'http://localhost:50222/api/Viajes/Buscar', type: 'GET', data: datos },
                        'No se pudo exportar. Revisá la conexión y probá de nuevo.');
                    const registros = data.Results || [];
                    if (!registros.length) {
                        SGTL.toastError('No hay viajes para exportar con los filtros elegidos.');
                        return;
                    }
                    const limpio = function (v) { return String(v == null ? '' : v).trim(); };
                    SGTL.descargarCSV('Listado_Viajes.csv', [
                        'Número de viaje', 'Cliente', 'Fecha de inicio', 'Fecha de fin', 'Origen', 'Destino',
                        'N° transporte SAP', 'Número de remito', 'N° entrega Rukas', 'Cantidad de KM', 'Estado'
                    ], registros.map(function (v) {
                        return [
                            v.Viaje_ID, v.Cliente, formatearFecha(v.Fecha_Inicio), formatearFecha(v.Fecha_Fin), v.Origen, v.Destino,
                            limpio(v.Num_Transporte), limpio(v.Num_Remito), limpio(v.Num_de_Carga), limpio(v.Distancia_KM),
                            ESTADOS_VIAJE[v.Estado] || v.Estado
                        ];
                    }));
                } catch (error) {
                    SGTL.toastError(error.mensajeUsuario || 'No se pudo exportar. Probá de nuevo.');
                } finally {
                    listo();
                }
            }

            $(function () {
                $('#btnExportar').on('click', exportarViajes);
                $('#tablaViajes').on('click', '[data-accion="ver"]', function () {
                    const viaje = viajesPagina[$(this).data('id')];
                    if (viaje) mostrarDetallesViaje(viaje);
                });
            });

            function buscarViajes(page = 1) {
                const clienteIdRaw = $('#filtroClienteId').val().trim();
                const fechaDesde = $('#fechaRangoInicioViaje').data('start') || null;
                const fechaHasta = $('#fechaRangoInicioViaje').data('end') || null;
                const fechaFinDesde = $('#fechaRangoFinViaje').data('start') || null;
                const fechaFinHasta = $('#fechaRangoFinViaje').data('end') || null;

                const requestData = {
                    fechaDesde,
                    fechaHasta,
                    fechaFinDesde,
                    fechaFinHasta,
                    page,
                    pageSize
                };
                if (clienteIdRaw) {
                    requestData.clienteId = parseInt(clienteIdRaw, 10);
                }

                $.ajax({
                    url: 'http://localhost:50222/api/Viajes/Buscar',
                    type: 'GET',
                    data: requestData,
                    success: function (data) {
                        const tbody = $('#tablaViajes tbody');
                        tbody.empty();

                        viajesPagina = {};
                        data.Results.forEach(function (v) { viajesPagina[v.Viaje_ID] = v; });
                        if (data.Results.length === 0) {
                            SGTL.tabla.vacia('#tablaViajes tbody', 9);
                        } else {
                            data.Results.forEach(function (viaje) {
                                const row = `
                                    <tr>
                                        <td>${viaje.Viaje_ID}</td>
                                        <td>${formatearFecha(viaje.Fecha_Inicio)}</td>
                                        <td>${formatearFecha(viaje.Fecha_Fin)}</td>
                                        <td>${viaje.Origen}</td>
                                        <td>${viaje.Destino}</td>
                                        <td>${viaje.Num_Remito}</td>
                                        <td>${viaje.Distancia_KM}</td>
                                        <td class="text-center text-nowrap">${SGTL.estado(viaje.Estado || '', ESTADOS_VIAJE[viaje.Estado] || viaje.Estado)}</td>
                                        <td class="text-center">${SGTL.accionesFila([SGTL.botonFila('ver', { id: viaje.Viaje_ID })])}</td>
                                    </tr>
                                `;
                                tbody.append(row);
                            });
                        }

                        renderPagination(data.TotalRecords, pageSize, page);
                    },
                    error: function (xhr) {
                        console.error('Error al buscar viajes:', xhr);
                    }
                });
            }

            function renderPagination(totalRecords, tamanioActual, currentPage) {
                const totalPages = Math.ceil(totalRecords / tamanioActual);
                const paginationContainer = $('#pagination');
                if (window.PaginacionSGTL) {
                    window.PaginacionSGTL.render(paginationContainer.get(0), {
                        total: totalRecords, tamanioPagina: tamanioActual, pagina: currentPage,
                        alCambiarPagina: function (pagina) { buscarViajes(pagina); },
                        alCambiarTamanio: function (tamanio) { pageSize = tamanio; buscarViajes(1); }
                    });
                    return;
                }
                paginationContainer.empty();

                const prevDisabled = currentPage === 1 ? 'disabled' : '';
                const nextDisabled = currentPage === totalPages ? 'disabled' : '';

                paginationContainer.append(`
                    <li class="page-item ${prevDisabled}">
                        <a class="page-link" href="#" onclick="buscarViajes(${currentPage - 1})">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                `);

                for (let i = 1; i <= totalPages; i++) {
                    const activeClass = currentPage === i ? 'active' : '';
                    paginationContainer.append(`
                        <li class="page-item ${activeClass}">
                            <a class="page-link" href="#" onclick="buscarViajes(${i})">${i}</a>
                        </li>
                    `);
                }

                paginationContainer.append(`
                    <li class="page-item ${nextDisabled}">
                        <a class="page-link" href="#" onclick="buscarViajes(${currentPage + 1})">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                `);
            }

            $(document).ready(function () {
                buscarViajes(currentPage);
            });

        </script>

</body>

</html>
