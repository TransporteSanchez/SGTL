<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar viajes · SGTL</title>

    <style>
        #app {
            display: none;
        }

        #loading-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
    </style>

    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">



    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
</head>

<body>
    <script src="assets/static/js/initTheme.js"></script>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando…</span>
        </div>
    </div>

    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <!--Header-->
            <header>

                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>

                        <!--btn para expandir Menú lateral-->


                        <!--Llamado a las opciones del header-->

                        <div id="header-container"></div>

                        <script src="./assets/static/js/header.js"></script>

                    </div>
                </nav>
            </header>

            <div class="page-heading">

                <!--Comienzo sección de la tabla-->
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">
                        <div class="card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <h5 class="card-title mb-1">
                                    <i class="bi bi-calendar-check me-2" aria-hidden="true"></i>Listar viajes
                                </h5>
                                <p class="text-muted mb-0">Consultá los viajes y su estado; para cambiarlos andá a Gestionar viajes.</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-outline-secondary" id="btnExportar"
                                    data-bs-toggle="tooltip" title="Exportar" aria-label="Exportar">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <form id="busquedaViajeForm" class="row g-3 align-items-end" novalidate>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="idviajeinput" class="form-label">Número</label>
                                    <input type="text" inputmode="numeric" class="form-control" id="idviajeinput" placeholder="123" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="clienteFiltroViaje" class="form-label">Cliente</label>
                                    <select class="form-select" id="clienteFiltroViaje"><option value="">Todos</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="fechaRangoInicioViaje" class="form-label">Fecha de inicio</label>
                                    <input type="text" class="form-control" id="fechaRangoInicioViaje" placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="fechaRangoFinViaje" class="form-label">Fecha de fin</label>
                                    <input type="text" class="form-control" id="fechaRangoFinViaje" placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="estadoFiltroViaje" class="form-label">Estado</label>
                                    <select class="form-select" id="estadoFiltroViaje"><option value="">Todos</option></select>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="referenciaFiltroViaje" class="form-label">N° remito / transporte / entrega</label>
                                    <input type="text" class="form-control" id="referenciaFiltroViaje" maxlength="20" placeholder="R-00101" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-12 col-lg-6 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-light">
                                        <i class="bi bi-search me-1" aria-hidden="true"></i>Buscar
                                    </button>
                                </div>
                            </form>
                            <div class="table-responsive mt-4">
                                <table class="table table-striped table-hover sgtl-tabla-ancha" id="tablaViajes">
                                    <thead>
                                        <tr>
                                            <th>Número de viaje</th>
                                            <th>Cliente</th>
                                            <th class="text-center">Fecha de inicio</th>
                                            <th class="text-center">Fecha de fin</th>
                                            <th>Origen</th>
                                            <th>Destino</th>
                                            <th>Número de remito</th>
                                            <th class="text-end">Cantidad de KM</th>
                                            <th class="text-center">Estado</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Contenido llenado dinámicamente -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Paginación -->
                            <nav>
                                <ul class="pagination justify-content-end" id="pagination">
                                </ul>
                            </nav>
                        </div>
                    </div>

                </section>
                <!--Fin sección de la tabla-->
            </div>

            <!--Footer-->

            <footer>
                <div id="footer-container"></div>

                <script src="./assets/static/js/footer.js"></script>
            </footer>
        </div>

        <!-- Ver detalle del viaje: lo arma viaje-detalle.js (el mismo modal que Gestionar viajes y el dashboard). -->

        <!-- Scripts -->
        <script src="assets/extensions/jquery/jqueryajax.js"></script>
        <script src="assets/compiled/js/app.js"></script>
        <script src="assets/static/js/sgtl-ui.js"></script>
        <script src="assets/static/js/viaje-detalle.js"></script>
        <script src="assets/static/js/components/sidebar.js"></script>
        <script src="assets/static/js/sidebar-loader.js"></script>
        <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
        <script src="assets/extensions/flatpickr/l10n/es.js"></script>
        <script src="assets/static/js/select-cliente-predictivo.js"></script>
        <script src="./assets/static/gestionContenido.js"></script>

        <!-- Carga de diseño y roles -->
        <script>
            window.onload = async function () {
                const loadingMessage = document.getElementById('loading-message');
                loadingMessage.style.display = 'block';
                document.getElementById('app').style.display = 'none';

                window.loadHeader();
                window.loadFooter();

                try {
                    if (typeof window.loadSidebar === 'function') {
                        await window.loadSidebar();
                    }
                    await loadSettings().catch(function (error) { console.warn('Sin la apariencia (logo y colores):', error); });  // F6, VM 25/10: la pantalla se usa igual  // o tu equivalente que llame applyStyles
                    adjustVisibilityBasedOnRole();  // si la página lo define
                    loadingMessage.style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                } catch (error) {
                    console.error('Error al cargar el header, footer o los datos:', error);
                    loadingMessage.innerText = 'No se pudo cargar la pantalla. Revisá la conexión y probá de nuevo.';
                }
            };
            
            function adjustVisibilityBasedOnRole() {
                const userRole = localStorage.getItem('userRole');
                const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

                if (userRole && userRole.toLowerCase() === 'admin') {
                    gestionarContenidoBtn.style.display = 'block';
                } else {
                    gestionarContenidoBtn.style.display = 'none';
                }
            }

            async function loadSettings() {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                    xhr.onload = function () {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            const data = JSON.parse(xhr.responseText);
                            if (data) {
                                const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                                applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                                resolve();
                            } else {
                                console.error('La respuesta de la API no contiene los datos esperados.');
                                reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                            }
                        } else {
                            console.error('Error en la petición:', xhr.statusText);
                            reject(new Error('Error en la carga de la API'));
                        }
                    };

                    xhr.onerror = function () {
                        console.error('Error al cargar la configuración de la API.');
                        reject(new Error('Error de red'));
                    };

                    xhr.send();
                });
            }

        </script>

        <!-- Buscador y Listar -->
        <script>
            const API = 'http://localhost:50222/api';
            let pageSize = 15;
            let currentPage = 1;
            let viajesPagina = {};

            // Etiquetas de estado; los colores salen de SGTL.estado (§4 del design system).
            const ESTADOS_VIAJE = {
                Registrado: 'Registrado',
                En_viaje: 'En viaje',
                Entregado: 'Entregado',
                Listo_para_facturar: 'Listo para facturar',
                Facturado: 'Facturado'
            };

            function texto(valor) { const t = String(valor == null ? '' : valor).trim(); return t || '—'; }

            // Km con coma decimal (§7.3): "402,3". Si lo guardado no es un número, se muestra tal cual.
            function kmTabla(valor) {
                var t = String(valor == null ? '' : valor).trim();
                var n = Number(t.replace(',', '.'));
                return t && isFinite(n) ? SGTL.km(n) : t;
            }

            // Filtros (§1.3): los mismos para buscar y para exportar.
            function filtrosViajes() {
                const inicio = SGTL.valorRango('#fechaRangoInicioViaje') || {};
                const fin = SGTL.valorRango('#fechaRangoFinViaje') || {};
                // Los mismos filtros que Gestionar viajes (§3.3): número, cliente, fechas, estado y referencia.
                const datos = {
                    idViaje: $('#idviajeinput').val().trim() || null,
                    fechaDesde: inicio.desde || null,
                    fechaHasta: inicio.hasta || null,
                    fechaFinDesde: fin.desde || null,
                    fechaFinHasta: fin.hasta || null,
                    estado: $('#estadoFiltroViaje').val() || null,
                    referencia: ($('#referenciaFiltroViaje').val() || '').trim() || null
                };
                const clienteId = $('#clienteFiltroViaje').val();
                if (clienteId) datos.clienteId = parseInt(clienteId, 10);
                return datos;
            }

            function cargarListas() {
                $.ajax({ url: API + '/Clientes', type: 'GET' }).done(function (data) {
                    const select = $('#clienteFiltroViaje');
                    (data || []).forEach(function (c) {
                        select.append($('<option>').val(c.Cliente_ID).text(c.Razon_Social || ('Cliente #' + c.Cliente_ID)));
                    });
                    SelectClientePredictivo.sincronizar('clienteFiltroViaje');
                });
            }

            // Exporta todo lo filtrado, no solo la página visible (§1.2).
            async function exportarViajes() {
                const listo = SGTL.procesando('#btnExportar');
                try {
                    const data = await SGTL.ajax({ url: API + '/Viajes/Buscar', type: 'GET', data: Object.assign(filtrosViajes(), { page: 1, pageSize: 0 }) },
                        'No se pudo exportar. Revisá la conexión y probá de nuevo.');
                    const registros = data.Results || [];
                    if (!registros.length) {
                        SGTL.toastError('No hay viajes para exportar con los filtros elegidos.');
                        return;
                    }
                    const limpio = function (v) { return String(v == null ? '' : v).trim(); };
                    SGTL.descargarCSV('Listado_Viajes.csv', [
                        'Número de viaje', 'Cliente', 'Fecha de inicio', 'Fecha de fin', 'Origen', 'Destino',
                        'N° transporte SAP', 'Número de remito', 'N° entrega Rukas', 'Cantidad de KM', 'Estado'
                    ], registros.map(function (v) {
                        return [
                            v.Viaje_ID, v.Cliente, SGTL.fecha(v.Fecha_Inicio), SGTL.fecha(v.Fecha_Fin), v.Origen, v.Destino,
                            limpio(v.Num_Transporte), limpio(v.Num_Remito), limpio(v.Num_de_Carga), limpio(v.Distancia_KM),
                            ESTADOS_VIAJE[v.Estado] || v.Estado
                        ];
                    }));
                } catch (error) {
                    SGTL.toastError(error.mensajeUsuario || 'No se pudo exportar. Probá de nuevo.');
                } finally {
                    listo();
                }
            }

            function buscarViajes(page = 1) {
                currentPage = page;
                const tbody = document.querySelector('#tablaViajes tbody');
                SGTL.tabla.cargando(tbody, 10);
                $.ajax({
                    url: API + '/Viajes/Buscar',
                    type: 'GET',
                    data: Object.assign(filtrosViajes(), { page, pageSize }),
                    success: function (data) {
                        const registros = data.Results || [];
                        viajesPagina = {};
                        registros.forEach(function (v) { viajesPagina[v.Viaje_ID] = v; });
                        if (!registros.length) {
                            SGTL.tabla.vacia(tbody, 10);
                        } else {
                            SGTL.tabla.llenar(tbody, registros.map(function (viaje) {
                                return '<tr>' +
                                    '<td>' + viaje.Viaje_ID + '</td>' +
                                    '<td>' + SGTL.escapar(viaje.Cliente) + '</td>' +
                                    '<td class="text-center">' + SGTL.fecha(viaje.Fecha_Inicio) + '</td>' +
                                    '<td class="text-center">' + SGTL.fecha(viaje.Fecha_Fin) + '</td>' +
                                    '<td>' + SGTL.escapar(viaje.Origen) + '</td>' +
                                    '<td>' + SGTL.escapar(viaje.Destino) + '</td>' +
                                    '<td>' + SGTL.escapar(texto(viaje.Num_Remito)) + '</td>' +
                                    '<td class="text-end">' + SGTL.escapar(kmTabla(viaje.Distancia_KM)) + '</td>' +
                                    '<td class="text-center">' + SGTL.estado(viaje.Estado || '', ESTADOS_VIAJE[viaje.Estado] || viaje.Estado) + '</td>' +
                                    '<td class="text-center">' + SGTL.accionesFila([SGTL.botonFila('ver', { id: viaje.Viaje_ID })]) + '</td>' +
                                    '</tr>';
                            }).join(''));
                        }
                        SGTL.tabla.paginacion('#pagination', {
                            total: data.TotalRecords || 0, tamanioPagina: pageSize, pagina: page,
                            alCambiarPagina: function (pagina) { buscarViajes(pagina); },
                            alCambiarTamanio: function (tamanio) { pageSize = tamanio; buscarViajes(1); }
                        });
                    },
                    error: function (xhr) {
                        SGTL.tabla.vacia(tbody, 10, 'No se pudieron cargar los viajes.');
                        SGTL.tabla.paginacion('#pagination', { total: 0 });
                        SGTL.toastError(SGTL.mensajeError(xhr, 'No se pudieron cargar los viajes. Probá de nuevo.'));
                    }
                });
            }

            $(function () {
                const buscar = function () { SelectClientePredictivo.sincronizar('clienteFiltroViaje'); buscarViajes(1); };
                ['#fechaRangoInicioViaje', '#fechaRangoFinViaje'].forEach(function (selector) {
                    SGTL.rangoFechas(selector, { onClose: function (fechas) { if (fechas.length !== 1) buscarViajes(1); } });
                });
                Object.keys(ESTADOS_VIAJE).forEach(function (estado) {
                    $('#estadoFiltroViaje').append($('<option>').val(estado).text(ESTADOS_VIAJE[estado]));
                });
                SGTL.filtros(['#idviajeinput', '#clienteFiltroViaje', '#fechaRangoInicioViaje', '#fechaRangoFinViaje',
                    '#estadoFiltroViaje', '#referenciaFiltroViaje'], buscar);
                SelectClientePredictivo.inicializar('clienteFiltroViaje', { placeholder: 'Todos los clientes' });
                $('#clienteFiltroViaje, #estadoFiltroViaje').on('change', function () { buscarViajes(1); });
                $('#idviajeinput').on('input', function () { this.value = this.value.replace(/[^0-9]/g, ''); });
                $('#busquedaViajeForm').on('submit', function (evento) { evento.preventDefault(); buscarViajes(1); });
                $('#btnExportar').on('click', exportarViajes);
                $('#tablaViajes').on('click', '[data-accion="ver"]', function () {
                    const viaje = viajesPagina[$(this).data('id')];
                    if (viaje) SGTLDetalleViaje.abrir(viaje);
                });
                cargarListas();
                buscarViajes(1);
            });
        </script>

</body>

</html>
