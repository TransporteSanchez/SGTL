<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Dashboard</title>

    <link rel="shortcut icon" href="./assets/compiled/svg/ts-icon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="assets/static/css/sgtl.css">
</head>

<body>
    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>

            <div class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4">
                    <div class="card rounded">
                        <div class="card-header">
                            <h1 class="card-title h5 mb-1"><i class="bi bi-grid-fill me-2" aria-hidden="true"></i>Dashboard</h1>
                            <p class="text-muted mb-0" id="periodoTexto"></p>
                        </div>

                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <div class="col-12 col-md-auto">
                                    <span class="form-label d-block" id="periodoEtiqueta">Período</span>
                                    <div class="btn-group" role="group" aria-labelledby="periodoEtiqueta" id="periodoRapido">
                                        <input type="radio" class="btn-check" name="periodo" id="periodoMes" value="mes">
                                        <label class="btn btn-outline-primary" for="periodoMes">Último mes</label>
                                        <input type="radio" class="btn-check" name="periodo" id="periodoTrimestre" value="trimestre" checked>
                                        <label class="btn btn-outline-primary" for="periodoTrimestre">Trimestre</label>
                                        <input type="radio" class="btn-check" name="periodo" id="periodoSemestre" value="semestre">
                                        <label class="btn btn-outline-primary" for="periodoSemestre">Semestre</label>
                                        <input type="radio" class="btn-check" name="periodo" id="periodoAnio" value="anio">
                                        <label class="btn btn-outline-primary" for="periodoAnio">Año</label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="periodoRango" class="form-label">Otras fechas</label>
                                    <input type="text" id="periodoRango" class="form-control" placeholder="Desde y hasta">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="viajes">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0">Recorridos más usados</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-recorridos"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="viajes">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0">Rechazos por cliente y destino</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-rechazos"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="flota">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0" id="titulo-kmcamionmes">Km por camión y por mes</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-camiones"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="flota">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0" id="titulo-ingresoscamionmes">Ingresos por camión y por mes</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-ingresos"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="choferes">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0" id="titulo-kmchofermes">Km por chofer y por mes</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-choferes"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>

                    <div class="card rounded" data-tema="facturacion">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0" id="titulo-facturacionmes">Facturación por cliente y por mes</h2>
                        </div>
                        <div class="card-body">
                            <div id="calor-facturacion"><p class="text-muted text-center py-4 mb-0">Cargando…</p></div>
                        </div>
                    </div>
                </section>
            </div>

            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/dashboard.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.loadHeader().catch(function (error) { console.warn('No se pudo cargar el encabezado.', error); });
            window.loadFooter();
            fetch(SGTL.api + '/GestionContenido/1').then(function (respuesta) {
                if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
                return respuesta.json();
            }).then(function (contenido) {
                window.applyStyles(contenido.Logo, contenido.ColorFondo, contenido.ColorBotonesMenu, contenido.ContenidoPiePagina);
            }).catch(function (error) { console.warn('No se pudo cargar la apariencia de SGTL.', error); });

            SGTLDashboard.iniciar();
        });
    </script>
</body>

</html>
