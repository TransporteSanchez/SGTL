    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
    <style>
        .grid-stack { background: transparent; }
        .grid-stack-item-content { inset: 0; display: flex; }
        .grid-stack-item-content > .card { width: 100%; height: 100%; margin-bottom: 0; display: flex; flex-direction: column; overflow: hidden; }
        .grid-stack-item-content > .card > .card-header { flex: 0 0 auto; padding: 1rem 1.25rem .5rem; }
        .grid-stack-item-content > .card > .card-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: .5rem 1.25rem 1rem; }
        #chart-viajes-mensual { height: 100%; }
        /* El gráfico ya se ajusta al alto de la tarjeta; lo que asoma son los cartelitos flotantes de ApexCharts. */
        .grid-stack-item[gs-id="chart"] .card-body { overflow: hidden; }
        .grid-stack.editando .grid-stack-item-content > .card { outline: 2px dashed rgba(13,110,253,.55); outline-offset: -2px; }
        .grid-stack.editando .card-header { cursor: move; }
        #widgetsChecklist .form-check-input { cursor: pointer; }
        /* Fila de "¡Bienvenido!" fija debajo de la barra de arriba: al bajar, las tarjetas pasan por detrás.
           El alto de la barra y el relleno de la página los completa fijarEncabezadoTablero(). */
        #encabezadoTablero {
            position: sticky;
            top: var(--alto-barra-superior, 90px);
            z-index: 8;
            background-color: var(--sgtl-fondo, #e4eef8);
            margin: 0 calc(-1 * var(--relleno-pagina, 2rem)) 1rem;
            padding: 1.5rem var(--relleno-pagina, 2rem);
        }
    </style>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadChoferesActivos();
                loadCamionesActivos();
                loadCostoPorViaje();
                loadViajesEvolucionMensual();
                loadTopClientesFacturacion();
                loadCalendarioViajes();

                if (typeof window.initDashboardGrid === 'function') { window.initDashboardGrid(); }

                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
                if (window.fijarEncabezadoTablero) window.fijarEncabezadoTablero();
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function loadCalendarioViajes() {
            var $el = $('#calendarioViajes');
            if (!$el.length || !$.fn.fullCalendar) { return; }
            $.ajax({ url: API_BASE + '/Viajes', type: 'GET' })
                .done(function (data) {
                    var eventos = (data || []).map(function (v) {
                        return {
                            title: 'Viaje #' + v.Viaje_ID + ': ' + (v.Origen || '') + ' -> ' + (v.Destino || ''),
                            start: v.Fecha_Inicio,
                            end: v.Fecha_Fin
                        };
                    });
                    $el.fullCalendar({
                        locale: 'es',
                        defaultView: 'month',
                        header: { left: 'prev,next', center: 'title', right: 'today' },
                        height: 'auto',
                        // Semanas de ~85 px: entran el día, 2 viajes y el "+ más" sin hacer el mes tan alto.
                        aspectRatio: 1.8,
                        fixedWeekCount: false,
                        eventLimit: 2,
                        titleFormat: 'MMM YYYY',
                        events: eventos,
                        // Al cambiar de mes cambia la cantidad de semanas: la tarjeta se ajusta para mostrarlo entero.
                        viewRender: function () { if (window.ajustarWidgetsVivos) setTimeout(window.ajustarWidgetsVivos, 0); }
                    });
                    if (window.ajustarWidgetsVivos) setTimeout(window.ajustarWidgetsVivos, 90);
                })
                .fail(function () {
                    $el.html('<p class="text-muted text-center py-4">No se pudieron cargar los viajes.</p>');
                });
        }

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;
                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }
    </script>

    <script>
        const API_BASE = 'http://localhost:50222/api';

        function loadChoferesActivos() {
            $.ajax({
                url: API_BASE + '/Choferes',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    const total = data.length;
                    const activos = data.filter(c => (c.EstadoChofer || '').toLowerCase() === 'activo').length;
                    const pct = total > 0 ? Math.round((activos / total) * 100) : 0;
                    document.getElementById('choferes-activos-texto').textContent = activos + ' / ' + total;
                    document.getElementById('choferes-activos-bar').style.width = pct + '%';
                },
                error: function (err) {
                    if (err.status === 404) {
                        document.getElementById('choferes-activos-texto').textContent = '0 / 0';
                    } else {
                        console.error('Error Choferes:', err);
                    }
                }
            });
        }

        function loadCostoPorViaje() {
            $.ajax({
                url: API_BASE + '/Viajes/ResumenCosto',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    const elPromedio = document.getElementById('costo-promedio-texto');
                    const elSubtitulo = document.getElementById('costo-por-viaje-subtitulo');
                    const elTotalViajes = document.getElementById('costo-total-viajes');
                    if (data && data.cantidadViajes > 0) {
                        elPromedio.textContent = typeof data.costoPromedio === 'number'
                            ? '$' + Number(data.costoPromedio).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 })
                            : '—';
                        elTotalViajes.textContent = data.cantidadViajes + ' viajes';
                        if (data.costoTotal != null) {
                            elSubtitulo.textContent = 'Total: $' + Number(data.costoTotal).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
                        }
                    } else {
                        elPromedio.textContent = '—';
                        elSubtitulo.textContent = 'Costo promedio';
                        elTotalViajes.textContent = (data && data.cantidadViajes !== undefined ? data.cantidadViajes : 0) + ' viajes';
                    }
                },
                error: function (err) {
                    document.getElementById('costo-promedio-texto').textContent = '—';
                    document.getElementById('costo-por-viaje-subtitulo').textContent = 'Costo promedio';
                    document.getElementById('costo-total-viajes').textContent = 'No disponible';
                    if (err.status !== 404) console.error('Error ResumenCosto:', err);
                }
            });
        }

        function loadCamionesActivos() {
            $.ajax({
                url: API_BASE + '/Camiones',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    const total = data.length;
                    document.getElementById('camiones-activos-texto').textContent = total + ' / ' + total;
                    document.getElementById('camiones-activos-bar').style.width = total > 0 ? '100%' : '0%';
                },
                error: function (err) {
                    if (err.status === 404) {
                        document.getElementById('camiones-activos-texto').textContent = '0 / 0';
                    } else {
                        console.error('Error Camiones:', err);
                    }
                }
            });
        }

        function loadViajesEvolucionMensual() {
            $.ajax({
                url: API_BASE + '/Viajes',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                    const porMes = {};
                    meses.forEach((m, i) => { porMes[i + 1] = 0; });
                    const viajes = Array.isArray(data) ? data : ((data && (data.Results || data.results)) || []);
                    viajes.forEach(v => {
                        // Tomar el mes directamente del valor ISO evita que la zona horaria
                        // desplace la fecha y deje la evolución en un mes incorrecto.
                        const coincidencia = String(v.Fecha_Inicio || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
                        const mes = coincidencia ? parseInt(coincidencia[2], 10) : NaN;
                        if (mes >= 1 && mes <= 12) porMes[mes] = (porMes[mes] || 0) + 1;
                    });
                    const series = meses.map((_, i) => porMes[i + 1] || 0);
                    const contenedor = document.querySelector('#chart-viajes-mensual');
                    if (!contenedor) return;
                    if (window.__viajesChart) window.__viajesChart.destroy();
                    contenedor.innerHTML = '';

                    const options = {
                        chart: { type: 'area', height: 280, toolbar: { show: false }, zoom: { enabled: false }, parentHeightOffset: 0 },
                        colors: ['#435ebe'],
                        stroke: { curve: 'smooth', width: 3 },
                        fill: { type: 'solid', opacity: 0.18 },
                        markers: { size: 4, colors: ['#ffffff'], strokeColors: '#435ebe', strokeWidth: 3, hover: { size: 6 } },
                        grid: { borderColor: '#e6e9ef', strokeDashArray: 0 },
                        xaxis: { categories: meses },
                        yaxis: { min: 0, forceNiceScale: true, tickAmount: 6, decimalsInFloat: 0 },
                        dataLabels: { enabled: false },
                        tooltip: { y: { formatter: function (val) { return val + (val === 1 ? ' viaje' : ' viajes'); } } }
                    };
                    const chart = new ApexCharts(contenedor, { ...options, series: [{ name: 'Viajes', data: series }] });
                    window.__viajesChart = chart;
                    chart.render();
                    if (window.ajustarWidgetsVivos) setTimeout(window.ajustarWidgetsVivos, 90);
                },
                error: function (err) {
                    if (err.status === 404) {
                        document.getElementById('chart-viajes-mensual').innerHTML = '<p class="text-muted text-center py-4">No hay datos de viajes</p>';
                    } else {
                        document.getElementById('chart-viajes-mensual').innerHTML = '<p class="text-danger text-center py-4">Error al cargar viajes</p>';
                        console.error('Error Viajes:', err);
                    }
                }
            });
        }

        function loadTopClientesFacturacion() {
            $.ajax({
                url: API_BASE + '/dashboard/top-clientes-facturacion?cantidad=5',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    const lista = document.getElementById('top-clientes-list');
                    if (!data || data.length === 0) {
                        lista.innerHTML = '<div class="text-muted text-center py-4">No hay comprobantes emitidos</div>';
                        return;
                    }
                    const escaparHtml = valor => String(valor == null ? '' : valor)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/\"/g, '&quot;').replace(/'/g, '&#039;');
                    const formatearImporte = valor => new Intl.NumberFormat('es-AR', {
                        style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2
                    }).format(Number(valor) || 0);

                    lista.innerHTML = data.map(c => {
                        const nombre = (c.RazonSocial || c.Razon_Social || c.Nombre || 'Sin nombre').trim();
                        const facturacion = formatearImporte(c.Facturacion);
                        return '<div class="list-group-item d-flex justify-content-between align-items-center gap-3"><span>' + escaparHtml(nombre) + '</span><strong class="text-nowrap">' + facturacion + '</strong></div>';
                    }).join('');
                },
                error: function (err) {
                    document.getElementById('top-clientes-list').innerHTML = '<div class="text-muted text-center py-4">No se pudo cargar la facturación</div>';
                    console.error('Error Top clientes en facturación:', err);
                }
            });
        }
    </script>

    <!-- ================= Dashboard personalizable (Gridstack) ================= -->
    <script>
        (function () {
            var API_DL = 'http://localhost:50222/api';
            var GRID = null;
            var enEdicion = false;

            var WIDGETS = [
                { id: 'choferes', label: 'Choferes activos' },
                { id: 'camiones', label: 'Camiones activos' },
                { id: 'costo', label: 'Costo por viaje' },
                { id: 'chart', label: 'Viajes - Evolución mensual' },
                { id: 'topclientes', label: 'Top clientes en facturación' },
                { id: 'calendario', label: 'Calendario de viajes' }
            ];
            var LAYOUT_DEFAULT = [
                { id: 'choferes', x: 0, y: 0, w: 4, h: 3 },
                { id: 'camiones', x: 4, y: 0, w: 4, h: 3 },
                { id: 'costo', x: 8, y: 0, w: 4, h: 3 },
                { id: 'chart', x: 0, y: 3, w: 8, h: 5 },
                { id: 'topclientes', x: 8, y: 3, w: 4, h: 5 },
                { id: 'calendario', x: 0, y: 8, w: 12, h: 6 }
            ];
            // Alto mínimo de cada tarjeta (en filas): por debajo de esto se esconde contenido.
            var ALTO_MINIMO = { choferes: 3, camiones: 3, costo: 3, chart: 4, topclientes: 4, calendario: 5 };

            function el(id) { return document.getElementById(id); }
            // makeWidget sobre una tarjeta que ya está en la grilla le crea un segundo nodo: al agrandarla o
            // esconderla se tocaba ese y se guardaba el otro. Solo se agrega si todavía no está.
            function agregarAlGrid(e) {
                if (e.gridstackNode && GRID.engine.nodes.indexOf(e.gridstackNode) !== -1) return;
                try { GRID.makeWidget(e); } catch (x) { }
            }
            function itemEl(id) { return document.querySelector('.grid-stack-item[gs-id="' + id + '"]'); }
            function usuario() { try { return localStorage.getItem('username'); } catch (e) { return null; } }

            // Alto disponible dentro del cuerpo de la tarjeta (sin el relleno).
            function altoUtil(body) {
                var cs = getComputedStyle(body);
                return body.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
            }

            var ALTO_FILA = 62, MARGEN = 8;

            function ajustarAltoCalendario() {
                var cal = document.getElementById('calendarioViajes');
                var item = itemEl('calendario');
                if (!GRID || !cal || !item || item.style.display === 'none' || !item.gridstackNode) return;
                var card = item.querySelector('.card');
                var body = cal.closest('.card-body');
                var cs = getComputedStyle(body);
                var necesario = card.querySelector('.card-header').offsetHeight +
                    parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0) + cal.scrollHeight;
                var filas = Math.ceil((necesario + MARGEN * 2) / ALTO_FILA);
                var nodo = item.gridstackNode;
                if (nodo.h !== filas || nodo.minH !== filas) GRID.update(item, { h: filas, minH: filas });
            }

            function refrescarVivos() {
                // Gráfico: ajustar altura al alto disponible del contenedor
                try {
                    var cc = document.getElementById('chart-viajes-mensual');
                    var body = cc ? cc.closest('.card-body') : null;
                    if (window.__viajesChart && body && body.clientHeight) {
                        var h = Math.max(150, altoUtil(body));
                        window.__viajesChart.updateOptions({ chart: { height: h } }, false, false);
                    } else {
                        window.dispatchEvent(new Event('resize'));
                    }
                } catch (e) { try { window.dispatchEvent(new Event('resize')); } catch (x) { } }

                // Calendario: se muestra el mes completo (alto natural) y la tarjeta toma el alto que necesita.
                try { ajustarAltoCalendario(); } catch (e) { }
            }
            window.ajustarWidgetsVivos = refrescarVivos;

            // El alto de la barra de arriba y el relleno de la página cambian según el ancho de la pantalla.
            function fijarEncabezadoTablero() {
                var barra = document.querySelector('#main > header');
                var contenido = document.getElementById('main-content');
                var raiz = document.documentElement.style;
                // Mientras la pantalla está oculta mide 0: en ese caso queda el valor por defecto (90 px).
                if (barra && barra.offsetHeight) raiz.setProperty('--alto-barra-superior', barra.offsetHeight + 'px');
                if (contenido) raiz.setProperty('--relleno-pagina', getComputedStyle(contenido).paddingLeft);
            }
            window.addEventListener('resize', fijarEncabezadoTablero);
            window.fijarEncabezadoTablero = fijarEncabezadoTablero;

            window.initDashboardGrid = function () {
                if (typeof GridStack === 'undefined') { return; } // si el CDN no cargó, el dashboard sigue estático
                GRID = GridStack.init({
                    column: 12,
                    cellHeight: 62,
                    margin: 8,
                    float: false,
                    staticGrid: true,
                    handle: '.card-header',
                    columnOpts: { breakpointForWindow: true, breakpoints: [{ w: 768, c: 1 }] }
                });
                GRID.on('resizestop change', function () { refrescarVivos(); });
                construirChecklist();
                wireToolbar();
                cargarLayout();
            };

            // La API todavía no tiene /DashboardLayout (responde 404): mientras tanto el diseño se guarda
            // en el navegador, por usuario. Si la API lo devuelve, tiene prioridad.
            function claveLocal(u) { return 'sgtl-dashboard-' + u; }
            function leerLocal(u) {
                try { return JSON.parse(localStorage.getItem(claveLocal(u)) || 'null'); } catch (e) { return null; }
            }
            function guardarLocal(u, layout) {
                try { localStorage.setItem(claveLocal(u), JSON.stringify(layout)); return true; } catch (e) { return false; }
            }
            function borrarLocal(u) {
                try { localStorage.removeItem(claveLocal(u)); } catch (e) { }
            }

            function cargarLayout() {
                var u = usuario();
                if (!u) { aplicarLayout(LAYOUT_DEFAULT, []); return; }
                function aplicar(parsed) {
                    parsed = parsed || leerLocal(u);
                    if (parsed && parsed.items && parsed.items.length) aplicarLayout(parsed.items, parsed.hidden || []);
                    else aplicarLayout(LAYOUT_DEFAULT, []);
                }
                fetch(API_DL + '/DashboardLayout?username=' + encodeURIComponent(u))
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        var parsed = null;
                        if (data && data.Layout) { try { parsed = JSON.parse(data.Layout); } catch (e) { } }
                        aplicar(parsed);
                    })
                    .catch(function () { aplicar(null); });
            }

            function aplicarLayout(items, hidden) {
                hidden = hidden || [];
                if (!GRID) return;
                GRID.batchUpdate();
                // asegurar que todos estén visibles y en el grid
                WIDGETS.forEach(function (w) {
                    var e = itemEl(w.id);
                    if (!e) return;
                    e.style.display = '';
                    agregarAlGrid(e);
                });
                // aplicar posiciones de los visibles
                var visibles = items.filter(function (it) { return hidden.indexOf(it.id) === -1; }).map(function (it) {
                    var minimo = ALTO_MINIMO[it.id] || 1;
                    return Object.assign({}, it, { h: Math.max(it.h || minimo, minimo), minH: minimo });
                });
                GRID.load(visibles, false);
                // ocultar los marcados
                hidden.forEach(function (id) {
                    var e = itemEl(id);
                    if (!e) return;
                    try { GRID.removeWidget(e, false); } catch (x) { }
                    e.style.display = 'none';
                });
                GRID.commit();
                actualizarChecklist(hidden);
                setTimeout(refrescarVivos, 80);
            }

            function mostrarWidget(id) {
                var e = itemEl(id); if (!e || !GRID) return;
                e.style.display = '';
                agregarAlGrid(e);
                setTimeout(refrescarVivos, 60);
            }
            function ocultarWidget(id) {
                var e = itemEl(id); if (!e || !GRID) return;
                try { GRID.removeWidget(e, false); } catch (x) { }
                e.style.display = 'none';
            }

            function construirChecklist() {
                var cont = el('widgetsChecklist'); if (!cont) return;
                cont.innerHTML = '';
                WIDGETS.forEach(function (w) {
                    var lbl = document.createElement('label');
                    lbl.className = 'd-flex align-items-center gap-2 py-1 mb-0';
                    lbl.style.cursor = 'pointer';
                    lbl.innerHTML = '<input type="checkbox" class="form-check-input mt-0" data-wid="' + w.id + '" checked> <span>' + w.label + '</span>';
                    cont.appendChild(lbl);
                });
                cont.addEventListener('change', function (e) {
                    var cb = e.target.closest('input[data-wid]'); if (!cb) return;
                    var id = cb.getAttribute('data-wid');
                    if (cb.checked) mostrarWidget(id); else ocultarWidget(id);
                });
            }
            function actualizarChecklist(hidden) {
                var cont = el('widgetsChecklist'); if (!cont) return;
                Array.prototype.forEach.call(cont.querySelectorAll('input[data-wid]'), function (cb) {
                    cb.checked = hidden.indexOf(cb.getAttribute('data-wid')) === -1;
                });
            }

            function entrarEdicion() {
                enEdicion = true;
                if (GRID) GRID.setStatic(false);
                var gs = document.querySelector('.grid-stack'); if (gs) gs.classList.add('editando');
                el('btnPersonalizar').style.display = 'none';
                el('btnGuardarLayout').style.display = '';
                el('btnCancelarLayout').style.display = '';
                el('btnResetLayout').style.display = '';
                el('widgetsMenu').style.display = '';
            }
            function salirEdicion() {
                enEdicion = false;
                if (GRID) GRID.setStatic(true);
                var gs = document.querySelector('.grid-stack'); if (gs) gs.classList.remove('editando');
                el('btnPersonalizar').style.display = '';
                el('btnGuardarLayout').style.display = 'none';
                el('btnCancelarLayout').style.display = 'none';
                el('btnResetLayout').style.display = 'none';
                el('widgetsMenu').style.display = 'none';
                el('widgetsPanel').style.display = 'none';
            }

            function guardarLayout() {
                var u = usuario();
                if (!u || !GRID) { salirEdicion(); return; }
                var hidden = [];
                Array.prototype.forEach.call(el('widgetsChecklist').querySelectorAll('input[data-wid]'), function (cb) {
                    if (!cb.checked) hidden.push(cb.getAttribute('data-wid'));
                });
                // A mano y no con GRID.save(): gridstack omite el alto de algunas tarjetas y al volver quedaban con el mínimo.
                var items = GRID.engine.nodes.map(function (n) {
                    return { id: n.id || (n.el && n.el.getAttribute('gs-id')), x: n.x, y: n.y, w: n.w, h: n.h };
                });
                var layout = { items: items, hidden: hidden };
                guardarLocal(u, layout);
                var payload = { Nombre_Usuario: u, Layout: JSON.stringify(layout) };
                fetch(API_DL + '/DashboardLayout', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function () { }).catch(function () { })
                    .then(function () { salirEdicion(); refrescarVivos(); });
            }

            function cancelarEdicion() { salirEdicion(); cargarLayout(); }

            function restablecerLayout() {
                var u = usuario();
                function aplicarDefault() {
                    aplicarLayout(LAYOUT_DEFAULT, []);
                    salirEdicion();
                }
                if (!u) { aplicarDefault(); return; }
                borrarLocal(u);
                fetch(API_DL + '/DashboardLayout?username=' + encodeURIComponent(u), { method: 'DELETE' })
                    .then(aplicarDefault).catch(aplicarDefault);
            }

            function wireToolbar() {
                el('btnPersonalizar').addEventListener('click', entrarEdicion);
                el('btnGuardarLayout').addEventListener('click', guardarLayout);
                el('btnCancelarLayout').addEventListener('click', cancelarEdicion);
                el('btnResetLayout').addEventListener('click', restablecerLayout);
                el('btnWidgets').addEventListener('click', function (e) {
                    e.stopPropagation();
                    var p = el('widgetsPanel');
                    p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
                });
                document.addEventListener('click', function (e) {
                    if (!e.target.closest('#widgetsMenu')) { el('widgetsPanel').style.display = 'none'; }
                });
            }
        })();
    </script>

</body>
