<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · SGTL</title>
    <style>
        #app {
            display: none;
        }

        #loading-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
    </style>

    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">

    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
    <link rel="stylesheet" href="./assets/static/css/tableros.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@3.10.2/dist/fullcalendar.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
    <style>
        /* Las tarjetas son las de tableros.css; acá, solo la grilla de Personalizar y el encabezado. */
        .grid-stack { background: transparent; }
        .grid-stack-item-content { inset: 0; display: flex; }
        .grid-stack.editando .grid-stack-item-content > .card { outline: 2px dashed rgba(67,94,190,.55); outline-offset: -2px; }
        .grid-stack.editando .card-header { cursor: move; }
        /* Fila de "¡Bienvenido!" fija debajo de la barra de arriba: al bajar, las tarjetas pasan por detrás.
           El alto de la barra y el relleno de la página los completa fijarEncabezadoTablero(). */
        #encabezadoTablero {
            position: sticky;
            top: var(--alto-barra-superior, 90px);
            z-index: 8;
            background-color: var(--sgtl-fondo, #e4eef8);
            margin: 0 calc(-1 * var(--relleno-pagina, 2rem)) 1rem;
            padding: 1.5rem var(--relleno-pagina, 2rem);
        }
        /* En celular las tarjetas van en una sola columna: no hay nada que acomodar, y la fila de arriba
           (con el período) ocuparía un cuarto de la pantalla si quedara fija. */
        @media (max-width: 767.98px) {
            #btnPersonalizar { display: none !important; }
            #encabezadoTablero { position: static; }
        }
        #periodoRango + .form-control, #periodoRango { width: 13.5rem; background-color: #fff; }
        /* El título queda a la altura de la fila de botones (40 px), con el texto del período debajo de ellos. */
        #encabezadoTablero > h3 { line-height: 40px; }
    </style>
</head>

<body>
    <script src="assets/static/js/initTheme.js"></script>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando…</span>
        </div>
    </div>

    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>
                        <div id="header-container"></div>
                        <script src="./assets/static/js/header.js"></script>
                    </div>
                </nav>
            </header>

            <div id="main-content">
                <div class="page-heading d-flex justify-content-between align-items-start flex-wrap gap-2" id="encabezadoTablero">
                    <h3 class="mb-0">¡Bienvenido!</h3>
                    <!-- Período: los botones y, debajo, qué fechas abarca y con cuáles se compara (pedido de Rocío, 22/10). -->
                    <div class="d-flex flex-column align-items-start align-items-md-end gap-1">
                    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-md-end" id="dash-toolbar">
                        <div class="sgtl-segmentado" role="group" aria-label="Período" id="periodoRapido">
                            <button type="button" class="btn btn-sm" data-periodo="mes" aria-pressed="false">Último mes</button>
                            <button type="button" class="btn btn-sm" data-periodo="trimestre" aria-pressed="false">Trimestre</button>
                            <button type="button" class="btn btn-sm" data-periodo="semestre" aria-pressed="false">Semestre</button>
                            <button type="button" class="btn btn-sm" data-periodo="anio" aria-pressed="false">Año</button>
                        </div>
                        <input type="text" class="form-control form-control-sm" id="periodoRango" placeholder="Desde y hasta" aria-label="Desde y hasta">
                        <!-- Personalizar (24/10): los tableros se suman con la estrella en Tableros; acá se acomodan y se sacan. -->
                        <span id="agregarTablerosEnvoltura" style="display:none;"><a href="tableros.html" class="btn btn-light-secondary" id="btnAgregarTableros"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Agregar tableros</a></span>
                        <button class="btn btn-outline-secondary" id="btnResetLayout" style="display:none;"><i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>Restablecer</button>
                        <button class="btn btn-light-secondary" id="btnCancelarLayout" style="display:none;">Cancelar</button>
                        <button class="btn btn-primary" id="btnGuardarLayout" style="display:none;"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Guardar</button>
                        <button class="btn btn-primary" id="btnPersonalizar"><i class="bi bi-sliders me-1" aria-hidden="true"></i>Personalizar</button>
                    </div>
                    <p class="text-muted small mb-0 text-md-end" id="periodoTexto">&nbsp;</p>
                    </div>
                </div>

                <div class="page-content">
                    <!-- Cambios para revisar (§33 y §43 de PENDIENTES): fija, sin estrella, para quien puede resolver algo; sin nada, no se ve. -->
                    <div id="cambiosTarifaFija" class="px-2 mb-2"></div>
                    <!-- Sin favoritos: el usuario sacó todos los tableros de su dashboard. -->
                    <div class="card rounded" id="dashVacio" style="display:none;">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-star fs-2 text-muted" aria-hidden="true"></i>
                            <h5 class="mt-2 mb-1">Tu dashboard no tiene tableros</h5>
                            <p class="text-muted mb-3">Marcá con la estrella los que quieras ver acá en Tableros, o volvé al dashboard de siempre.</p>
                            <div class="d-flex justify-content-center flex-wrap gap-2" id="dashVacioAcciones"></div>
                        </div>
                    </div>
                    <!-- Los tableros favoritos del usuario: los arma tableros-catalogo.js y los dibuja dashboard.js. -->
                    <div class="grid-stack"></div>
                </div>

                <footer>
                    <div id="footer-container"></div>
                    <script src="./assets/static/js/footer.js"></script>
                </footer>
            </div>
        </div>
    </div>

    <!-- Detalle de un viaje (últimos, próximos y calendario): lo arma viaje-detalle.js, el mismo de Gestionar viajes. -->

    <script src="assets/extensions/jquery/jquery.min.js"></script>
    <!-- moment solo queda porque lo necesita FullCalendar 3 (calendario de próximos viajes). -->
    <script src="assets/extensions/jquery/moment.min.js"></script>
    <script src="assets/extensions/fullcalendar/fullcalendar.min.js"></script>
    <script src="assets/extensions/fullcalendar/locale/es.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/extensions/apexcharts/apexcharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/viaje-detalle.js"></script>
    <script src="./assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/tableros-catalogo.js"></script>
    <script src="assets/static/js/cambios-tarifa.js"></script>
    <script src="assets/static/js/dashboard.js"></script>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings().catch(function (error) { console.warn('Sin la apariencia (logo y colores):', error); });  // F6, VM 25/10: la pantalla se usa igual
                adjustVisibilityBasedOnRole();
                // Primero las tarjetas de los favoritos (de la API); después se dibujan sus datos.
                await window.armarTablero();
                window.SGTLDashboard.iniciar();
                if (window.SGTLCambiosTarifa) SGTLCambiosTarifa.tarjetaFija(document.getElementById('cambiosTarifaFija'));
                if (window.iniciarGrillaTablero) window.iniciarGrillaTablero();

                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
                if (window.fijarEncabezadoTablero) window.fijarEncabezadoTablero();
                // Con la pantalla a la vista: el calendario y los gráficos que esperaban poder medirse.
                window.SGTLDashboard.alMostrar();
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;
                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }
    </script>

    <!-- ================= Dashboard personalizable (Gridstack) ================= -->
    <script>
        (function () {
            var GRID = null;
            var enEdicion = false;
            var favoritos = [];   // lo guardado: [{ id, x, y, w, h }]
            var quitados = [];    // sacados con la estrella en Personalizar, todavía sin guardar

            function el(id) { return document.getElementById(id); }
            function itemEl(id) { return document.querySelector('.grid-stack-item[gs-id="' + id + '"]'); }
            function altoMinimo(id) { var t = SGTLTableros.tablero(id); return t ? t.minH : 2; }

            // Los tableros sin lugar guardado (los que se suman con la estrella en Tableros) van al final, uno por fila,
            // con el tamaño que tienen en el catálogo.
            function conLugar(lista) {
                var fondo = lista.reduce(function (m, it) {
                    return typeof it.y === 'number' && typeof it.h === 'number' ? Math.max(m, it.y + it.h) : m;
                }, 0);
                return lista.map(function (it) {
                    if ([it.x, it.y, it.w, it.h].every(function (v) { return typeof v === 'number'; })) return it;
                    var t = SGTLTableros.tablero(it.id);
                    var nuevo = { id: it.id, x: 0, y: fondo, w: t.w, h: t.h };
                    fondo += t.h;
                    return nuevo;
                });
            }

            function armarTarjetas(lista) {
                document.querySelector('.grid-stack').innerHTML = lista.map(function (it) {
                    var t = SGTLTableros.tablero(it.id);
                    return t ? '<div class="grid-stack-item" gs-id="' + t.id + '"><div class="grid-stack-item-content">' +
                        SGTLTableros.tarjeta(t, { estrella: true }) + '</div></div>' : '';
                }).join('');
            }

            // "Agregar tableros" lleva a Tableros; sin el permiso queda deshabilitado con el motivo (§1.4).
            function botonAgregar(id) {
                var puede = !window.sgtlPuedeEntrar || window.sgtlPuedeEntrar('tableros.html');
                var boton = '<a href="tableros.html" class="btn btn-light-secondary' + (puede ? '' : ' disabled') + '"' + (id ? ' id="' + id + '"' : '') +
                    (puede ? '' : ' aria-disabled="true" tabindex="-1"') + '><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Agregar tableros</a>';
                return puede ? boton : '<span class="sgtl-envoltura-deshabilitado" tabindex="0" data-bs-toggle="tooltip" title="No se puede abrir Tableros: no tenés permiso">' + boton + '</span>';
            }

            function mostrarVacio(vacio) {
                el('dashVacio').style.display = vacio ? '' : 'none';
                el('btnPersonalizar').style.display = vacio ? 'none' : '';
                if (vacio) {
                    el('dashVacioAcciones').innerHTML = botonAgregar() +
                        '<button type="button" class="btn btn-outline-secondary" id="btnVacioRestablecer"><i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>Restablecer</button>';
                    el('btnVacioRestablecer').addEventListener('click', restablecerLayout);
                }
            }

            // Lee los favoritos (o el diseño por defecto) y arma sus tarjetas, antes de que dashboard.js las llene.
            window.armarTablero = function () {
                return SGTLTableros.leerFavoritos().then(function (r) {
                    favoritos = conLugar(r.lista);
                    armarTarjetas(favoritos);
                    mostrarVacio(!favoritos.length);
                });
            };

            var ALTO_FILA = 62, MARGEN = 8;

            function ajustarAltoCalendario() {
                var cal = document.getElementById('calendarioViajes');
                var item = itemEl('calendario');
                if (!GRID || !cal || !item || item.style.display === 'none' || !item.gridstackNode) return;
                var card = item.querySelector('.card');
                var body = cal.closest('.card-body');
                var cs = getComputedStyle(body);
                var necesario = card.querySelector('.card-header').offsetHeight +
                    parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0) + cal.scrollHeight;
                var filas = Math.ceil((necesario + MARGEN * 2) / ALTO_FILA);
                var nodo = item.gridstackNode;
                if (nodo.h !== filas || nodo.minH !== filas) GRID.update(item, { h: filas, minH: filas });
            }

            function refrescarVivos() {
                // Gráficos: toman el alto y el ancho disponibles de su tarjeta.
                try { if (window.SGTLDashboard) window.SGTLDashboard.ajustarGraficos(); } catch (e) { }

                // Calendario: se muestra el mes completo (alto natural) y la tarjeta toma el alto que necesita.
                try { ajustarAltoCalendario(); } catch (e) { }
            }
            window.ajustarWidgetsVivos = refrescarVivos;

            var esperaVentana = null;
            window.addEventListener('resize', function () {
                clearTimeout(esperaVentana);
                esperaVentana = setTimeout(refrescarVivos, 150);
            });

            // El alto de la barra de arriba y el relleno de la página cambian según el ancho de la pantalla.
            function fijarEncabezadoTablero() {
                var barra = document.querySelector('#main > header');
                var contenido = document.getElementById('main-content');
                var raiz = document.documentElement.style;
                // Mientras la pantalla está oculta mide 0: en ese caso queda el valor por defecto (90 px).
                if (barra && barra.offsetHeight) raiz.setProperty('--alto-barra-superior', barra.offsetHeight + 'px');
                if (contenido) raiz.setProperty('--relleno-pagina', getComputedStyle(contenido).paddingLeft);
            }
            window.addEventListener('resize', fijarEncabezadoTablero);
            window.fijarEncabezadoTablero = fijarEncabezadoTablero;

            // makeWidget sobre una tarjeta que ya está en la grilla le crea un segundo nodo: al agrandarla o
            // esconderla se tocaba ese y se guardaba el otro. Solo se agrega si todavía no está.
            function agregarAlGrid(e) {
                if (e.gridstackNode && GRID.engine.nodes.indexOf(e.gridstackNode) !== -1) return;
                try { GRID.makeWidget(e); } catch (x) { }
            }

            window.iniciarGrillaTablero = function () {
                if (typeof GridStack === 'undefined') { return; } // si el CDN no cargó, el dashboard sigue estático
                GRID = GridStack.init({
                    column: 12,
                    cellHeight: 62,
                    margin: 8,
                    float: false,
                    staticGrid: true,
                    handle: '.card-header',
                    columnOpts: { breakpointForWindow: true, breakpoints: [{ w: 768, c: 1 }] }
                });
                GRID.on('resizestop change', function () { refrescarVivos(); });
                wireToolbar();
                aplicarLayout(favoritos);
            };

            function aplicarLayout(items) {
                if (!GRID) return;
                GRID.batchUpdate();
                items.forEach(function (it) {
                    var e = itemEl(it.id);
                    if (!e) return;
                    e.style.display = '';
                    agregarAlGrid(e);
                });
                var visibles = items.filter(function (it) { return itemEl(it.id); }).map(function (it) {
                    var minimo = altoMinimo(it.id);
                    return Object.assign({}, it, { h: Math.max(it.h || minimo, minimo), minH: minimo });
                });
                // En celular (1 columna) gridstack apila mal un diseño de 12 columnas: dos tarjetas de la misma
                // fila quedaban una encima de la otra. Se carga en 12 y se pasa a 1 columna en orden.
                var columnas = GRID.getColumn();
                if (columnas !== 12) GRID.column(12, 'none');
                GRID.load(visibles, false);
                if (columnas !== 12) GRID.column(columnas, 'list');
                GRID.commit();
                setTimeout(refrescarVivos, 80);
            }

            // Estrella en Personalizar: la tarjeta sale del dashboard (queda en Tableros). Se guarda con Guardar.
            function quitarTablero(id) {
                var e = itemEl(id);
                if (!e || !GRID) return;
                try { GRID.removeWidget(e, false); } catch (x) { }
                e.style.display = 'none';
                if (quitados.indexOf(id) === -1) quitados.push(id);
            }

            function mostrarEdicion(editando) {
                enEdicion = editando;
                if (GRID) GRID.setStatic(!editando);
                document.querySelector('.grid-stack').classList.toggle('editando', editando);
                el('btnPersonalizar').style.display = editando ? 'none' : '';
                ['btnGuardarLayout', 'btnCancelarLayout', 'btnResetLayout', 'agregarTablerosEnvoltura'].forEach(function (id) {
                    el(id).style.display = editando ? '' : 'none';
                });
                if (editando) el('agregarTablerosEnvoltura').innerHTML = botonAgregar('btnAgregarTableros');
            }

            // Lo que quedó en la grilla, en el orden en que se lee (de arriba abajo y de izquierda a derecha).
            // A mano y no con GRID.save(): gridstack omite el alto de algunas tarjetas y al volver quedaban con el mínimo.
            function disenoActual() {
                return GRID.engine.nodes.map(function (n) {
                    return { id: n.id || (n.el && n.el.getAttribute('gs-id')), x: n.x, y: n.y, w: n.w, h: n.h };
                }).filter(function (it) { return it.id; }).sort(function (a, b) { return a.y - b.y || a.x - b.x; });
            }

            function guardarLayout() {
                if (!GRID) { mostrarEdicion(false); return; }
                var items = disenoActual();
                var listo = SGTL.procesando(el('btnGuardarLayout'), 'Guardando…');
                SGTLTableros.guardarFavoritos(items, 'No se pudo guardar tu dashboard. Probá de nuevo.').then(function () {
                    listo();
                    quitados.forEach(function (id) { var e = itemEl(id); if (e) e.parentNode.removeChild(e); });
                    quitados = [];
                    favoritos = items;
                    mostrarEdicion(false);
                    mostrarVacio(!favoritos.length);
                    refrescarVivos();
                    SGTL.toastExito('Dashboard guardado.');
                }, function (error) {
                    listo();
                    SGTL.toastError(error.mensajeUsuario || 'No se pudo guardar tu dashboard. Probá de nuevo.');
                });
            }

            function cancelarEdicion() {
                quitados = [];
                aplicarLayout(favoritos);
                mostrarEdicion(false);
            }

            // Vuelve al dashboard de siempre: borra los favoritos guardados y recarga (las tarjetas cambian).
            function restablecerLayout() {
                SGTLTableros.restablecer('No se pudo restablecer tu dashboard. Probá de nuevo.').then(function () {
                    window.location.reload();
                }, function (error) {
                    SGTL.toastError(error.mensajeUsuario || 'No se pudo restablecer tu dashboard. Probá de nuevo.');
                });
            }

            function wireToolbar() {
                el('btnPersonalizar').addEventListener('click', function () { mostrarEdicion(true); });
                el('btnGuardarLayout').addEventListener('click', guardarLayout);
                el('btnCancelarLayout').addEventListener('click', cancelarEdicion);
                el('btnResetLayout').addEventListener('click', restablecerLayout);
                document.querySelector('.grid-stack').addEventListener('click', function (e) {
                    var estrella = e.target.closest('.dash-estrella');
                    if (!estrella || !enEdicion) return;
                    quitarTablero(estrella.getAttribute('data-tablero'));
                });
            }
        })();
    </script>

</body>
