<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Listar usuarios</title>

    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
</head>

<body data-modo="listar">
    <div id="cargando" class="min-vh-100 d-flex align-items-center justify-content-center gap-2" role="status">
        <span class="spinner-border" aria-hidden="true"></span>
        <span>Cargando…</span>
    </div>

    <div id="errorInicial" class="alert alert-light-danger m-4 d-none" role="alert"></div>

    <div id="app" class="d-none">
        <div id="sidebar"></div>

        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>

            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloUsuarios">
                    <div class="card rounded">
                        <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                            <div>
                                <h1 id="tituloUsuarios" class="card-title h5 mb-1">
                                    <i class="bi bi-people-fill me-2" aria-hidden="true"></i>Listar usuarios
                                </h1>
                                <p class="text-muted mb-0">
                                    Consultá los datos, los grupos y el estado de cada usuario.
                                </p>
                            </div>

                            <div class="d-flex gap-2">
                                <button id="exportarUsuarios" class="btn btn-secondary" type="button"
                                    aria-label="Descargar reporte" title="Descargar reporte">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="card-body">
                            <form id="filtrosUsuarios" class="mb-4" novalidate>
                                <div class="row g-3">
                                    <div class="col-12 col-md-4">
                                        <label for="fUsuario" class="form-label">Nombre de usuario</label>
                                        <input id="fUsuario" class="form-control" maxlength="50" autocomplete="off">
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="fNombre" class="form-label">Nombre</label>
                                        <input id="fNombre" class="form-control" maxlength="50" autocomplete="off">
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="fApellido" class="form-label">Apellido</label>
                                        <input id="fApellido" class="form-control" maxlength="50" autocomplete="off">
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="fRol" class="form-label">Rol</label>
                                        <select id="fRol" class="form-select">
                                            <option value="">Todos</option>
                                            <option value="admin">Administrador</option>
                                            <option value="user">Usuario</option>
                                            <option value="chofer">Chofer</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="fEstado" class="form-label">Estado</label>
                                        <select id="fEstado" class="form-select">
                                            <option value="">Todos</option>
                                            <option value="Activo" selected>Activo</option>
                                            <option value="Inactivo">Inactivo</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="fFecha" class="form-label">Fecha de alta</label>
                                        <input id="fFecha" class="form-control" placeholder="DD/MM/AAAA"
                                            autocomplete="off">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end mt-3">
                                    <button type="submit" class="btn btn-light">Buscar</button>
                                </div>
                            </form>

                            <div class="table-responsive">
                                <table id="tablaUsuarios" class="table table-striped table-hover align-middle mb-0"
                                    aria-labelledby="tituloUsuarios">
                                    <thead>
                                        <tr>
                                            <th scope="col">
                                                <button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Nombre_Usuario">
                                                    Usuario<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i>
                                                </button>
                                            </th>
                                            <th scope="col">
                                                <button type="button" class="sgtl-orden-boton" data-sgtl-orden="Nombre">
                                                    Nombre<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i>
                                                </button>
                                            </th>
                                            <th scope="col">
                                                <button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Apellido">
                                                    Apellido<i class="bi bi-arrow-down-up ms-1" aria-hidden="true"></i>
                                                </button>
                                            </th>
                                            <th scope="col">Rol</th>
                                            <th scope="col" class="text-center">Estado</th>
                                            <th scope="col" class="text-center">
                                                <button type="button" class="sgtl-orden-boton"
                                                    data-sgtl-orden="Fecha_Alta">
                                                    Fecha de alta<i class="bi bi-arrow-down-up ms-1"
                                                        aria-hidden="true"></i>
                                                </button>
                                            </th>
                                            <th scope="col" class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasUsuarios"></tbody>
                                </table>
                            </div>

                            <nav aria-label="Paginación de usuarios">
                                <ul id="paginacionUsuarios" class="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>

    <div id="modalDetalleUsuario" class="modal fade" tabindex="-1" aria-labelledby="tituloDetalleUsuario"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tituloDetalleUsuario" class="modal-title h5">
                        Ver detalle del usuario
                    </h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div id="detalleUsuario" class="modal-body"></div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light-secondary" data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/js/usuarios.js"></script>
</body>

</html>
