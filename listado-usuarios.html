<body>

    <div id="loading-message" style="display: none;">

    <div id="app">

        <div id="main" class='layout-navbar navbar-fixed'>

            <div class="page-heading">
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">

                        </div>
                        <div class="card-body">
                            <form id="busquedaUsuarioForm" class="form">
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <label for="txtuser-name-column" class="form-label">Nombre de usuario</label>
                                        <input type="text" class="form-control" id="txtuser-name-column"
                                            placeholder="jperez">
                                    </div>
                                    <div class="col-md-3 mb-3">

                                            placeholder="Juan">
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="txtlast-name-column" class="form-label">Apellido</label>
                                        <input type="text" class="form-control" id="txtlast-name-column"

                                    </div>
                                    <div class="col-md-4 mb-3">

                                            <input type="checkbox" class="form-check-input form-check-danger"

                                        </div>
                                    </div>
                                </div>

                            </form>

                            <div class="table-responsive">

                                    <thead>
                                        <tr>
                                            <th>Nombre de usuario</th>
                                            <th>Nombre</th>
                                            <th>Apellido</th>
                                            <th>Estado</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>

                            <nav>

            <footer>

                <script src="./assets/static/js/footer.js"></script>

        <!-- Modal Detalles del Usuario -->
        <div class="modal fade" id="DetallesUsuarioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title fw-bold text-primary">Detalles del usuario</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="border rounded p-3">
                            <label class="fw-bold d-block mb-2">Estado del usuario</label>
                            <span id="modalEstadoUsuario" class="badge">—</span>
                        </div>

                        <div class="border rounded p-3 mt-3">
                            <label class="fw-bold d-block mb-2">Grupos asignados</label>
                            <ul id="modalGruposAsignados" class="list-unstyled mb-0">
                                <li class="text-muted">Cargando…</li>
                            </ul>
                        </div>

                        <div class="border rounded p-3 mt-3">
                            <label class="fw-bold d-block mb-2">Permisos asignados por grupo</label>
                            <div id="modalPermisosPorGrupo">
                                <p class="text-muted mb-0">Cargando…</p>
                            </div>
                        </div>
                    </div>

    <script src="assets/extensions/jquery/jqueryajax.js"></script>

    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="./assets/static/gestionContenido.js"></script>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;
                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }
    </script>

    <script>
        const API_BASE = 'http://localhost:50222/api';
        let pageSize = 15;
        let currentPage = 1;

        function escapeHtml(text) {
            if (text == null) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function buscarUsuarios(page) {
            if (page == null) page = 1;
            currentPage = page;

            const nombreUsuario = $('#txtuser-name-column').val();
            const nombre = $('#txtfirst-name-column').val();
            const apellido = $('#txtlast-name-column').val();
            const estadoActivo = $('#checkestadoactivo').is(':checked');
            const estadoInactivo = $('#checkestadoinactivo').is(':checked');

            let estadoUsuario = '';
            if (estadoActivo && estadoInactivo) {
                estadoUsuario = 'Activo,Inactivo';
            } else if (estadoActivo) {
                estadoUsuario = 'Activo';
            } else if (estadoInactivo) {
                estadoUsuario = 'Inactivo';
            }

            $.ajax({
                url: API_BASE + '/Usuarios/Buscar',
                type: 'GET',
                data: {
                    Nombre_Usuario: nombreUsuario,
                    nombre: nombre,
                    apellido: apellido,
                    EstadoUsuario: estadoUsuario,
                    page: page,
                    pageSize: pageSize
                },
                success: function (data) {
                    const tbody = $('#tablaUsuarios tbody');
                    tbody.empty();

                    if (!data.Results || data.Results.length === 0) {
                        tbody.html('<tr><td colspan="5" class="text-center">No se encontraron registros</td></tr>');
                    } else {
                        data.Results.forEach(function (registro) {
                            const estado = registro.EstadoUsuario || '';
                            const estadoClass = estado === 'Activo' ? 'badge bg-success' : 'badge bg-danger';

                            const $tr = $('<tr>');
                            $tr.append($('<td>').text(registro.Nombre_Usuario || ''));
                            $tr.append($('<td>').text(registro.Nombre || ''));
                            $tr.append($('<td>').text(registro.Apellido || ''));
                            $tr.append($('<td>').append($('<span>').addClass(estadoClass).text(estado)));

                            const $btn = $('<button>')
                                .addClass('btn btn-primary')
                                .html('<i class="bi bi-info-circle"></i> Más detalles')
                                .attr('data-bs-toggle', 'modal')
                                .attr('data-bs-target', '#DetallesUsuarioModal')
                                .attr('data-usuarioid', registro.Usuario_ID);
                            $tr.append($('<td>').append($btn));
                            tbody.append($tr);
                        });
                    }

                    renderPagination(data.TotalRecords || 0, pageSize, page);
                },
                error: function (xhr) {
                    console.error('Error en la búsqueda de usuarios:', xhr);
                }
            });
        }

        function rellenarModalDetallesUsuario(detalles) {
            const estado = detalles.EstadoUsuario || '—';
            const esActivo = estado === 'Activo';
            $('#modalEstadoUsuario')
                .text(estado)
                .removeClass('bg-success bg-danger')
                .addClass(esActivo ? 'bg-success' : 'bg-danger');

            const $listaGrupos = $('#modalGruposAsignados');
            $listaGrupos.empty();
            if (!detalles.Grupos || detalles.Grupos.length === 0) {
                $listaGrupos.append('<li class="text-muted">Ningún grupo asignado</li>');
            } else {
                detalles.Grupos.forEach(function (g) {
                    $listaGrupos.append('<li class="mb-1">' + escapeHtml(g.Grupo_Nombre || '') + '</li>');
                });
            }

            const $permisos = $('#modalPermisosPorGrupo');
            $permisos.empty();
            if (!detalles.Grupos || detalles.Grupos.length === 0) {
                $permisos.append('<p class="text-muted mb-0">Sin permisos por grupo</p>');
            } else {
                detalles.Grupos.forEach(function (g) {
                    const $bloque = $('<div>').addClass('mt-2');
                    $bloque.append($('<h6>').addClass('fw-bold').text(g.Grupo_Nombre || ''));
                    const $ul = $('<ul>').addClass('list-group');
                    if (g.Menus && g.Menus.length) {
                        g.Menus.forEach(function (m) {
                            $ul.append($('<li>').addClass('list-group-item').text(m));
                        });
                    } else {
                        $ul.append('<li class="list-group-item text-muted">Sin menús asignados</li>');
                    }
                    $bloque.append($ul);
                    $permisos.append($bloque);
                });
            }
        }

        function renderPagination(totalRecords, pageSizeVal, page) {
            const totalPages = Math.ceil(totalRecords / pageSizeVal) || 1;
            const paginationContainer = $('#pagination');
            if (window.PaginacionSGTL) {
                window.PaginacionSGTL.render(paginationContainer.get(0), {
                    total: totalRecords, tamanioPagina: pageSizeVal, pagina: page,
                    alCambiarPagina: function (pagina) { buscarUsuarios(pagina); },
                    alCambiarTamanio: function (tamanio) { pageSize = tamanio; buscarUsuarios(1); }
                });
                return;
            }
            paginationContainer.empty();

            const prevDisabled = page === 1 ? 'disabled' : '';
            const nextDisabled = page >= totalPages ? 'disabled' : '';

            paginationContainer.append(
                '<li class="page-item ' + prevDisabled + '">' +
                '<a class="page-link" href="#" aria-label="Previous" data-page="' + (page - 1) + '">' +
                '<span aria-hidden="true"><i class="bi bi-chevron-left"></i></span></a></li>'
            );

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = page === i ? 'active' : '';
                paginationContainer.append(
                    '<li class="page-item ' + activeClass + '">' +
                    '<a class="page-link" href="#" data-page="' + i + '">' + i + '</a></li>'
                );
            }

            paginationContainer.append(
                '<li class="page-item ' + nextDisabled + '">' +
                '<a class="page-link" href="#" aria-label="Next" data-page="' + (page + 1) + '">' +
                '<span aria-hidden="true"><i class="bi bi-chevron-right"></i></span></a></li>'
            );
        }

        $(document).ready(function () {
            $('#checkestadoactivo').prop('checked', true);

            $('#txtuser-name-column').on('input', function () {
                this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ0-9_\s´]/g, '');
            });

            $('#txtfirst-name-column, #txtlast-name-column').on('input', function () {
                this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s´]/g, '');
            });

            $('#btnBuscarUsuarios').on('click', function () { buscarUsuarios(1); });

            $('#txtuser-name-column, #txtfirst-name-column, #txtlast-name-column').on('keypress', function (e) {
                if (e.which === 13) {
                    e.preventDefault();
                    buscarUsuarios(1);
                }
            });

            $('#pagination').on('click', 'a.page-link', function (e) {
                e.preventDefault();
                const page = parseInt($(this).data('page'), 10);
                if (!isNaN(page) && page >= 1) buscarUsuarios(page);
            });

            $('#DetallesUsuarioModal').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget);
                const usuarioId = button.data('usuarioid');
                $('#modalGruposAsignados').html('<li class="text-muted">Cargando…</li>');
                $('#modalPermisosPorGrupo').html('<p class="text-muted mb-0">Cargando…</p>');
                $('#modalEstadoUsuario').text('…').removeClass('bg-success bg-danger');

                $.ajax({
                    url: API_BASE + '/Usuarios/' + usuarioId + '/Detalles',
                    type: 'GET',
                    success: function (data) {
                        rellenarModalDetallesUsuario(data);
                    },
                    error: function (xhr) {
                        $('#modalGruposAsignados').html('<li class="text-danger">Error al cargar los detalles</li>');
                        $('#modalPermisosPorGrupo').html('<p class="text-danger mb-0">Error al cargar los detalles</p>');
                        $('#modalEstadoUsuario').text('—').removeClass('bg-success bg-danger');
                        console.error('Error al obtener los detalles del usuario:', xhr);
                    }
                });
            });

            buscarUsuarios(1);
        });
    </script>

</body>
