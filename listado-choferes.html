    <script>
        $(document).ready(function () {
            $('[data-bs-toggle="tooltip"]').tooltip();

            $(document).on('mouseenter', '[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('show');
            });

            $(document).on('mouseleave', '[data-bs-toggle="tooltip"]', function () {
                $(this).tooltip('hide');
            });
        });
    </script>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

    </script>

    <script>
        $(document).ready(function () {
            $('#checkestadoactivo').prop('checked', true);

            buscarChoferes();
        });
    </script>

    <script>

        document.getElementById('txtnombre').addEventListener('input', function (event) {
            this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s´]/g, '');
        });

        document.getElementById('txtapellido').addEventListener('input', function (event) {
            this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s´]/g, '');
        });

        document.getElementById('txtdni').addEventListener('input', function (event) {

            this.value = this.value.replace(/[^0-9]/g, '');

            if (this.value.length > 8) {
                this.value = this.value.slice(0, 8);
            }
        });

        $('#txtnombre, #txtapellido, #txtdni, #fechaRango').on('input', function () {
            if ($(this).val().trim() === '') {
                buscarChoferes(currentPage);
            }
        });

        const pageSize = 6;
        let currentPage = 1;

        function obtenerNombres(provId, locId) {
            let nombreProvincia = '';
            let nombreLocalidad = '';

            function obtenerNombreProvincia() {
                return $.ajax({
                    url: `http://localhost:50222/api/Provincias/${provId}`,
                    type: 'GET'
                }).then(function (data) {
                    nombreProvincia = data.Nombre_Provincia;
                }).catch(function () {
                    nombreProvincia = 'Provincia no encontrada';
                });
            }

            function obtenerNombreLocalidad() {
                let url = `http://localhost:50222/api/Provincias/${provId}/Localidades`;
                if (locId) {
                    url += `?locId=${locId}`;
                }
                return $.ajax({
                    url: url,
                    type: 'GET'
                }).then(function (data) {
                    if (Array.isArray(data) && data.length > 0) {
                        nombreLocalidad = data[0].Nombre_Localidad;
                    } else {
                        nombreLocalidad = 'Localidad no encontrada';
                    }
                }).catch(function () {
                    nombreLocalidad = 'Localidad no encontrada';
                });
            }

            return $.when(obtenerNombreProvincia(), obtenerNombreLocalidad()).then(function () {
                return {
                    Nombre_Provincia: nombreProvincia,
                    Nombre_Localidad: nombreLocalidad
                };
            });
        }

        $(document).ready(function () {
            $('#fechaRango').daterangepicker({
                autoUpdateInput: false,
                locale: {
                    cancelLabel: 'Borrar',
                    format: 'DD/MM/YYYY',
                    applyLabel: 'Aplicar',
                    cancelLabel: 'Cancelar',
                    daysOfWeek: ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'],
                    monthNames: [
                        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                    ]
                }
            });

            $('#fechaRango').on('apply.daterangepicker', function (ev, picker) {
                $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
                $(this).data('start', picker.startDate.format('YYYY-MM-DD'));
                $(this).data('end', picker.endDate.format('YYYY-MM-DD'));
            });

            $('#fechaRango').on('cancel.daterangepicker', function (ev, picker) {
                $(this).val('');
                $(this).removeData('start').removeData('end');
            });
        });


        var estadoChoferOriginal;

        function mostrarDetallesChofer(registro) {
            obtenerNombres(registro.ProvID, registro.LocID).then(nombres => {
                $('#first-name-column').val(registro.Nombre);
                $('#last-name-column').val(registro.Apellido);
                $('#dni-column').val(registro.DNI);
                $('#cuil-column').val(registro.CUIL);
                $('#celphone-column').val(registro.TelefonoCelular);
                $('#phone-column').val(registro.TelefonoFijo);
                $('#email-column').val(registro.Email);
                $('#province-column').val(nombres.Nombre_Provincia);
                $('#local-column').val(nombres.Nombre_Localidad);
                $('#street-column').val(registro.Calle);
                $('#number-column').val(registro.AlturaCalle ? registro.AlturaCalle.trim() : '');
                $('#EstadoActualChofer').text(registro.EstadoChofer);
                estadoChoferOriginal = registro.EstadoChofer;

                var estadoStyle = registro.EstadoChofer === 'Activo' ? 'badge bg-success' : 'badge bg-danger';
                $('#EstadoActualChofer').removeClass().addClass(estadoStyle);

                const fechaAltaFormateada = formatFechaUTC3(registro.Fecha_Alta);
                $('#FechaAltaChofer').text(fechaAltaFormateada);

                obtenerCamionesAsignados(registro.Chofer_ID);

                $('#DetallesChoferModal').modal('show');
            }).catch(error => {
                console.error('Error al obtener nombres de provincia o localidad', error);
            });
        }

        function formatFechaUTC3(isoDate) {
            if (!isoDate) return 'Fecha no disponible';

            const date = new Date(isoDate);
            const utc3Date = new Date(date.getTime() - 3 * 60 * 60 * 1000);

            const day = String(utc3Date.getDate()).padStart(2, '0');
            const month = String(utc3Date.getMonth() + 1).padStart(2, '0');
            const year = utc3Date.getFullYear();
            const hours = String(utc3Date.getHours()).padStart(2, '0');
            const minutes = String(utc3Date.getMinutes()).padStart(2, '0');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function obtenerCamionesAsignados(choferID) {
            $.ajax({
                url: `http://localhost:50222/api/Choferes/${choferID}/Chofer_Camion`,
                method: 'GET',
                success: function (data) {
                    var tbody = $('#tablaCamionesAsignados tbody');
                    tbody.empty();

                    if (data.length === 0) {
                        var row = `<tr>
                    <td colspan="2" class="text-center">No se encontraron registros</td>
                </tr>`;
                        tbody.append(row);
                    } else {
                        data.forEach(function (camion) {
                            var row = `<tr>
                        <td>${camion.Dominio}</td>
                        <td>${camion.Cedula}</td>
                    </tr>`;
                            tbody.append(row);
                        });
                    }
                },
                error: function (error) {
                    console.error('Error al obtener los camiones asignados:', error);
                }
            });
        }

        function buscarChoferes(page = 1) {
            var nombre = $('#txtnombre').val();
            var apellido = $('#txtapellido').val();
            var dni = $('#txtdni').val();
            var fechaRango = $('#fechaRango').val();
            var estadoActivo = $('#checkestadoactivo').is(':checked');
            var estadoInactivo = $('#checkestadoinactivo').is(':checked');

            let fechaDesde = null;
            let fechaHasta = null;

            if (fechaRango) {
                let fechas = fechaRango.split(' - ');
                if (fechas.length === 2) {
                    fechaDesde = moment(fechas[0], 'DD/MM/YYYY').format('YYYY-MM-DD') + ' 00:00:00.000';
                    fechaHasta = moment(fechas[1], 'DD/MM/YYYY').format('YYYY-MM-DD') + ' 23:59:59.999';
                }
            }

            var requestData = {
                nombre: nombre || null,
                apellido: apellido || null,
                dni: dni || null,
                fechaDesde: fechaDesde || null,
                fechaHasta: fechaHasta || null,
                estadoChofer: estadoActivo && estadoInactivo ? 'Activo,Inactivo' : (estadoActivo ? 'Activo' : (estadoInactivo ? 'Inactivo' : '')),
                page: page,
                pageSize: pageSize
            };

            if (nombre !== '') requestData.nombre = nombre;
            if (apellido !== '') requestData.apellido = apellido;
            if (dni !== '') requestData.dni = dni;
            if (fechaDesde !== '') requestData.fechaDesde = fechaDesde;
            if (fechaHasta !== '') requestData.fechaHasta = fechaHasta;

            if (estadoActivo || estadoInactivo) {
                requestData.estadoChofer = '';
                if (estadoActivo) requestData.estadoChofer += 'Activo,';
                if (estadoInactivo) requestData.estadoChofer += 'Inactivo,';
                requestData.estadoChofer = requestData.estadoChofer.slice(0, -1);
            }

            $.ajax({
                url: 'http://localhost:50222/api/Choferes/Buscar',
                type: 'GET',
                data: requestData,
                success: function (data) {
                    $('#tablaChoferes tbody').empty();

                    if (data.Results.length === 0) {
                        $('#tablaChoferes tbody').html('<tr><td colspan="7" class="text-center">No se encontraron registros</td></tr>');
                    } else {
                        data.Results.forEach(function (registro) {

                            var fechaAltaFormateada = formatFechaUTC3(registro.Fecha_Alta);

                            var estadoStyle = registro.EstadoChofer === 'Activo' ? 'badge bg-success' : 'badge bg-danger';
                            var row = `<tr>
                    <td>${registro.Chofer_ID}</td>
                    <td>${fechaAltaFormateada}</td>
                    <td>${registro.Nombre}</td>
                    <td>${registro.Apellido}</td>
                    <td>${registro.DNI}</td>
                    <td><span class="badge ${estadoStyle}">${registro.EstadoChofer}</span></td>
                    <td>
                            <button class="btn btn-primary btn-detalle"
                                data-choferid="${registro.Chofer_ID}"
                                data-bs-toggle="tooltip" 
                                data-bs-placement="top" 
                                title="Más detalles"
                                onclick="abrirModal('${registro.Chofer_ID}')">
                                <i class="bi bi-info-circle"></i>
                            </button>
                    </td>
                </tr>`;
                            $('#tablaChoferes tbody').append(row);
                        });
                    }
                    renderPagination(data.TotalRecords, pageSize, page);
                },
                error: function (xhr, status, error) {
                    console.error(error);
                }
            });
        }

        function abrirModal(choferID) {
            $.ajax({
                url: `http://localhost:50222/api/Choferes/${choferID}`,
                method: 'GET',
                success: function (data) {
                    mostrarDetallesChofer(data);
                    SGTL.modal('#DetallesChoferModal');
                },
                error: function (error) {
                    console.error('Error al obtener los detalles del chofer:', error);
                }
            });
        }

        function formatFechaUTC3(isoDate) {
            const date = new Date(isoDate);
            const utc3Date = new Date(date.getTime() - 3 * 60 * 60 * 1000);

            const day = String(utc3Date.getDate()).padStart(2, '0');
            const month = String(utc3Date.getMonth() + 1).padStart(2, '0');
            const year = utc3Date.getFullYear();
            const hours = String(utc3Date.getHours()).padStart(2, '0');
            const minutes = String(utc3Date.getMinutes()).padStart(2, '0');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function renderPagination(totalRecords, pageSize, currentPage) {
            const totalPages = Math.ceil(totalRecords / pageSize);
            const paginationContainer = $('#pagination');
            paginationContainer.empty();

            const prevDisabled = currentPage === 1 ? 'disabled' : '';
            const nextDisabled = currentPage === totalPages ? 'disabled' : '';

            paginationContainer.append(`
                <li class="page-item ${prevDisabled}">
                    <a class="page-link" href="#" aria-label="Previous" onclick="buscarChoferes(${currentPage - 1})">
                        <span aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
                    </a>
                </li>
            `);

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = currentPage === i ? 'active' : '';
                paginationContainer.append(`
                    <li class="page-item ${activeClass}">
                        <a class="page-link" href="#" onclick="buscarChoferes(${i})">${i}</a>
                    </li>
                `);
            }

            paginationContainer.append(`
                <li class="page-item ${nextDisabled}">
                    <a class="page-link" href="#" aria-label="Next" onclick="buscarChoferes(${currentPage + 1})">
                        <span aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
                    </a>
                </li>
            `);
        }

        $(document).ready(function () {
            buscarChoferes(currentPage);
        });


    </script>

    <script>
        async function generarReporteCSV() {
            var dni = $('#txtdni').val() || '';
            var nombre = $('#txtnombre').val().trim() || '';
            var apellido = $('#txtapellido').val().trim() || '';
            var estadoActivo = $('#checkestadoactivo').is(':checked');
            var estadoInactivo = $('#checkestadoinactivo').is(':checked');
            var fechaDesde = $('#fechaRango').data('start') || null;
            var fechaHasta = $('#fechaRango').data('end') || null;

            var requestData = {
                dni: dni,
                nombre: nombre || null,
                apellido: apellido || null,
                fechaDesde: fechaDesde || null,
                fechaHasta: fechaHasta || null,
                estadoChofer: estadoActivo && estadoInactivo ? 'Activo,Inactivo' :
                    estadoActivo ? 'Activo' :
                        estadoInactivo ? 'Inactivo' : '',
                page: currentPage,
                pageSize: pageSize
            };

            try {
                const response = await $.ajax({
                    url: 'http://localhost:50222/api/Choferes/Buscar',
                    type: 'GET',
                    data: requestData
                });

                if (response.Results.length === 0) {
                    mostrarToastError('No se encontraron registros para generar el reporte.');
                    return;
                }

                const registrosConProvincias = await Promise.all(response.Results.map(async (registro) => {
                    registro.Provincia = await obtenerNombreProvincia(registro.ProvID);
                    registro.Localidad = await obtenerNombreLocalidad(registro.ProvID, registro.LocID);
                    return registro;
                }));

                generarCSV(registrosConProvincias);
            } catch (error) {
                console.error('Error al generar el reporte:', error);
                mostrarToastError('Error al generar el reporte. Inténtelo de nuevo más tarde.');
            }
        }

        function mostrarToastError(mensaje) {
            $('#toastErrorMessage').text(mensaje);
            $('#toastError').toast('show');
        }

        async function obtenerNombreProvincia(provId) {
            try {
                const data = await $.ajax({
                    url: `http://localhost:50222/api/Provincias/${provId}`,
                    type: 'GET'
                });
                return data.Nombre_Provincia || 'Provincia no encontrada';
            } catch (error) {
                console.error(`Error obteniendo la provincia con ID ${provId}:`, error);
                return 'Provincia no encontrada';
            }
        }

        async function obtenerNombreLocalidad(provId, locId) {
            try {
                const data = await $.ajax({
                    url: `http://localhost:50222/api/Provincias/${provId}/Localidades?locId=${locId}`,
                    type: 'GET'
                });

                if (Array.isArray(data) && data.length > 0) {
                    return data[0].Nombre_Localidad;
                } else {
                    return 'Localidad no encontrada';
                }
            } catch (error) {
                console.error(`Error obteniendo la localidad con ProvID ${provId} y LocID ${locId}:`, error);
                return 'Localidad no encontrada';
            }
        }

        function generarCSV(data) {
            const headers = [
                'Chofer_ID', 'DNI', 'CUIL', 'Nombre', 'Apellido',
                'Telefono fijo', 'Telefono celular', 'Email',
                'Provincia', 'Localidad', 'Calle', 'Altura',
                'Estado del chofer', 'Fecha de alta',
                'Usuario de alta', 'Fecha de modificación', 'Usuario de modificación'
            ];

            let csvContent = headers.join(";") + "\n";

            data.forEach(function (registro) {
                let row = [
                    registro.Chofer_ID,
                    registro.DNI,
                    registro.CUIL,
                    registro.Nombre,
                    registro.Apellido,
                    registro.TelefonoFijo || '',
                    registro.TelefonoCelular || '',
                    registro.Email || '',
                    registro.Provincia,
                    registro.Localidad,
                    registro.Calle || '',
                    registro.AlturaCalle || '',
                    registro.EstadoChofer,
                    formatFechaUTC3(registro.Fecha_Alta),
                    registro.Usu_Alta || '',
                    registro.Fecha_Modi ? formatFechaUTC3(registro.Fecha_Modi) : '',
                    registro.Usu_Modi || ''
                ];

                csvContent += row.map(value => `"${value}"`).join(";") + "\n";
            });

            let blob = new Blob(["\ufeff" + csvContent], { type: "text/csv;charset=utf-8;" });

            let url = URL.createObjectURL(blob);

            let a = document.createElement("a");
            a.href = url;
            a.download = "Listado_Choferes.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }


        function formatFechaUTC3(isoDate) {
            if (!isoDate) return '';
            const date = new Date(isoDate);
            const utc3Date = new Date(date.getTime() - 3 * 60 * 60 * 1000);

            const day = String(utc3Date.getDate()).padStart(2, '0');
            const month = String(utc3Date.getMonth() + 1).padStart(2, '0');
            const year = utc3Date.getFullYear();
            const hours = String(utc3Date.getHours()).padStart(2, '0');
            const minutes = String(utc3Date.getMinutes()).padStart(2, '0');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

    </script>

</body>

</html>
