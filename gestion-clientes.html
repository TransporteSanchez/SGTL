<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar clientes · SGTL</title>

    <style>
        #app {
            display: none;
        }

    </style>

    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">



    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/extensions/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
</head>

<body>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando…</span>
        </div>
    </div>

    <script src="assets/static/js/initTheme.js"></script>
    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <!--Header-->
            <header>

                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>

                        <!--btn para expandir Menú lateral-->


                        <!--Llamado a las opciones del header-->

                        <div id="header-container"></div>

                        <script src="./assets/static/js/header.js"></script>

                    </div>
                </nav>
            </header>

            <div class="page-heading">
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">
                        <div class="card-header d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div>
                                <h5 class="card-title mb-1">
                                    <i class="bi bi-person-workspace me-2" aria-hidden="true"></i>Gestionar clientes
                                </h5>
                                <p class="text-muted mb-0">Registrá clientes, editá sus datos y cambiá su estado.</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-outline-secondary" id="btnExportar"
                                    data-bs-toggle="tooltip" title="Exportar" aria-label="Exportar">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                </button>
                                <button type="button" class="btn btn-success" id="btnRegistrarCliente">
                                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Registrar cliente
                                </button>
                            </div>
                        </div>

                        <div class="card-body">
                            <form id="busquedaClienteForm" class="row g-3 align-items-end" novalidate>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="filtroRazonSocial" class="form-label">Razón social</label>
                                    <input type="text" class="form-control" id="filtroRazonSocial"
                                        placeholder="Distribuidora Norte" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="filtroCuit" class="form-label">CUIT</label>
                                    <input type="text" inputmode="numeric" class="form-control" id="filtroCuit"
                                        placeholder="30-71234567-8" autocomplete="off">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="fechaRango" class="form-label">Fecha de alta</label>
                                    <input type="text" class="form-control" id="fechaRango"
                                        placeholder="Desde y hasta">
                                </div>
                                <div class="col-12 col-sm-6 col-lg-3">
                                    <label for="filtroEstado" class="form-label">Estado</label>
                                    <select id="filtroEstado" class="form-select">
                                        <option value="Activo" selected>Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                        <option value="">Todos</option>
                                    </select>
                                </div>
                                <div class="col-12 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-light">
                                        <i class="bi bi-search me-1" aria-hidden="true"></i>Buscar
                                    </button>
                                </div>
                            </form>

                            <div class="table-responsive mt-4">
                                <table class="table table-striped table-hover" id="tablaClientes">
                                    <thead>
                                        <tr>
                                            <th>Razón social</th>
                                            <th>CUIT</th>
                                            <th class="text-center">Fecha de alta</th>
                                            <th class="text-center">Estado</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="5" class="text-center text-muted py-4">Cargando…</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <nav aria-label="Paginación de clientes">
                                <ul class="pagination justify-content-end" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </div>

            <!--Footer-->

            <footer>
                <div id="footer-container"></div>

                <script src="./assets/static/js/footer.js"></script>

            </footer>

        </div>

        <!-- Modal Registrar / Editar cliente: lo arma assets/static/js/cliente-editar.js (el mismo de la proforma). -->

    </div>


    <!--Scripts-->
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="./assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/clientes.js"></script>
    <script src="assets/static/js/cliente-editar.js"></script>

    <!-- Carga de diseño y roles -->
    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'No se pudo cargar la pantalla. Revisá la conexión y probá de nuevo.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

    </script>

    <!-- Buscar y listar -->
    <script>
        const API = API_CLIENTES;
        const COLUMNAS_CLIENTES = 5;
        let pageSize = 15;
        let currentPage = 1;
        let ultimaBusqueda = 0;
        let clientesPagina = {};

        function filaCliente(cliente) {
            clientesPagina[cliente.Cliente_ID] = cliente;
            const activo = clienteActivo(cliente);
            const acciones = SGTL.accionesFila([
                SGTL.botonFila('editar', { id: cliente.Cliente_ID }),
                SGTL.botonFila(activo ? 'inactivar' : 'activar', { id: cliente.Cliente_ID }),
                SGTL.botonFila('eliminar', { id: cliente.Cliente_ID })
            ]);
            return `<tr>
                <td>${SGTL.escapar(cliente.RazonSocial)}</td>
                <td class="text-nowrap">${SGTL.escapar(formatearCUIT(cliente.CUIT_Cliente))}</td>
                <td class="text-center text-nowrap">${fechaCliente(cliente.Fecha_Alta)}</td>
                <td class="text-center">${SGTL.estado(estadoCliente(activo))}</td>
                <td class="text-center">${acciones}</td>
            </tr>`;
        }

        function buscarClientes(page = 1) {
            const tbody = '#tablaClientes tbody';
            const busqueda = ++ultimaBusqueda;
            currentPage = page;
            SGTL.tabla.cargando(tbody, COLUMNAS_CLIENTES);

            SGTL.ajax({
                url: API + '/Clientes/Buscar',
                type: 'GET',
                data: Object.assign(filtrosBusquedaClientes(), { page: page, pageSize: pageSize })
            }, 'No se pudieron cargar los clientes. Revisá la conexión y probá de nuevo.').then(function (data) {
                if (busqueda !== ultimaBusqueda) return;
                const registros = data.Results || [];
                const total = data.TotalRecords || 0;
                if (!registros.length && total && page > 1) {
                    buscarClientes(page - 1);
                    return;
                }
                clientesPagina = {};
                if (registros.length) SGTL.tabla.llenar(tbody, registros.map(filaCliente).join(''));
                else SGTL.tabla.vacia(tbody, COLUMNAS_CLIENTES);
                SGTL.tabla.paginacion('#pagination', {
                    total: total,
                    tamanioPagina: pageSize,
                    pagina: page,
                    alCambiarPagina: function (pagina) { buscarClientes(pagina); },
                    alCambiarTamanio: function (tamanio) { pageSize = tamanio; buscarClientes(1); }
                });
            }, function (error) {
                if (busqueda !== ultimaBusqueda) return;
                SGTL.tabla.vacia(tbody, COLUMNAS_CLIENTES, 'No se pudieron cargar los clientes.');
                SGTL.tabla.paginacion('#pagination', { total: 0 });
                SGTL.toastError(error.mensajeUsuario);
            });
        }

        $(function () {
            prepararFiltrosClientes(buscarClientes);
            buscarClientes(1);
        });
    </script>

    <!-- Acciones de cada fila: activar / inactivar y eliminar -->
    <script>
        function usuarioActual(porDefecto) {
            return localStorage.getItem('username') || porDefecto;
        }

        function cambiarEstadoCliente(boton) {
            const id = $(boton).data('id');
            const activar = $(boton).data('accion') === 'activar';
            const listo = SGTL.procesando(boton);

            SGTL.ajax({
                url: `${API}/Clientes/Estado/${id}`,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ EstadoCliente: activar, Usu_Modi: usuarioActual('sistema') })
            }, 'No se pudo cambiar el estado del cliente. Probá de nuevo.').then(function () {
                SGTL.toastExito(activar ? 'Cliente activado.' : 'Cliente inactivado.');
                buscarClientes(currentPage);
            }, function (error) {
                listo();
                SGTL.toastError(error.mensajeUsuario);
            });
        }

        function eliminarCliente(id) {
            const cliente = clientesPagina[id] || {};
            const nombre = (cliente.RazonSocial || '').trim();

            SGTL.confirmar({
                titulo: nombre ? `¿Eliminar el cliente ${nombre}?` : '¿Eliminar el cliente?',
                mensaje: 'No se puede deshacer.',
                verbo: 'Eliminar',
                peligro: true,
                accion: function () {
                    return SGTL.ajax({ url: `${API}/Clientes/${id}`, type: 'DELETE' },
                        'No se pudo eliminar el cliente. Si ya tiene viajes o comprobantes, inactivalo en lugar de eliminarlo.');
                }
            }).then(function (eliminado) {
                if (!eliminado) return;
                SGTL.toastExito('Cliente eliminado.');
                buscarClientes(currentPage);
            });
        }

        $(function () {
            $('#tablaClientes')
                .on('click', '[data-accion="editar"]', function () { abrirModalCliente($(this).data('id')); })
                .on('click', '[data-accion="activar"], [data-accion="inactivar"]', function () { cambiarEstadoCliente(this); })
                .on('click', '[data-accion="eliminar"]', function () { eliminarCliente($(this).data('id')); });
        });
    </script>

    <!-- Registrar y editar: el formulario compartido con la proforma (cliente-editar.js) -->
    <script>
        function abrirModalCliente(id) {
            SGTLEditarCliente.abrir(id, {
                alCerrar: function (resultado) { if (resultado) buscarClientes(resultado.esAlta ? 1 : currentPage); }
            });
        }

        $(function () {
            $('#btnRegistrarCliente').on('click', function () { abrirModalCliente(null); });
        });
    </script>

</body>

</html>
