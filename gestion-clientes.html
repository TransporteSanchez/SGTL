    <!-- Carga de diseño y roles -->
    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'No se pudo cargar la pantalla. Revisá la conexión y probá de nuevo.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

    </script>

    <!-- Buscar y listar -->
    <script>
        const API = API_CLIENTES;
        const COLUMNAS_CLIENTES = 5;
        let pageSize = 15;
        let currentPage = 1;
        let ultimaBusqueda = 0;
        let clientesPagina = {};

        function filaCliente(cliente) {
            clientesPagina[cliente.Cliente_ID] = cliente;
            const activo = clienteActivo(cliente);
            const acciones = SGTL.accionesFila([
                SGTL.botonFila('editar', { id: cliente.Cliente_ID }),
                SGTL.botonFila(activo ? 'inactivar' : 'activar', { id: cliente.Cliente_ID }),
                SGTL.botonFila('eliminar', { id: cliente.Cliente_ID })
            ]);
            return `<tr>
                <td>${SGTL.escapar(cliente.RazonSocial)}</td>
                <td class="text-nowrap">${SGTL.escapar(formatearCUIT(cliente.CUIT_Cliente))}</td>
                <td class="text-center text-nowrap">${fechaCliente(cliente.Fecha_Alta)}</td>
                <td class="text-center">${SGTL.estado(estadoCliente(activo))}</td>
                <td class="text-center">${acciones}</td>
            </tr>`;
        }

        function buscarClientes(page = 1) {
            const tbody = '#tablaClientes tbody';
            const busqueda = ++ultimaBusqueda;
            currentPage = page;
            SGTL.tabla.cargando(tbody, COLUMNAS_CLIENTES);

            SGTL.ajax({
                url: API + '/Clientes/Buscar',
                type: 'GET',
                data: Object.assign(filtrosBusquedaClientes(), { page: page, pageSize: pageSize })
            }, 'No se pudieron cargar los clientes. Revisá la conexión y probá de nuevo.').then(function (data) {
                if (busqueda !== ultimaBusqueda) return;
                const registros = data.Results || [];
                const total = data.TotalRecords || 0;
                if (!registros.length && total && page > 1) {
                    buscarClientes(page - 1);
                    return;
                }
                clientesPagina = {};
                if (registros.length) SGTL.tabla.llenar(tbody, registros.map(filaCliente).join(''));
                else SGTL.tabla.vacia(tbody, COLUMNAS_CLIENTES);
                SGTL.tabla.paginacion('#pagination', {
                    total: total,
                    tamanioPagina: pageSize,
                    pagina: page,
                    alCambiarPagina: function (pagina) { buscarClientes(pagina); },
                    alCambiarTamanio: function (tamanio) { pageSize = tamanio; buscarClientes(1); }
                });
            }, function (error) {
                if (busqueda !== ultimaBusqueda) return;
                SGTL.tabla.vacia(tbody, COLUMNAS_CLIENTES, 'No se pudieron cargar los clientes.');
                SGTL.tabla.paginacion('#pagination', { total: 0 });
                SGTL.toastError(error.mensajeUsuario);
            });
        }

        $(function () {
            prepararFiltrosClientes(buscarClientes);
            buscarClientes(1);
        });
    </script>

    <!-- Acciones de cada fila: activar / inactivar y eliminar -->
    <script>
        function usuarioActual(porDefecto) {
            return localStorage.getItem('username') || porDefecto;
        }

        function cambiarEstadoCliente(boton) {
            const id = $(boton).data('id');
            const activar = $(boton).data('accion') === 'activar';
            const listo = SGTL.procesando(boton);

            SGTL.ajax({
                url: `${API}/Clientes/Estado/${id}`,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ EstadoCliente: activar, Usu_Modi: usuarioActual('sistema') })
            }, 'No se pudo cambiar el estado del cliente. Probá de nuevo.').then(function () {
                SGTL.toastExito(activar ? 'Cliente activado.' : 'Cliente inactivado.');
                buscarClientes(currentPage);
            }, function (error) {
                listo();
                SGTL.toastError(error.mensajeUsuario);
            });
        }

        function eliminarCliente(id) {
            const cliente = clientesPagina[id] || {};
            const nombre = (cliente.RazonSocial || '').trim();

            SGTL.confirmar({
                titulo: nombre ? `¿Eliminar el cliente ${nombre}?` : '¿Eliminar el cliente?',
                mensaje: 'No se puede deshacer.',
                verbo: 'Eliminar',
                peligro: true,
                accion: function () {
                    return SGTL.ajax({ url: `${API}/Clientes/${id}`, type: 'DELETE' },
                        'No se pudo eliminar el cliente. Si ya tiene viajes o comprobantes, inactivalo en lugar de eliminarlo.');
                }
            }).then(function (eliminado) {
                if (!eliminado) return;
                SGTL.toastExito('Cliente eliminado.');
                buscarClientes(currentPage);
            });
        }

        $(function () {
            $('#tablaClientes')
                .on('click', '[data-accion="editar"]', function () { abrirModalCliente($(this).data('id')); })
                .on('click', '[data-accion="activar"], [data-accion="inactivar"]', function () { cambiarEstadoCliente(this); })
                .on('click', '[data-accion="eliminar"]', function () { eliminarCliente($(this).data('id')); });
        });
    </script>

    <!-- Registrar y editar -->
    <script>
        let clienteEnEdicion = null;
        let clienteOriginal = null;
        let provinciasCargadas = null;
        let formularioCliente = null;

        const reglasCliente = [
            { id: 'clienteRazonSocial', requerido: 'Completá la razón social.' },
            {
                id: 'clienteCuit', requerido: 'Completá el CUIT.',
                regex: /^[0-9]{2}-[0-9]{8}-[0-9]$/, mensaje: 'El CUIT tiene que tener 11 números.'
            },
            { id: 'clienteCondFiscal', requerido: 'Seleccioná la condición de IVA.' },
            { id: 'clienteTelefono', requerido: 'Completá el teléfono.', soloNumeros: true, max: 10 },
            {
                id: 'clienteEmail', regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                mensaje: 'Revisá el e-mail: tiene que tener @ y un dominio, como nombre@correo.com.'
            },
            { id: 'clienteProvincia', requerido: 'Seleccioná una provincia.' },
            { id: 'clienteLocalidad', requerido: 'Seleccioná una localidad.' },
            { id: 'clienteCalle', requerido: 'Completá la calle.' },
            { id: 'clienteAltura', requerido: 'Completá la altura.' },
            { id: 'clienteCodigoPostal', max: 20 }
        ];

        function cargarProvincias(select) {
            if (!provinciasCargadas) {
                provinciasCargadas = SGTL.ajax({ url: API + '/Provincias', type: 'GET' },
                    'No se pudieron cargar las provincias. Revisá la conexión y probá de nuevo.');
                provinciasCargadas.catch(function () { provinciasCargadas = null; });
            }
            return provinciasCargadas.then(function (provincias) {
                select.innerHTML = '';
                select.appendChild(new Option('Seleccioná una provincia', ''));
                provincias.forEach(function (provincia) {
                    select.appendChild(new Option(provincia.Nombre_Provincia, provincia.Prov_ID));
                });
            });
        }

        function cargarLocalidades(select, provinciaId) {
            select.innerHTML = '';
            select.appendChild(new Option('Seleccioná una localidad', ''));
            select.disabled = true;
            if (!provinciaId) return Promise.resolve();
            return SGTL.ajax({ url: `${API}/Provincias/${provinciaId}/Localidades`, type: 'GET' },
                'No se pudieron cargar las localidades. Revisá la conexión y probá de nuevo.').then(function (localidades) {
                    localidades.forEach(function (localidad) {
                        select.appendChild(new Option(localidad.Nombre_Localidad, localidad.Loc_ID));
                    });
                    select.disabled = false;
                });
        }

        // Resuelve false si el CUIT ya es de otro cliente (y lo marca en el formulario).
        function verificarCUIT() {
            const campo = document.getElementById('clienteCuit');
            const cuit = campo.value.replace(/\D/g, '');
            if (cuit.length !== 11) return Promise.resolve(true);
            const url = clienteEnEdicion
                ? `${API}/Clientes/ValidarCUIT/${cuit}/${clienteEnEdicion}`
                : `${API}/Clientes/ValidarCUIT/${cuit}`;
            return SGTL.ajax({ url: url, type: 'GET' }, 'No se pudo verificar el CUIT. Probá de nuevo.').then(function (respuesta) {
                if (campo.value.replace(/\D/g, '') !== cuit) return true;
                if (respuesta && respuesta.codigo === 'CUIT_registrado') {
                    campo.dataset.errorRemoto = clienteEnEdicion
                        ? 'El CUIT ya está registrado con otro cliente.'
                        : 'El CUIT ya está registrado.';
                    SGTL.marcarError(campo, campo.dataset.errorRemoto);
                    return false;
                }
                return true;
            });
        }

        function abrirModalCliente(id) {
            const esAlta = !id;
            clienteEnEdicion = esAlta ? null : id;
            clienteOriginal = null;
            SGTL.reiniciarFormulario('#formCliente', '#avisoCliente');
            formularioCliente.reiniciar();
            $('#modalClienteTitulo').text(esAlta ? 'Registrar cliente' : 'Editar cliente');
            $('#datosEdicionCliente').toggleClass('d-none', esAlta);
            $('#estadoActualCliente, #fechaAltaCliente').empty();
            const provincia = document.getElementById('clienteProvincia');
            const localidad = document.getElementById('clienteLocalidad');
            const guardar = document.getElementById('btnGuardarCliente');
            cargarLocalidades(localidad, '');
            guardar.disabled = true;
            SGTL.modal('#modalCliente', 'show');

            if (esAlta) {
                cargarProvincias(provincia).then(function () { guardar.disabled = false; }, function (error) {
                    SGTL.avisoFormulario('#avisoCliente', error.mensajeUsuario);
                });
                return;
            }

            SGTL.ajax({ url: `${API}/Clientes/${id}`, type: 'GET' },
                'No se pudieron cargar los datos del cliente. Probá de nuevo.').then(function (data) {
                    clienteOriginal = data;
                    $('#clienteRazonSocial').val(data.Razon_Social || '');
                    $('#clienteCuit').val(formatearCUIT(data.CUIT_Cliente));
                    $('#clienteCondFiscal').val(CONDICIONES_IVA[data.Cond_Fiscal] ? String(data.Cond_Fiscal) : '');
                    $('#clienteTipo').val(data.Tipo_Cliente === 'Con_plataforma' ? 'Con_plataforma' : 'Directo');
                    $('#clienteTelefono').val((data.Telefono || '').trim());
                    $('#clienteEmail').val(data.Email || '');
                    $('#clienteCalle').val(data.Calle || '');
                    $('#clienteAltura').val((data.AlturaCalle || '').trim());
                    $('#clienteCodigoPostal').val(data.CodigoPostal || '');
                    $('#estadoActualCliente').html(SGTL.estado(estadoCliente(clienteActivo(data))));
                    $('#fechaAltaCliente').text(fechaCliente(data.Fecha_Alta));
                    return cargarProvincias(provincia).then(function () {
                        provincia.value = data.ProvID || '';
                        return cargarLocalidades(localidad, data.ProvID);
                    }).then(function () {
                        localidad.value = data.LocID || '';
                        guardar.disabled = false;
                    });
                }).catch(function (error) {
                    SGTL.modal('#modalCliente', 'hide');
                    SGTL.toastError(error.mensajeUsuario);
                });
        }

        function datosCliente() {
            const valor = function (id) { return document.getElementById(id).value.trim(); };
            return {
                Cliente_ID: clienteEnEdicion ? parseInt(clienteEnEdicion, 10) : 0,
                Razon_Social: valor('clienteRazonSocial'),
                CUIT_Cliente: valor('clienteCuit').replace(/\D/g, ''),
                Cond_Fiscal: parseInt(valor('clienteCondFiscal'), 10),
                Tipo_Cliente: valor('clienteTipo'),
                Telefono: valor('clienteTelefono'),
                Email: valor('clienteEmail'),
                ProvID: parseInt(valor('clienteProvincia'), 10),
                LocID: parseInt(valor('clienteLocalidad'), 10),
                Calle: valor('clienteCalle'),
                AlturaCalle: valor('clienteAltura'),
                CodigoPostal: valor('clienteCodigoPostal')
            };
        }

        async function guardarCliente() {
            const esAlta = !clienteEnEdicion;
            const boton = document.getElementById('btnGuardarCliente');

            formularioCliente.validarTodo();
            if (!SGTL.revisarFormulario('#formCliente', '#avisoCliente')) return;

            const listo = SGTL.procesando(boton, 'Guardando…');
            let guardado = false;
            try {
                if (!(await verificarCUIT())) {
                    SGTL.revisarFormulario('#formCliente', '#avisoCliente');
                    return;
                }
                const usuario = usuarioActual('Desconocido');
                const ahora = new Date().toISOString();
                const cliente = Object.assign(datosCliente(), {
                    Fecha_Alta: esAlta ? ahora : clienteOriginal.Fecha_Alta,
                    Usu_Alta: esAlta ? usuario : clienteOriginal.Usu_Alta,
                    Fecha_Modi: ahora,
                    Usu_Modi: usuario
                });
                await SGTL.ajax({
                    url: esAlta ? API + '/Clientes' : `${API}/Clientes/${clienteEnEdicion}`,
                    type: esAlta ? 'POST' : 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(cliente)
                }, 'No se pudo guardar el cliente. Revisá la conexión y probá de nuevo.');
                guardado = true;
            } catch (error) {
                SGTL.avisoFormulario('#avisoCliente', error.mensajeUsuario || 'No se pudo guardar el cliente. Probá de nuevo.');
            } finally {
                listo();
            }

            if (!guardado) return;
            SGTL.toastExito(esAlta ? 'Cliente registrado.' : 'Cliente guardado.');
            buscarClientes(esAlta ? 1 : currentPage);
            setTimeout(function () { SGTL.modal('#modalCliente', 'hide'); }, 0);
        }

        $(function () {
            const cuit = document.getElementById('clienteCuit');
            cuit.addEventListener('input', function () { cuit.value = formatearCUIT(cuit.value); });
            formularioCliente = SGTL.validador(reglasCliente);
            cuit.addEventListener('blur', function () {
                if (!cuit.classList.contains('is-invalid')) verificarCUIT().catch(function () { });
            });
            const provincia = document.getElementById('clienteProvincia');
            provincia.addEventListener('change', function () {
                cargarLocalidades(document.getElementById('clienteLocalidad'), provincia.value).catch(function (error) {
                    SGTL.avisoFormulario('#avisoCliente', error.mensajeUsuario);
                });
            });
            $('#btnRegistrarCliente').on('click', function () { abrirModalCliente(null); });
            $('#btnGuardarCliente').on('click', guardarCliente);
            $('#modalCliente').on('shown.bs.modal', function () {
                if (!clienteEnEdicion) $('#clienteRazonSocial').trigger('focus');
            });
        });
    </script>

</body>

</html>
