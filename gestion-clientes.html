<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Gestionar clientes</title>
    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">
    <link rel="stylesheet" href="assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/extensions/flatpickr/flatpickr.min.css">
</head>

<body>
    <div id="loading-message" class="min-vh-100 d-flex align-items-center justify-content-center gap-2" role="status">
        <span class="spinner-border" aria-hidden="true"></span>
        <span>Cargando…</span>
    </div>

    <div id="app" class="d-none">
        <div id="sidebar"></div>
        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>

            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloClientes">
                    <div class="card rounded">
                        <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                            <div>
                                <h1 id="tituloClientes" class="card-title h5 mb-1"><i class="bi bi-person-workspace me-2" aria-hidden="true"></i>Gestionar clientes</h1>
                                <p class="text-muted mb-0">Registro, datos y estado de cada cliente.</p>
                            </div>
                            <div class="d-flex gap-2 ms-auto">
                                <button type="button" id="btnDescargarClientes" class="btn btn-secondary"
                                    data-bs-toggle="tooltip" title="Descargar reporte" aria-label="Descargar reporte">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                </button>
                                <button type="button" id="btnRegistrarCliente" class="btn btn-success">
                                    <i class="bi bi-person-plus" aria-hidden="true"></i>
                                    Registrar cliente
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <form id="busquedaClienteForm" class="mb-4" novalidate>
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="txtCUIT_Cliente_Busqueda" class="form-label">CUIT</label>
                                        <input type="text" id="txtCUIT_Cliente_Busqueda" class="form-control"
                                            placeholder="XX-XXXXXXXX-X" maxlength="13" inputmode="numeric"
                                            autocomplete="off">
                                    </div>
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="razonSocialClientesSelect" class="form-label">Razón social</label>
                                        <select id="razonSocialClientesSelect" class="form-select"
                                            aria-label="Razón social">
                                            <option value="">Todos</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="estadoClienteBusqueda" class="form-label">Estado</label>
                                        <select id="estadoClienteBusqueda" class="form-select">
                                            <option value="Activo" selected>Activo</option>
                                            <option value="Inactivo">Inactivo</option>
                                            <option value="">Todos</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6 col-lg-3">
                                        <label for="fechaRango" class="form-label">Fecha de alta</label>
                                        <input type="text" id="fechaRango" class="form-control"
                                            placeholder="DD/MM/AAAA - DD/MM/AAAA" autocomplete="off">
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="submit" class="btn btn-light">Buscar</button>
                                </div>
                            </form>

                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle mb-0" id="tablaClientes"
                                    aria-labelledby="tituloClientes">
                                    <thead class="text-nowrap">
                                        <tr>
                                            <th scope="col">Razón social</th>
                                            <th scope="col">CUIT</th>
                                            <th scope="col" class="text-center">Fecha de alta</th>
                                            <th scope="col" class="text-center">Estado</th>
                                            <th scope="col" class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="filasClientes"></tbody>
                                </table>
                            </div>
                            <nav aria-label="Paginación de clientes">
                                <ul class="pagination justify-content-end" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                <div id="footer-container"></div>
            </footer>
        </div>
    </div>

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/extensions/flatpickr/flatpickr.min.js"></script>
    <script src="assets/extensions/flatpickr/l10n/es.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/js/cliente-editar.js"></script>
    <script src="assets/static/js/select-cliente-predictivo.js"></script>
    <script src="assets/static/js/filtro-clientes-razon-social.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const filasClientes = document.getElementById('filasClientes');
            const paginador = document.getElementById('pagination');
            const cuitFiltro = document.getElementById('txtCUIT_Cliente_Busqueda');
            const razonFiltro = document.getElementById('txtRazonSocialBusqueda');
            const estadoFiltro = document.getElementById('estadoClienteBusqueda');
            const fechaFiltro = document.getElementById('fechaRango');
            const botonRegistrar = document.getElementById('btnRegistrarCliente');
            const botonDescargar = document.getElementById('btnDescargarClientes');
            const columnas = 5;
            let paginaActual = 1;
            let tamanioPagina = 15;
            let busquedaActual = 0;

            const validadorCUIT = SGTL.validador([{
                id: 'txtCUIT_Cliente_Busqueda',
                regex: /^\d{2}-\d{8}-\d$/,
                mensaje: 'El CUIT tiene que tener 11 números.'
            }]);

            function formatearCUIT(valor) {
                const digitos = String(valor || '').replace(/\D/g, '').slice(0, 11);
                if (digitos.length <= 2) return digitos;
                if (digitos.length <= 10) return digitos.slice(0, 2) + '-' + digitos.slice(2);
                return digitos.slice(0, 2) + '-' + digitos.slice(2, 10) + '-' + digitos.slice(10);
            }

            function armarFiltrosClientes() {
                if (!validadorCUIT.validar('txtCUIT_Cliente_Busqueda')) {
                    cuitFiltro.focus();
                    return null;
                }

                const filtros = {
                    cuit: cuitFiltro.value.replace(/\D/g, ''),
                    razonSocial: razonFiltro.value.trim(),
                    estadoCliente: estadoFiltro.value
                };
                const rango = SGTL.valorRango(fechaFiltro);
                if (rango) {
                    filtros.fechaDesde = rango.desde;
                    filtros.fechaHasta = rango.hasta;
                }
                return filtros;
            }

            function textoEstado(activo) {
                if (activo === true) return 'Activo';
                if (activo === false) return 'Inactivo';
                return '';
            }

            function filaCliente(registro) {
                const id = registro.Cliente_ID;
                const estado = textoEstado(registro.EstadoCliente);
                const acciones = [SGTL.botonFila('editar', { id })];
                if (estado) {
                    acciones.push(SGTL.botonFila(
                        registro.EstadoCliente ? 'inactivar' : 'activar', { id }
                    ));
                }
                acciones.push(SGTL.botonFila('eliminar', { id }));

                return '<tr>' +
                    '<td>' + SGTL.escapar(registro.RazonSocial || registro.Razon_Social) + '</td>' +
                    '<td class="text-nowrap">' + SGTL.escapar(formatearCUIT(registro.CUIT_Cliente)) + '</td>' +
                    '<td class="text-center text-nowrap">' + SGTL.fecha(registro.Fecha_Alta) + '</td>' +
                    '<td class="text-center">' + (estado ? SGTL.estado(estado) : '—') + '</td>' +
                    '<td class="text-center">' + SGTL.accionesFila(acciones) + '</td></tr>';
            }

            async function consultarClientes(filtros, pagina, cantidad) {
                const resultado = await SGTL.ajax({
                    url: SGTL.api + '/Clientes/Buscar',
                    type: 'GET',
                    data: { ...filtros, page: pagina, pageSize: cantidad }
                }, 'No se pudieron consultar los clientes. Probá de nuevo.');

                if (!resultado || !Array.isArray(resultado.Results) ||
                    !Number.isInteger(Number(resultado.TotalRecords)) || Number(resultado.TotalRecords) < 0) {
                    throw new Error('No se pudieron consultar los clientes.');
                }
                return resultado;
            }

            async function buscarClientes(pagina = 1) {
                const filtros = armarFiltrosClientes();
                if (!filtros) return;
                const solicitud = ++busquedaActual;

                SGTL.tabla.cargando(filasClientes, columnas);
                try {
                    const resultado = await consultarClientes(filtros, pagina, tamanioPagina);
                    if (solicitud !== busquedaActual) return;

                    const total = Number(resultado.TotalRecords);
                    const ultimaPagina = tamanioPagina
                        ? Math.max(1, Math.ceil(total / tamanioPagina)) : 1;
                    if (pagina > ultimaPagina) {
                        await buscarClientes(ultimaPagina);
                        return;
                    }

                    paginaActual = pagina;
                    if (resultado.Results.length) {
                        SGTL.tabla.llenar(filasClientes, resultado.Results.map(filaCliente).join(''));
                    } else {
                        SGTL.tabla.vacia(filasClientes, columnas);
                    }
                    SGTL.tabla.paginacion(paginador, {
                        total,
                        pagina: paginaActual,
                        tamanioPagina,
                        alCambiarPagina: buscarClientes,
                        alCambiarTamanio: function (cantidad) {
                            tamanioPagina = cantidad;
                            buscarClientes(1);
                        }
                    });
                } catch (error) {
                    if (solicitud !== busquedaActual) return;
                    SGTL.tabla.vacia(filasClientes, columnas, 'No se pudieron cargar los clientes.');
                    SGTL.tabla.paginacion(paginador, { total: 0 });
                    SGTL.toastError(error.mensajeUsuario || 'No se pudieron cargar los clientes. Probá de nuevo.');
                }
            }

            async function abrirFormulario(boton, id = null) {
                const listo = SGTL.procesando(boton);
                try {
                    await SGTLEditarCliente.abrir(id, {
                        alCerrar: async function (resultado) {
                            if (!resultado) return;
                            await FiltroRazonSocialClientes.recargar();
                            await buscarClientes(resultado.esAlta ? 1 : paginaActual);
                        }
                    });
                } catch (error) {
                    SGTL.toastError(error.mensajeUsuario || 'No se pudo abrir el formulario. Probá de nuevo.');
                } finally {
                    listo();
                }
            }

            async function ejecutarAccion(boton) {
                const accion = boton.dataset.accion;
                const eliminar = accion === 'eliminar';
                const activar = accion === 'activar';
                const verbo = eliminar ? 'Eliminar' : activar ? 'Activar' : 'Inactivar';
                const mensajeError = eliminar
                    ? 'No se pudo eliminar el cliente. Probá de nuevo.'
                    : 'No se pudo cambiar el estado del cliente. Probá de nuevo.';
                const id = encodeURIComponent(boton.dataset.id);
                const pedido = eliminar
                    ? { url: SGTL.api + '/Clientes/' + id, type: 'DELETE' }
                    : {
                        url: SGTL.api + '/Clientes/Estado/' + id,
                        type: 'PUT',
                        contentType: 'application/json; charset=utf-8',
                        data: JSON.stringify({ EstadoCliente: activar })
                    };
                const listo = SGTL.procesando(boton);
                try {
                    const confirmado = await SGTL.confirmar({
                        titulo: verbo + ' cliente',
                        mensaje: eliminar
                            ? '¿Querés eliminar este cliente de forma definitiva?'
                            : '¿Querés ' + verbo.toLowerCase() + ' este cliente?',
                        verbo,
                        accion: function () {
                            return SGTL.ajax(pedido, mensajeError);
                        }
                    });
                    if (!confirmado) return;

                    SGTL.toastExito(eliminar ? 'Cliente eliminado.'
                        : activar ? 'Cliente activado.' : 'Cliente inactivado.');
                    if (eliminar) await FiltroRazonSocialClientes.recargar();
                    await buscarClientes(1);
                } catch (error) {
                    SGTL.toastError(error.mensajeUsuario || mensajeError);
                } finally {
                    listo();
                }
            }

            async function descargarClientes() {
                const filtros = armarFiltrosClientes();
                if (!filtros) return;

                const listo = SGTL.procesando(botonDescargar);
                const mensajeError = 'No se pudo descargar el reporte. Probá de nuevo.';
                try {
                    const resultado = await consultarClientes(filtros, 1, 0);
                    if (!resultado.Results.length) {
                        SGTL.toastError('No hay clientes para exportar con los filtros elegidos.');
                        return;
                    }

                    const provincias = await SGTL.ajax({
                        url: SGTL.api + '/Provincias',
                        type: 'GET'
                    }, mensajeError);
                    const nombresProvincia = new Map(provincias.map(p => [p.Prov_ID, p.Nombre_Provincia]));
                    const localidadesPorProvincia = new Map();
                    const condiciones = { 1: 'Responsable inscripto', 2: 'Monotributista', 3: 'Exento' };
                    const tipos = { Directo: 'Directo', Con_plataforma: 'Con plataforma' };
                    const filas = [];

                    function localidadesDe(provId) {
                        if (!provId) return Promise.resolve(new Map());
                        if (!localidadesPorProvincia.has(provId)) {
                            localidadesPorProvincia.set(provId, SGTL.ajax({
                                url: SGTL.api + '/Provincias/' + encodeURIComponent(provId) + '/Localidades',
                                type: 'GET'
                            }, mensajeError).catch(error => {
                                if (error.xhr && error.xhr.status === 404) return [];
                                throw error;
                            }).then(datos => new Map(datos.map(l => [l.Loc_ID, l.Nombre_Localidad]))));
                        }
                        return localidadesPorProvincia.get(provId);
                    }

                    for (let i = 0; i < resultado.Results.length; i += 8) {
                        const bloque = resultado.Results.slice(i, i + 8);
                        const datos = await Promise.all(bloque.map(async registro => {
                            const cliente = await SGTL.ajax({
                                url: SGTL.api + '/Clientes/' + encodeURIComponent(registro.Cliente_ID),
                                type: 'GET'
                            }, mensajeError);
                            const localidades = await localidadesDe(cliente.ProvID);
                            return [
                                cliente.Cliente_ID, cliente.Razon_Social, formatearCUIT(cliente.CUIT_Cliente),
                                condiciones[cliente.Cond_Fiscal], tipos[cliente.Tipo_Cliente],
                                cliente.Telefono, cliente.Email,
                                nombresProvincia.get(cliente.ProvID), localidades.get(cliente.LocID),
                                cliente.Calle, cliente.AlturaCalle, cliente.CodigoPostal,
                                textoEstado(registro.EstadoCliente),
                                SGTL.fecha(cliente.Fecha_Alta, { hora: true }), cliente.Usu_Alta,
                                SGTL.fecha(cliente.Fecha_Modi, { hora: true }), cliente.Usu_Modi
                            ];
                        }));
                        filas.push(...datos);
                    }

                    SGTL.descargarCSV('Listado_Clientes.csv', [
                        'ID', 'Razón social', 'CUIT', 'Condición fiscal', 'Tipo de cliente',
                        'Teléfono', 'E-mail', 'Provincia', 'Localidad', 'Calle', 'Altura',
                        'Código postal', 'Estado', 'Fecha de alta', 'Usuario de alta',
                        'Fecha de modificación', 'Usuario de modificación'
                    ], filas);
                } catch (error) {
                    SGTL.toastError(error.mensajeUsuario || mensajeError);
                } finally {
                    listo();
                }
            }

            async function inicializarApariencia() {
                const indicador = document.getElementById('loading-message');
                try {
                    const encabezado = window.loadHeader();
                    window.loadFooter();
                    const [contenido] = await Promise.all([
                        SGTL.ajax({
                            url: SGTL.api + '/GestionContenido/1',
                            type: 'GET'
                        }, 'No se pudo cargar la apariencia de SGTL.'),
                        encabezado,
                        window.loadSidebar()
                    ]);

                    const textoPie = contenido.ContenidoPiePagina || '2024 &copy; Integra Analistas';
                    const contenedorPie = document.getElementById('footer-container');
                    window.applyStyles(
                        contenido.Logo,
                        contenido.ColorFondo,
                        contenido.ColorBotonesMenu,
                        textoPie
                    );

                    if (!contenedorPie.querySelector('.footer p')) {
                        const esperarPie = new MutationObserver(function () {
                            const parrafo = contenedorPie.querySelector('.footer p');
                            if (!parrafo) return;
                            esperarPie.disconnect();
                            parrafo.innerHTML = textoPie;
                        });
                        esperarPie.observe(contenedorPie, { childList: true, subtree: true });
                    }

                    indicador.classList.add('d-none');
                    document.getElementById('app').classList.remove('d-none');
                } catch (error) {
                    indicador.textContent =
                        'No se pudo cargar la pantalla. Recargá la página para volver a intentar.';
                }
            }

            cuitFiltro.addEventListener('input', function () {
                cuitFiltro.value = formatearCUIT(cuitFiltro.value);
                SGTL.limpiarError(cuitFiltro);
                if (!cuitFiltro.value) buscarClientes(1);
            });
            estadoFiltro.addEventListener('change', () => buscarClientes(1));
            SGTL.rangoFechas(fechaFiltro, {
                onChange: function (fechas) {
                    if (fechas.length === 2) buscarClientes(1);
                }
            });
            SGTL.filtros([cuitFiltro, razonFiltro, estadoFiltro, fechaFiltro], () => buscarClientes(1));
            document.getElementById('busquedaClienteForm').addEventListener('submit', function (evento) {
                evento.preventDefault();
                buscarClientes(1);
            });
            botonRegistrar.addEventListener('click', () => abrirFormulario(botonRegistrar));
            botonDescargar.addEventListener('click', descargarClientes);
            filasClientes.addEventListener('click', function (evento) {
                const boton = evento.target.closest('button[data-accion]');
                if (!boton || boton.disabled) return;
                if (boton.dataset.accion === 'editar') {
                    abrirFormulario(boton, boton.dataset.id);
                } else if (['activar', 'inactivar', 'eliminar'].includes(boton.dataset.accion)) {
                    ejecutarAccion(boton);
                }
            });

            inicializarApariencia();
            buscarClientes(1);
        });
    </script>
</body>

</html>
