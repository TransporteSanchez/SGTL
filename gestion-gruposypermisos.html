<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Gestionar grupos y permisos</title>

    <style>
        #app {
            display: none;
        }
    </style>

    <link rel="shortcut icon" href="./assets/compiled/svg/ts-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/static/css/sgtl.css">
</head>

<body>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>

                        <div id="header-container"></div>
                        <script src="./assets/static/js/header.js"></script>
                    </div>
                </nav>
            </header>

            <div class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4">
                    <div class="card rounded">
                        <div class="card-header">
                            <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
                                <div class="toast align-items-center text-white bg-success border-0" role="alert"
                                    id="alert-success" aria-live="assertive" aria-atomic="true" style="display: none;">
                                    <div class="d-flex">
                                        <div class="toast-body"></div>
                                        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                            data-bs-dismiss="toast" aria-label="Close"></button>
                                    </div>
                                </div>
                            </div>

                            <h1 class="card-title h5 mb-1"><i class="bi bi-people-fill me-2" aria-hidden="true"></i>Gestionar grupos y permisos</h1>
                            <p class="text-muted mb-0">Cada grupo define qué pantallas ven sus usuarios.</p>
                        </div>

                        <div class="card-body">
                            <ul class="nav nav-tabs" id="tabsGruposPermisos" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="tab-grupos" data-bs-toggle="tab"
                                        data-bs-target="#pane-grupos" type="button" role="tab">Grupos</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="tab-permisos" data-bs-toggle="tab"
                                        data-bs-target="#pane-permisos" type="button" role="tab">Permisos por
                                        grupo</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="tab-usuarios" data-bs-toggle="tab"
                                        data-bs-target="#pane-usuarios" type="button" role="tab">Usuarios por
                                        grupo</button>
                                </li>
                            </ul>

                            <div class="tab-content pt-3">
                                <div class="tab-pane fade show active" id="pane-grupos" role="tabpanel">
                                    <div class="row g-3 align-items-end">
                                        <div class="col-md-5">
                                            <label for="txtBuscarGrupo" class="form-label">Buscar grupo</label>
                                            <input type="text" id="txtBuscarGrupo" class="form-control">
                                        </div>
                                        <div class="col-md-7 text-md-end">
                                            <button type="button" class="btn btn-light" id="btnBuscarGrupo">Buscar</button>
                                            <button type="button" class="btn btn-success" data-bs-toggle="modal"
                                                data-bs-target="#modalGrupoAlta">Alta</button>
                                        </div>
                                    </div>

                                    <div class="table-responsive mt-3">
                                        <table class="table table-striped table-hover" id="tablaGrupos">
                                            <thead>
                                                <tr>
                                                    <th>ID</th>
                                                    <th>Grupo</th>
                                                    <th class="text-end">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>

                                <div class="tab-pane fade" id="pane-permisos" role="tabpanel">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="selectGrupoPermisos" class="form-label">Grupo</label>
                                            <select id="selectGrupoPermisos" class="form-select"></select>
                                        </div>
                                        <div class="col-md-6 d-flex align-items-end justify-content-md-end">
                                            <button type="button" class="btn btn-primary" id="btnGuardarPermisos">Guardar
                                                permisos</button>
                                        </div>
                                    </div>
                                    <div class="mt-3" id="contenedorMenusGrupo"></div>
                                </div>

                                <div class="tab-pane fade" id="pane-usuarios" role="tabpanel">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="selectGrupoUsuarios" class="form-label">Grupo</label>
                                            <select id="selectGrupoUsuarios" class="form-select"></select>
                                        </div>
                                        <div class="col-md-6 d-flex align-items-end justify-content-md-end">
                                            <button type="button" class="btn btn-primary" id="btnGuardarUsuariosGrupo">Guardar
                                                usuarios del grupo</button>
                                        </div>
                                    </div>
                                    <div class="mt-3" id="contenedorUsuariosGrupo"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <footer>
                <div id="footer-container"></div>
                <script src="./assets/static/js/footer.js"></script>
            </footer>
        </div>

        <div class="modal fade" id="modalGrupoAlta" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Alta de grupo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label for="txtNuevoGrupo" class="form-label">Nombre del grupo</label>
                        <input type="text" id="txtNuevoGrupo" class="form-control">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnConfirmarAltaGrupo">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalGrupoEdicion" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar grupo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="grupoEdicionId">
                        <label for="txtGrupoEdicion" class="form-label">Nombre del grupo</label>
                        <input type="text" id="txtGrupoEdicion" class="form-control">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnConfirmarEdicionGrupo">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="./assets/static/gestionContenido.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;
                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }
    </script>

    <script>
        const API_BASE = 'http://localhost:50222/api';
        let gruposCache = [];

        function showToast(message) {
            try {
                const toastElement = $('#alert-success');
                if (!toastElement.length) { return; }
                toastElement.find('.toast-body').text(message);
                toastElement.show();
                if (window.bootstrap && bootstrap.Toast) {
                    const toast = new bootstrap.Toast(toastElement[0]);
                    toast.show();
                    setTimeout(function () { try { toast.hide(); } catch (e) { } }, 3500);
                } else {
                    setTimeout(function () { toastElement.hide(); }, 3500);
                }
            } catch (e) { }
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        function cargarGrupos(filtro) {
            $.ajax({
                url: API_BASE + '/Grupos',
                type: 'GET',
                success: function (data) {
                    gruposCache = Array.isArray(data) ? data : [];
                    renderTablaGrupos(filtro || '');
                    cargarCombosGrupos();
                },
                error: function (xhr) {
                    alert('No se pudieron cargar los grupos.');
                    console.error(xhr);
                }
            });
        }

        function renderTablaGrupos(filtro) {
            const tbody = $('#tablaGrupos tbody');
            tbody.empty();
            const texto = (filtro || '').toLowerCase();
            const rows = gruposCache.filter(function (g) {
                return !texto || String(g.Grupo_Nombre || '').toLowerCase().includes(texto);
            });

            if (!rows.length) {
                tbody.html('<tr><td colspan="3" class="text-center">No hay grupos.</td></tr>');
                return;
            }

            rows.forEach(function (g) {
                const $tr = $('<tr>');
                $tr.append($('<td>').text(g.Grupo_ID));
                $tr.append($('<td>').text(g.Grupo_Nombre || ''));

                const $actions = $('<td>').addClass('text-end');
                $actions.append(
                    $('<button>')
                        .addClass('btn btn-sm btn-primary me-1')
                        .text('Editar')
                        .on('click', function () {
                            abrirEdicionGrupo(g.Grupo_ID, g.Grupo_Nombre);
                        })
                );
                $actions.append(
                    $('<button>')
                        .addClass('btn btn-sm btn-danger')
                        .text('Eliminar')
                        .on('click', function () {
                            eliminarGrupo(g.Grupo_ID);
                        })
                );
                $tr.append($actions);
                tbody.append($tr);
            });
        }

        function cargarCombosGrupos() {
            const selPermisos = $('#selectGrupoPermisos');
            const selUsuarios = $('#selectGrupoUsuarios');
            selPermisos.empty();
            selUsuarios.empty();

            if (!gruposCache.length) {
                selPermisos.append('<option value="">Sin grupos</option>');
                selUsuarios.append('<option value="">Sin grupos</option>');
                $('#contenedorMenusGrupo').html('<div class="text-muted">No hay datos para mostrar.</div>');
                $('#contenedorUsuariosGrupo').html('<div class="text-muted">No hay datos para mostrar.</div>');
                return;
            }

            gruposCache.forEach(function (g) {
                const opt = '<option value="' + g.Grupo_ID + '">' + escapeHtml(g.Grupo_Nombre) + '</option>';
                selPermisos.append(opt);
                selUsuarios.append(opt);
            });

            cargarMenusDeGrupo(selPermisos.val());
            cargarUsuariosDeGrupo(selUsuarios.val());
        }

        function mensajeErrorApi(xhr) {
            const json = xhr.responseJSON;
            if (!json) return 'No se pudo completar la operación. Revisá la consola.';
            const msg = json.message || json.Message || json.ExceptionMessage;
            if (msg) return msg;
            if (Array.isArray(json.errors) && json.errors.length) return json.errors.join('\n');
            if (json.detail) return json.detail;
            return 'No se pudo completar la operación.';
        }

        function crearGrupo() {
            const nombre = $('#txtNuevoGrupo').val().trim();
            if (!nombre) {
                alert('Ingresá el nombre del grupo.');
                return;
            }

            const usuarioLogueado = localStorage.getItem('username') || '';
            $.ajax({
                url: API_BASE + '/Grupos',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ Grupo_Nombre: nombre, UsuarioLogueado: usuarioLogueado }),
                success: function () {
                    $('#modalGrupoAlta').modal('hide');
                    $('#txtNuevoGrupo').val('');
                    showToast('Grupo creado correctamente.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function (xhr) {
                    let msg = mensajeErrorApi(xhr);
                    if (xhr.status === 0) {
                        msg = 'No se pudo conectar con el servidor. Verificá que la API esté en ejecución.';
                    }
                    alert(msg);
                }
            });
        }

        function abrirEdicionGrupo(id, nombre) {
            $('#grupoEdicionId').val(id);
            $('#txtGrupoEdicion').val(nombre || '');
            $('#modalGrupoEdicion').modal('show');
        }

        function guardarEdicionGrupo() {
            const id = $('#grupoEdicionId').val();
            const nombre = $('#txtGrupoEdicion').val().trim();
            if (!id || !nombre) {
                alert('Completá el nombre del grupo.');
                return;
            }

            $.ajax({
                url: API_BASE + '/Grupos/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ Grupo_Nombre: nombre }),
                success: function () {
                    $('#modalGrupoEdicion').modal('hide');
                    showToast('Grupo actualizado.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function (xhr) {
                    alert(mensajeErrorApi(xhr));
                }
            });
        }

        function eliminarGrupo(id) {
            if (!confirm('¿Eliminar grupo y todas sus asignaciones?')) return;

            $.ajax({
                url: API_BASE + '/Grupos/' + id,
                type: 'DELETE',
                success: function () {
                    showToast('Grupo eliminado.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function () {
                    alert('No se pudo eliminar el grupo.');
                }
            });
        }

        function cargarMenusDeGrupo(grupoId) {
            if (!grupoId) return;

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Menus',
                type: 'GET',
                success: function (data) {
                    const cont = $('#contenedorMenusGrupo');
                    cont.empty();
                    if (!data || !data.length) {
                        cont.html('<div class="text-muted">No hay menús disponibles.</div>');
                        return;
                    }

                    let html = '<div class="row">';
                    data.forEach(function (item) {
                        html += `
                            <div class="col-md-4 mb-2">
                                <div class="form-check">
                                    <input class="form-check-input chk-menu" type="checkbox" value="${item.Menu_ID}" id="menu_${item.Menu_ID}" ${item.Asignado ? 'checked' : ''}>
                                    <label class="form-check-label" for="menu_${item.Menu_ID}">${escapeHtml(item.Menu_Nombre)}</label>
                                </div>
                            </div>`;
                    });
                    html += '</div>';
                    cont.html(html);
                },
                error: function () {
                    $('#contenedorMenusGrupo').html('<div class="text-danger">Error al cargar permisos.</div>');
                }
            });
        }

        function guardarMenusDeGrupo() {
            const grupoId = $('#selectGrupoPermisos').val();
            if (!grupoId) {
                alert('Seleccioná un grupo.');
                return;
            }

            const ids = $('.chk-menu:checked').map(function () {
                return parseInt($(this).val(), 10);
            }).get();

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Menus',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ MenuIds: ids }),
                success: function () { showToast('Permisos guardados.'); },
                error: function () { alert('No se pudieron guardar los permisos.'); }
            });
        }

        function cargarUsuariosDeGrupo(grupoId) {
            if (!grupoId) return;

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Usuarios',
                type: 'GET',
                success: function (data) {
                    const cont = $('#contenedorUsuariosGrupo');
                    cont.empty();
                    if (!data || !data.length) {
                        cont.html('<div class="text-muted">No hay usuarios disponibles.</div>');
                        return;
                    }

                    let html = '<div class="row">';
                    data.forEach(function (item) {
                        html += `
                            <div class="col-md-6 mb-2">
                                <div class="form-check">
                                    <input class="form-check-input chk-usuario" type="checkbox" value="${item.Usuario_ID}" id="usr_${item.Usuario_ID}" ${item.Asignado ? 'checked' : ''}>
                                    <label class="form-check-label" for="usr_${item.Usuario_ID}">
                                        ${escapeHtml(item.Nombre_Usuario)} - ${escapeHtml(item.NombreCompleto)}
                                    </label>
                                </div>
                            </div>`;
                    });
                    html += '</div>';
                    cont.html(html);
                },
                error: function () {
                    $('#contenedorUsuariosGrupo').html('<div class="text-danger">Error al cargar usuarios del grupo.</div>');
                }
            });
        }

        function guardarUsuariosDeGrupo() {
            const grupoId = $('#selectGrupoUsuarios').val();
            if (!grupoId) {
                alert('Seleccioná un grupo.');
                return;
            }

            const ids = $('.chk-usuario:checked').map(function () {
                return parseInt($(this).val(), 10);
            }).get();

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Usuarios',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ UsuarioIds: ids }),
                success: function () { showToast('Usuarios del grupo guardados.'); },
                error: function () { alert('No se pudo guardar la asignación de usuarios.'); }
            });
        }

        $(document).ready(function () {
            $('#btnBuscarGrupo').on('click', function () {
                renderTablaGrupos($('#txtBuscarGrupo').val());
            });

            $('#txtBuscarGrupo').on('keypress', function (e) {
                if (e.which === 13) {
                    e.preventDefault();
                    renderTablaGrupos($('#txtBuscarGrupo').val());
                }
            });

            $('#btnConfirmarAltaGrupo').on('click', crearGrupo);
            $('#btnConfirmarEdicionGrupo').on('click', guardarEdicionGrupo);
            $('#selectGrupoPermisos').on('change', function () { cargarMenusDeGrupo($(this).val()); });
            $('#selectGrupoUsuarios').on('change', function () { cargarUsuariosDeGrupo($(this).val()); });
            $('#btnGuardarPermisos').on('click', guardarMenusDeGrupo);
            $('#btnGuardarUsuariosGrupo').on('click', guardarUsuariosDeGrupo);

            cargarGrupos('');
        });
    </script>

</body>

</html>
