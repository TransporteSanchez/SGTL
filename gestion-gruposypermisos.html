    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

            try {
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();
                adjustVisibilityBasedOnRole();
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;
                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }
    </script>

    <script>
        const API_BASE = 'http://localhost:50222/api';
        let gruposCache = [];
        let usuariosGrupoCache = [];
        let usuariosSeleccionadosGrupo = new Set();
        let grupoUsuariosCargadoId = null;

        function showToast(message) {
            // Blindado: si el toast falla (API de Bootstrap), no debe cortar el flujo (ej. refresco de tablas).
            try {
                const toastElement = $('#alert-success');
                if (!toastElement.length) { return; }
                toastElement.find('.toast-body').text(message);
                toastElement.show();
                if (window.bootstrap && bootstrap.Toast) {
                    const toast = new bootstrap.Toast(toastElement[0]);
                    toast.show();
                    setTimeout(function () { try { toast.hide(); } catch (e) { } }, 3500);
                } else {
                    setTimeout(function () { toastElement.hide(); }, 3500);
                }
            } catch (e) { /* no-op */ }
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        function cargarGrupos(filtro) {
            $.ajax({
                url: API_BASE + '/Grupos',
                type: 'GET',
                success: function (data) {
                    gruposCache = Array.isArray(data) ? data : [];
                    renderTablaGrupos(filtro || '');
                    cargarCombosGrupos();
                },
                error: function (xhr) {
                    alert('No se pudieron cargar los grupos.');
                    console.error(xhr);
                }
            });
        }

        function renderTablaGrupos(filtro) {
            const tbody = $('#tablaGrupos tbody');
            tbody.empty();
            const texto = (filtro || '').toLowerCase();
            const rows = gruposCache.filter(function (g) {
                return !texto || String(g.Grupo_Nombre || '').toLowerCase().includes(texto);
            });

            if (!rows.length) {
                tbody.html('<tr><td colspan="3" class="text-center">No hay grupos.</td></tr>');
                return;
            }

            rows.forEach(function (g) {
                const $tr = $('<tr>');
                $tr.append($('<td>').text(g.Grupo_ID));
                $tr.append($('<td>').text(g.Grupo_Nombre || ''));

                const $actions = $('<td>').addClass('text-end');
                $actions.append(
                    $('<button>')
                        .addClass('btn btn-sm btn-primary me-1')
                        .text('Editar')
                        .on('click', function () {
                            abrirEdicionGrupo(g.Grupo_ID, g.Grupo_Nombre);
                        })
                );
                $actions.append(
                    $('<button>')
                        .addClass('btn btn-sm btn-danger')
                        .text('Eliminar')
                        .on('click', function () {
                            eliminarGrupo(g.Grupo_ID);
                        })
                );
                $tr.append($actions);
                tbody.append($tr);
            });
        }

        function cargarCombosGrupos() {
            const selPermisos = $('#selectGrupoPermisos');
            const selUsuarios = $('#selectGrupoUsuarios');
            selPermisos.empty();
            selUsuarios.empty();

            if (!gruposCache.length) {
                selPermisos.append('<option value="">Sin grupos</option>');
                selUsuarios.append('<option value="">Sin grupos</option>');
                $('#contenedorMenusGrupo').html('<div class="text-muted">No hay datos para mostrar.</div>');
                $('#btnGuardarPermisos').prop('disabled', true);
                $('#contenedorUsuariosGrupo').html('<div class="text-muted">No hay datos para mostrar.</div>');
                return;
            }

            gruposCache.forEach(function (g) {
                const opt = '<option value="' + g.Grupo_ID + '">' + escapeHtml(g.Grupo_Nombre) + '</option>';
                selPermisos.append(opt);
                selUsuarios.append(opt);
            });

            cargarMenusDeGrupo(selPermisos.val());
            cargarUsuariosDeGrupo(selUsuarios.val());
        }

        function mensajeErrorApi(xhr) {
            const json = xhr.responseJSON;
            if (!json) return 'No se pudo completar la operación. Revisá la consola.';
            const msg = json.message || json.Message || json.ExceptionMessage;
            if (msg) return msg;
            if (Array.isArray(json.errors) && json.errors.length) return json.errors.join('\n');
            if (json.detail) return json.detail;
            return 'No se pudo completar la operación.';
        }

        function crearGrupo() {
            const nombre = $('#txtNuevoGrupo').val().trim();
            if (!nombre) {
                alert('Ingresá el nombre del grupo.');
                return;
            }

            const usuarioLogueado = localStorage.getItem('username') || '';
            $.ajax({
                url: API_BASE + '/Grupos',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ Grupo_Nombre: nombre, UsuarioLogueado: usuarioLogueado }),
                success: function () {
                    $('#modalGrupoAlta').modal('hide');
                    $('#txtNuevoGrupo').val('');
                    showToast('Grupo creado correctamente.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function (xhr) {
                    let msg = mensajeErrorApi(xhr);
                    if (xhr.status === 0) {
                        msg = 'No se pudo conectar con el servidor. Verificá que la API esté en ejecución.';
                    }
                    alert(msg);
                }
            });
        }

        function abrirEdicionGrupo(id, nombre) {
            $('#grupoEdicionId').val(id);
            $('#txtGrupoEdicion').val(nombre || '');
            $('#modalGrupoEdicion').modal('show');
        }

        function guardarEdicionGrupo() {
            const id = $('#grupoEdicionId').val();
            const nombre = $('#txtGrupoEdicion').val().trim();
            if (!id || !nombre) {
                alert('Completá el nombre del grupo.');
                return;
            }

            $.ajax({
                url: API_BASE + '/Grupos/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ Grupo_Nombre: nombre }),
                success: function () {
                    $('#modalGrupoEdicion').modal('hide');
                    showToast('Grupo actualizado.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function (xhr) {
                    alert(mensajeErrorApi(xhr));
                }
            });
        }

        function eliminarGrupo(id) {
            if (!confirm('¿Eliminar grupo y todas sus asignaciones?')) return;

            $.ajax({
                url: API_BASE + '/Grupos/' + id,
                type: 'DELETE',
                success: function () {
                    showToast('Grupo eliminado.');
                    cargarGrupos($('#txtBuscarGrupo').val());
                },
                error: function () {
                    alert('No se pudo eliminar el grupo.');
                }
            });
        }

        // "Guardar permisos" solo se habilita con la lista de menús cargada: guardar con la
        // lista vacía (por ejemplo, si falló la carga) le borraría todos los permisos al grupo.
        function cargarMenusDeGrupo(grupoId) {
            $('#btnGuardarPermisos').prop('disabled', true);
            if (!grupoId) return;

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Menus',
                type: 'GET',
                success: function (data) {
                    if (String($('#selectGrupoPermisos').val()) !== String(grupoId)) return;
                    const cont = $('#contenedorMenusGrupo');
                    cont.empty();
                    if (!data || !data.length) {
                        cont.html('<div class="text-muted">No hay menús disponibles.</div>');
                        return;
                    }

                    const gruposMenu = agruparMenusPorPrincipal(data);
                    let html = '<div class="row g-3">';
                    gruposMenu.forEach(function (grupo, indice) {
                        const estado = obtenerEstadoMenuPrincipal(grupo.Permisos);
                        const grupoId = 'grupo_menu_' + indice;
                        html += `
                            <div class="col-12 col-md-6 col-xl-4">
                                <div class="card border h-100 grupo-permisos" data-grupo-permisos="${grupoId}">
                                    <div class="card-header bg-light py-2">
                                        <div class="form-check mb-0">
                                            <input class="form-check-input chk-menu-principal" type="checkbox" id="${grupoId}" ${estado.checked ? 'checked' : ''}>
                                            <label class="form-check-label" for="${grupoId}"><strong>${escapeHtml(grupo.Nombre)}</strong></label>
                                        </div>
                                    </div>
                                    <div class="card-body py-2">`;
                        grupo.Permisos.forEach(function (item) {
                            html += `
                                <div class="form-check ms-3 mb-2">
                                    <input class="form-check-input chk-menu" type="checkbox" value="${item.Menu_ID}" id="menu_${item.Menu_ID}" ${item.Asignado ? 'checked' : ''}>
                                    <label class="form-check-label" for="menu_${item.Menu_ID}">${escapeHtml(item.Menu_Nombre)}</label>
                                </div>`;
                        });
                        html += '</div></div></div>';
                    });
                    html += '</div>';
                    cont.html(html);
                    vincularSeleccionMenusPrincipales(cont);
                    actualizarEstadosMenusPrincipales(cont);
                    $('#btnGuardarPermisos').prop('disabled', false);
                },
                error: function () {
                    if (String($('#selectGrupoPermisos').val()) !== String(grupoId)) return;
                    $('#contenedorMenusGrupo').html('<div class="text-danger">Error al cargar permisos. No se pueden guardar cambios hasta que se carguen.</div>');
                }
            });
        }

        function agruparMenusPorPrincipal(menus) {
            const orden = ['General', 'Choferes', 'Camiones', 'Viajes', 'Clientes', 'Facturación', 'Configuración', 'Usuarios'];
            const grupos = [];

            (menus || []).forEach(function (menu) {
                const nombre = String(menu.Menu_Principal || 'General').trim() || 'General';
                let grupo = grupos.filter(function (item) { return item.Nombre === nombre; })[0];
                if (!grupo) {
                    grupo = { Nombre: nombre, Permisos: [] };
                    grupos.push(grupo);
                }
                grupo.Permisos.push(menu);
            });

            return grupos.sort(function (a, b) {
                const indiceA = orden.indexOf(a.Nombre);
                const indiceB = orden.indexOf(b.Nombre);
                const posicionA = indiceA === -1 ? orden.length : indiceA;
                const posicionB = indiceB === -1 ? orden.length : indiceB;
                return posicionA === posicionB ? a.Nombre.localeCompare(b.Nombre) : posicionA - posicionB;
            });
        }

        function obtenerEstadoMenuPrincipal(permisos) {
            const total = (permisos || []).length;
            const seleccionados = (permisos || []).filter(function (permiso) {
                return permiso.Asignado === true;
            }).length;

            return {
                checked: total > 0 && seleccionados === total,
                indeterminate: seleccionados > 0 && seleccionados < total
            };
        }

        function actualizarEstadoMenuPrincipal($grupo) {
            const permisos = [];
            $grupo.find('.chk-menu').each(function () {
                permisos.push({ Asignado: $(this).prop('checked') === true });
            });

            const estado = obtenerEstadoMenuPrincipal(permisos);
            $grupo.find('.chk-menu-principal')
                .prop('checked', estado.checked)
                .prop('indeterminate', estado.indeterminate);
        }

        function actualizarEstadosMenusPrincipales(contenedor) {
            contenedor.find('.grupo-permisos').each(function () {
                actualizarEstadoMenuPrincipal($(this));
            });
        }

        function vincularSeleccionMenusPrincipales(contenedor) {
            contenedor
                .off('change.permisosGrupo', '.chk-menu-principal')
                .on('change.permisosGrupo', '.chk-menu-principal', function () {
                    const $grupo = $(this).closest('.grupo-permisos');
                    $grupo.find('.chk-menu').prop('checked', this.checked);
                    actualizarEstadoMenuPrincipal($grupo);
                })
                .off('change.permisosGrupo', '.chk-menu')
                .on('change.permisosGrupo', '.chk-menu', function () {
                    actualizarEstadoMenuPrincipal($(this).closest('.grupo-permisos'));
                });
        }

        function guardarMenusDeGrupo() {
            const grupoId = $('#selectGrupoPermisos').val();
            if (!grupoId) {
                alert('Seleccioná un grupo.');
                return;
            }
            if (!$('.chk-menu').length) {
                alert('No se cargaron los permisos del grupo, no se puede guardar.');
                return;
            }

            const ids = $('.chk-menu:checked').map(function () {
                return parseInt($(this).val(), 10);
            }).get();

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Menus',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ MenuIds: ids }),
                success: function () { showToast('Permisos guardados.'); },
                error: function () { alert('No se pudieron guardar los permisos.'); }
            });
        }

        function cargarUsuariosDeGrupo(grupoId) {
            const cont = $('#contenedorUsuariosGrupo');
            $('#btnGuardarUsuariosGrupo').prop('disabled', true);
            grupoUsuariosCargadoId = null;
            usuariosGrupoCache = [];
            usuariosSeleccionadosGrupo = new Set();

            if (!grupoId) {
                cont.html('<div class="text-muted">Seleccioná un grupo para ver sus usuarios.</div>');
                return;
            }

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Usuarios',
                type: 'GET',
                success: function (data) {
                    if (String($('#selectGrupoUsuarios').val()) !== String(grupoId)) return;
                    cont.empty();
                    grupoUsuariosCargadoId = String(grupoId);
                    usuariosGrupoCache = Array.isArray(data) ? data : [];
                    usuariosSeleccionadosGrupo = new Set();

                    if (!data || !data.length) {
                        cont.html('<div class="text-muted">No hay usuarios disponibles.</div>');
                        $('#btnGuardarUsuariosGrupo').prop('disabled', false);
                        return;
                    }

                    cont.html(
                        '<div class="alert alert-info py-2 small mb-3"><i class="bi bi-info-circle me-1"></i>' +
                        'Los usuarios con rol <strong>admin</strong> tienen acceso total por su rol y no requieren pertenecer a un grupo.</div>' +
                        '<div class="mb-2">' +
                        '<label class="form-label" for="txtBuscarUsuarioGrupo">Buscar usuario</label>' +
                        '<div class="input-group">' +
                        '<span class="input-group-text"><i class="bi bi-search"></i></span>' +
                        '<input type="search" class="form-control" id="txtBuscarUsuarioGrupo" placeholder="Buscá por usuario, nombre o apellido" autocomplete="off">' +
                        '</div>' +
                        '<div id="resumenUsuariosGrupo" class="form-text"></div>' +
                        '</div>' +
                        '<div id="listaUsuariosGrupo" class="lista-usuarios-grupo border rounded" role="list"></div>'
                    );
                    renderizarUsuariosGrupo('');
                    vincularListaUsuariosGrupo(cont);
                    $('#btnGuardarUsuariosGrupo').prop('disabled', false);
                },
                error: function () {
                    if (String($('#selectGrupoUsuarios').val()) !== String(grupoId)) return;
                    $('#contenedorUsuariosGrupo').html('<div class="text-danger">Error al cargar usuarios del grupo.</div>');
                }
            });
        }

        function esAdministradorUsuarioGrupo(usuario) {
            return usuario.EsAdministrador === true || String(usuario.Rol || '').trim().toLowerCase() === 'admin';
        }

        function normalizarBusquedaUsuariosGrupo(texto) {
            return String(texto || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function filtrarUsuariosGrupo(usuarios, texto) {
            const termino = normalizarBusquedaUsuariosGrupo(texto);
            return (usuarios || []).filter(function (usuario) {
                if (!termino) return true;
                return normalizarBusquedaUsuariosGrupo(usuario.Nombre_Usuario).includes(termino) ||
                    normalizarBusquedaUsuariosGrupo(usuario.NombreCompleto).includes(termino);
            });
        }

        function actualizarSeleccionUsuariosGrupo(seleccionados, usuarioId, seleccionado) {
            const siguiente = new Set(seleccionados || []);
            if (seleccionado) siguiente.add(usuarioId);
            else siguiente.delete(usuarioId);
            return siguiente;
        }

        function crearHtmlListaUsuariosGrupo(usuarios) {
            if (!usuarios.length) {
                return '<div class="text-muted text-center py-3">No hay usuarios que coincidan con la búsqueda.</div>';
            }

            return usuarios.map(function (usuario) {
                const esAdmin = esAdministradorUsuarioGrupo(usuario);
                const asignado = !esAdmin && usuario.Asignado === true;
                const puedeIncorporarse = !esAdmin && !asignado;
                const detalle = esAdmin
                    ? '<span class="badge bg-secondary ms-1">admin</span><span class="texto-rol-admin"> - Acceso total por rol; no requiere grupo.</span>'
                    : (asignado ? '<span class="badge estado-verde ms-1">Asignado</span>' : '');
                const control = puedeIncorporarse
                    ? `<input class="form-check-input chk-usuario lista-usuarios-check" type="checkbox" value="${usuario.Usuario_ID}" id="usr_${usuario.Usuario_ID}" ${usuariosSeleccionadosGrupo.has(usuario.Usuario_ID) ? 'checked' : ''}>`
                    : '<span class="lista-usuarios-control" aria-hidden="true"></span>';
                const etiqueta = puedeIncorporarse
                    ? `<label class="lista-usuarios-etiqueta" for="usr_${usuario.Usuario_ID}">`
                    : `<div class="lista-usuarios-etiqueta ${esAdmin ? 'text-muted' : ''}">`;
                const cierreEtiqueta = puedeIncorporarse ? '</label>' : '</div>';
                return `
                    <div class="lista-usuarios-item border-bottom" role="listitem">
                        ${control}
                        ${etiqueta}
                            <strong>${escapeHtml(usuario.Nombre_Usuario)}</strong> - ${escapeHtml(usuario.NombreCompleto)}
                            ${detalle}
                        ${cierreEtiqueta}
                    </div>`;
            }).join('');
        }

        function actualizarResumenUsuariosGrupo(usuariosVisibles) {
            const total = usuariosGrupoCache.length;
            const seleccionados = usuariosSeleccionadosGrupo.size;
            const asignados = usuariosGrupoCache.filter(function (usuario) {
                return !esAdministradorUsuarioGrupo(usuario) && usuario.Asignado === true;
            }).length;
            $('#resumenUsuariosGrupo').text(
                'Mostrando ' + usuariosVisibles.length + ' de ' + total + ' usuarios. ' +
                asignados + (asignados === 1 ? ' asignado. ' : ' asignados. ') +
                seleccionados + (seleccionados === 1 ? ' por incorporar.' : ' por incorporar.')
            );
        }

        function renderizarUsuariosGrupo(texto) {
            const usuariosVisibles = filtrarUsuariosGrupo(usuariosGrupoCache, texto);
            $('#listaUsuariosGrupo').html(crearHtmlListaUsuariosGrupo(usuariosVisibles));
            actualizarResumenUsuariosGrupo(usuariosVisibles);
        }

        function vincularListaUsuariosGrupo(contenedor) {
            contenedor
                .off('input.usuariosGrupo', '#txtBuscarUsuarioGrupo')
                .on('input.usuariosGrupo', '#txtBuscarUsuarioGrupo', function () {
                    renderizarUsuariosGrupo($(this).val());
                })
                .off('change.usuariosGrupo', '.chk-usuario')
                .on('change.usuariosGrupo', '.chk-usuario', function () {
                    const usuarioId = parseInt($(this).val(), 10);
                    usuariosSeleccionadosGrupo = actualizarSeleccionUsuariosGrupo(
                        usuariosSeleccionadosGrupo,
                        usuarioId,
                        $(this).prop('checked') === true
                    );
                    actualizarResumenUsuariosGrupo(filtrarUsuariosGrupo(
                        usuariosGrupoCache,
                        $('#txtBuscarUsuarioGrupo').val()
                    ));
                });
        }

        function marcarUsuariosAgregadosGrupo(usuarioIds) {
            const idsAgregados = new Set(usuarioIds || []);
            usuariosGrupoCache = usuariosGrupoCache.map(function (usuario) {
                return idsAgregados.has(usuario.Usuario_ID)
                    ? Object.assign({}, usuario, { Asignado: true })
                    : usuario;
            });
        }

        function mostrarUsuariosGrupoGuardados(cantidad) {
            const nombreGrupo = $('#selectGrupoUsuarios option:selected').text();
            const detalleGrupo = nombreGrupo ? ' al grupo ' + nombreGrupo : '';
            $('#mensajeUsuariosGrupoGuardados').text(
                'Se agreg' + (cantidad === 1 ? 'ó ' : 'aron ') + cantidad +
                (cantidad === 1 ? ' usuario' : ' usuarios') + detalleGrupo + '.'
            );
            $('#modalUsuariosGrupoGuardados').modal('show');
        }

        function guardarUsuariosDeGrupo() {
            const grupoId = $('#selectGrupoUsuarios').val();
            if (!grupoId) {
                alert('Seleccioná un grupo.');
                return;
            }

            if (grupoUsuariosCargadoId !== String(grupoId)) {
                alert('Esperá a que se carguen los usuarios del grupo antes de guardar.');
                return;
            }

            const ids = Array.from(usuariosSeleccionadosGrupo);
            if (!ids.length) {
                alert('Seleccioná al menos un usuario para incorporar al grupo.');
                return;
            }

            $.ajax({
                url: API_BASE + '/Grupos/' + grupoId + '/Usuarios',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ UsuarioIds: ids }),
                success: function () {
                    if (grupoUsuariosCargadoId !== String(grupoId)) return;
                    marcarUsuariosAgregadosGrupo(ids);
                    usuariosSeleccionadosGrupo = new Set();
                    renderizarUsuariosGrupo($('#txtBuscarUsuarioGrupo').val());
                    mostrarUsuariosGrupoGuardados(ids.length);
                },
                error: function () { alert('No se pudo guardar la asignación de usuarios.'); }
            });
        }

        $(document).ready(function () {
            $('#btnBuscarGrupo').on('click', function () {
                renderTablaGrupos($('#txtBuscarGrupo').val());
            });

            $('#txtBuscarGrupo').on('keypress', function (e) {
                if (e.which === 13) {
                    e.preventDefault();
                    renderTablaGrupos($('#txtBuscarGrupo').val());
                }
            });

            $('#btnConfirmarAltaGrupo').on('click', crearGrupo);
            $('#btnConfirmarEdicionGrupo').on('click', guardarEdicionGrupo);
            $('#selectGrupoPermisos').on('change', function () { cargarMenusDeGrupo($(this).val()); });
            $('#selectGrupoUsuarios').on('change', function () { cargarUsuariosDeGrupo($(this).val()); });
            $('#btnGuardarPermisos').on('click', guardarMenusDeGrupo);
            $('#btnGuardarUsuariosGrupo').on('click', guardarUsuariosDeGrupo);

            cargarGrupos('');
        });
    </script>

</body>

</html>
