<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGTL · Sistema de Gestión de Transporte y Logística</title>
    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">
    <!-- Estilos reutilizados -->
    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">

    <style>
        /* Estilos personalizados */
        .left-section {
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #c7e4e4; /* Color de fondo por defecto */
        }

        .left-section img {
            max-width: 200px;
        }

        .left-section h1 {
            margin-top: 20px;
            font-size: 2.5rem;
        }

        .right-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Fondo blanco para la sección derecha */
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .input-group-text {
            cursor: pointer;
        }

        .loading-spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            display: none;
        }
    </style>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <!-- Sección izquierda -->
            <div class="col-lg-6 left-section d-none d-lg-flex">
                <span class="login-orbit login-orbit-top" aria-hidden="true"></span>
                <span class="login-orbit login-orbit-bottom" aria-hidden="true"></span>
                <span class="login-orbit login-orbit-bottom-inner" aria-hidden="true"></span>
                <div class="brand-lockup text-center">
                    <div class="brand-logo-frame">
                        <img id="logoIzquierdo" src="./assets/static/images/logo/sgtl-logo.png" alt="Logo de SGTL">
                    </div>
                </div>
            </div>

            <!-- Sección derecha -->
            <div class="col-lg-6 right-section">
                <div class="login-card card">
                    <div class="login-card-brand text-center">
                        <img id="logoDerecho" src="./assets/static/images/logo/sgtl-logo.png" alt="Logo de SGTL">
                        <span id="versionSistema" class="login-card-version" aria-label="Versión del sistema" hidden></span>
                    </div>
                    <h5 class="text-center mb-4">Iniciar sesión</h5>
                    <p class="login-subtitle text-center">Ingresá tus credenciales para continuar.</p>
                    <!-- Formulario -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Ingresá tu usuario">
                            </div>
                            <small id="userError" class="error-message"></small>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Ingresá tu contraseña">
                                <button type="button" class="input-group-text" id="togglePassword"
                                    aria-label="Mantener presionado para ver la contraseña">
                                    <i class="bi bi-eye" id="eyeIcon" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small id="passError" class="error-message"></small>
                        </div>

                        <small id="generalError" class="error-message text-center mb-3 d-block" style="display: none;"></small>

                        <div class="d-grid login-submit">
                            <button type="submit" class="btn btn-primary" id="btnEntrar">Entrar</button>
                        </div>
                    </form>

                    <!-- Loading Spinner -->
                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando…</span>
                        </div>
                    </div>

                    <div class="text-center mt-4" id="footerContent">
                        <small>SGTL | un producto de Integra Analistas ®</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Avisos del sistema (§5.1): no dependen de Bootstrap. -->
    <script src="assets/static/js/sgtl-ui.js"></script>

    <script>
        // La contraseña solo se muestra mientras se mantiene presionado el ojo.
        (function () {
            const boton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            function mostrarPassword() {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            }

            function ocultarPassword() {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }

            boton.addEventListener('pointerdown', function (evento) {
                if (evento.button === 0) mostrarPassword();
            });
            boton.addEventListener('pointerleave', ocultarPassword);
            boton.addEventListener('blur', ocultarPassword);
            window.addEventListener('pointerup', ocultarPassword);
            window.addEventListener('pointercancel', ocultarPassword);
            window.addEventListener('blur', ocultarPassword);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) ocultarPassword();
            });

            boton.addEventListener('keydown', function (evento) {
                if (evento.key !== ' ' && evento.key !== 'Enter') return;
                evento.preventDefault();
                mostrarPassword();
            });
            boton.addEventListener('keyup', function (evento) {
                if (evento.key !== ' ' && evento.key !== 'Enter') return;
                evento.preventDefault();
                ocultarPassword();
            });
        })();

        // Mostrar u ocultar el spinner de carga
        function showLoadingSpinner(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }

        // Cargar contenido de la API GestionContenido usando XHR
        function loadContent() {
            showLoadingSpinner(true);

            const xhr = new XMLHttpRequest();
            xhr.open("GET", "http://localhost:50222/api/GestionContenido/1", true);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {  // La solicitud ha terminado
                    if (xhr.status === 200) {  // Estado exitoso
                        try {
                            const data = JSON.parse(xhr.responseText);
                            console.log("Respuesta completa de GestionContenido:", data);

                            // Verificar si la respuesta es un objeto o un array
                            let content;
                            if (Array.isArray(data) && data.length > 0) {
                                content = data[0];
                            } else if (typeof data === 'object') {
                                content = data;
                            } else {
                                console.error("Formato de respuesta inesperado:", data);
                                throw new Error("Formato de respuesta inesperado");
                            }

                            console.log("Contenido recibido:", content);

                            // Asignar Logo tanto al logo izquierdo como al derecho
                            if (content.Logo) {
                                document.getElementById('logoIzquierdo').src = content.Logo;
                                document.getElementById('logoDerecho').src = content.Logo;
                                console.log("Logo asignado:", content.Logo);
                            } else {
                                console.warn("Logo no está disponible.");
                                document.getElementById('logoIzquierdo').src = './assets/static/images/logo/sgtl-logo.png';
                                document.getElementById('logoDerecho').src = './assets/static/images/logo/sgtl-logo.png';
                            }

                            // Asignar ColorFondo si existe
                            if (content.ColorFondo) {
                                document.documentElement.style.setProperty('--login-brand-color', content.ColorFondo);
                                console.log("ColorFondo asignado:", content.ColorFondo);
                            } else {
                                console.warn("ColorFondo no está disponible.");
                            }

                            // Asignar ContenidoPiePagina si existe
                            if (content.ColorBotonesMenu) {
                                document.documentElement.style.setProperty('--login-accent-color', content.ColorBotonesMenu);
                                document.documentElement.style.setProperty('--login-accent-hover', content.ColorBotonesMenu);
                            }

                            if (content.ContenidoPiePagina) {
                                document.getElementById('footerContent').innerHTML = content.ContenidoPiePagina;
                                console.log("ContenidoPiePagina asignado:", content.ContenidoPiePagina);
                            } else {
                                console.warn("ContenidoPiePagina no está disponible.");
                            }
                        } catch (e) {
                            console.error("Error al parsear la respuesta JSON:", e);
                        }
                    } else {
                        console.error("Error al cargar el contenido. Estado HTTP:", xhr.status);
                    }
                    showLoadingSpinner(false);
                }
            };

            xhr.onerror = function () {
                console.error("Error de red al intentar conectar con la API GestionContenido.");
                mostrarToastError(SIN_CONEXION);
                showLoadingSpinner(false);
            };

            xhr.send();
        }

        var SIN_CONEXION = 'No se pudo conectar con el servidor. Revisá la conexión y probá de nuevo.';

        // Aviso de error del sistema (§5.1): arriba a la derecha, queda hasta cerrarlo.
        function mostrarToastError(texto) {
            SGTL.toastError(texto || 'No se pudo iniciar sesión. Probá de nuevo.');
        }

        // Error de un campo: borde rojo y el mensaje debajo (§6.3).
        function marcarCampo(id, idMensaje, texto) {
            document.getElementById(id).classList.toggle('is-invalid', !!texto);
            document.getElementById(idMensaje).textContent = texto || '';
            document.getElementById(idMensaje).style.display = texto ? 'block' : 'none';
        }

        // La pantalla que se pidió antes de iniciar sesión (Login.html?volver=hoja-de-ruta.html%3Fviaje%3D48, la arma
        // sidebar-loader.js): solo una pantalla del sistema, nunca otra dirección.
        function pantallaDeVuelta() {
            var volver = new URLSearchParams(window.location.search).get('volver') || '';
            return /^[a-z0-9-]+\.html(\?[a-z0-9=&_.%-]*)?$/i.test(volver) && !/^login\.html/i.test(volver) ? volver : '';
        }

        // Después de entrar: a la pantalla pedida o al Dashboard. Un chofer (su grupo tiene la Hoja de ruta y no el
        // Dashboard) entra directo a su hoja de ruta. Si no se pueden leer los permisos, al Dashboard, como siempre.
        // Si su única pantalla es la Hoja de ruta, queda marcado para que el menú arranque plegado (sidebar-loader.js).
        function irDespuesDeEntrar(nombreUsuario, rol) {
            var volver = pantallaDeVuelta();
            try { localStorage.removeItem('sgtlSoloHojaDeRuta'); } catch (e) { }
            if (String(rol || '').trim().toLowerCase() === 'admin') { window.location.href = volver || 'index.html'; return; }
            fetch('http://localhost:50222/api/Usuarios/MenusPermitidos?username=' + encodeURIComponent(nombreUsuario || ''))
                .then(function (respuesta) { return respuesta.ok ? respuesta.json() : null; })
                .then(function (datos) {
                    var menus = ((datos && datos.Menus) || []).map(function (m) {
                        return String(m || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
                    });
                    var chofer = menus.indexOf('hoja de ruta') !== -1 && menus.indexOf('dashboard') === -1;
                    var soloHojaDeRuta = menus.length > 0 && menus.every(function (m) { return m === 'hoja de ruta'; });
                    try { if (soloHojaDeRuta) localStorage.setItem('sgtlSoloHojaDeRuta', '1'); } catch (e) { }
                    window.location.href = volver || (chofer ? 'hoja-de-ruta.html' : 'index.html');
                })
                .catch(function () { window.location.href = volver || 'index.html'; });
        }

        // Llamada a la API al cargar la página
        window.onload = loadContent;

        // La versión se consulta sin sesión y no interfiere con el inicio de sesión.
        fetch('http://localhost:50222/api/Documentacion/version-actual', { cache: 'no-store' })
            .then(function (respuesta) {
                if (!respuesta.ok) return null;
                return respuesta.json();
            })
            .then(function (datos) {
                if (!datos || typeof datos.version !== 'string') return;
                const numero = datos.version.trim();
                if (!numero) return;
                const version = document.getElementById('versionSistema');
                version.textContent = /^v/i.test(numero) ? numero : 'V' + numero;
                version.hidden = false;
            })
            .catch(function () { /* El login funciona aunque no se pueda consultar la versión. */ });

        // Gestión del formulario de login
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            // Obtener los valores ingresados
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Limpiar mensajes de error previos
            marcarCampo('username', 'userError', '');
            marcarCampo('password', 'passError', '');
            document.getElementById('generalError').style.display = 'none';
            document.getElementById('generalError').textContent = '';

            if (username && password) {
                const listo = SGTL.procesando('#btnEntrar', 'Entrando…');

                const xhrLogin = new XMLHttpRequest();
                xhrLogin.open("POST", "http://localhost:50222/api/login", true);
                xhrLogin.setRequestHeader("Content-Type", "application/json");

                xhrLogin.onreadystatechange = function () {
                    if (xhrLogin.readyState === 4) {  // La solicitud ha terminado
                        listo();
                        if (xhrLogin.status === 200) {  // Estado exitoso
                            try {
                                const data = JSON.parse(xhrLogin.responseText);
                                // Guardar token, rol, usuario, nombre y apellido en localStorage
                                localStorage.setItem('token', data.Token);
                                localStorage.setItem('username', data.Nombre_Usuario);
                                localStorage.setItem('userRole', data.Rol);
                                localStorage.setItem('nombre', data.Nombre);
                                localStorage.setItem('apellido', data.Apellido);

                                irDespuesDeEntrar(data.Nombre_Usuario, data.Rol);
                            } catch (e) {
                                console.error("Error al parsear la respuesta JSON de login:", e);
                                mostrarToastError();
                            }
                        } else if (xhrLogin.status === 401) {  // Credenciales inválidas
                            document.getElementById('generalError').textContent = 'Usuario o contraseña incorrectos.';
                            document.getElementById('generalError').style.display = 'block';
                        } else {  // Otros errores
                            console.error("Error al iniciar sesión. Estado HTTP:", xhrLogin.status);
                            mostrarToastError();
                        }
                    }
                };

                xhrLogin.onerror = function () {
                    console.error("Error de red al intentar conectar con la API de login.");
                    mostrarToastError(SIN_CONEXION);
                };

                const requestBody = JSON.stringify({
                    Nombre_Usuario: username,
                    Contraseña: password
                });

                xhrLogin.send(requestBody);
            } else {
                // Mostrar mensajes de error si los campos están vacíos
                if (!username) marcarCampo('username', 'userError', 'Completá el usuario.');
                if (!password) marcarCampo('password', 'passError', 'Completá la contraseña.');
                document.getElementById(!username ? 'username' : 'password').focus();
            }
        });
    </script>

</body>

</html>
