<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transporte Sanchez - Sistema de gestión de viajes</title>

    <style>
        #app {
            display: none;
        }

        #loading-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        /* Asegura que la tabla se extienda completamente */
        .table-responsive {
            width: 100%;
        }

        #tablaViajes {
            width: 100%;
            text-align: center;
        }

        #tablaViajes th,
        #tablaViajes td {
            text-align: center;
            vertical-align: middle;
        }

        /* Ajusta el ancho de las columnas para que ocupen el mismo espacio */
        #tablaViajes th {
            width: auto;
            white-space: nowrap;
        }

        /* Centrar la paginación */
        .pagination {
            justify-content: center;
        }

        #origenSelect:disabled,
        #destinoSelect:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            opacity: 0.85;
        }

        #tablaTarifaFijaModal th,
        #tablaTarifaFijaModal td {
            text-align: center;
            vertical-align: middle;
        }

        #tablaTarifaFijaModal {
            width: 100%;
        }

        #tablaTarifaFijaModal thead th {
            font-weight: 600;
        }

        /* Mapa ruta (Google Maps) en modal */
        #mapaRutaViaje {
            height: 240px;
            width: 100%;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
            background: #f8f9fa;
        }

        @media (min-width: 992px) {
            #mapaRutaViaje {
                height: 260px;
            }
        }

        #mapaRutaViajeEstado {
            font-size: 0.9375rem;
            line-height: 1.45;
            color: #374151;
        }

        #mapaRutaViajeWrap .form-label.small {
            font-size: 0.9rem;
            font-weight: 600;
            color: #212529;
        }

        #mapaRutaViajeTitulo {
            line-height: 1.35;
        }

        #wrapChoferViajeBusqueda {
            position: relative;
        }

        #choferViajeResultados {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 1060;
            max-height: 240px;
            overflow-y: auto;
        }

        /* Tarifa por km: inputs + botón en una fila; error solo bajo «Monto calculado» (columna 3) */
        #bloqueTarifaKm .tarifa-km-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            column-gap: 0.5rem;
            row-gap: 0.25rem;
            align-items: end;
        }

        #bloqueTarifaKm .tk-l-km {
            grid-column: 1;
            grid-row: 1;
            align-self: start;
            margin-bottom: 0;
        }

        #bloqueTarifaKm .tk-spacer-label {
            grid-column: 2;
            grid-row: 1;
            min-height: 1.5rem;
        }

        #bloqueTarifaKm .tk-l-m {
            grid-column: 3;
            grid-row: 1;
            align-self: start;
            margin-bottom: 0;
        }

        #bloqueTarifaKm .tk-i-km {
            grid-column: 1;
            grid-row: 2;
        }

        #bloqueTarifaKm .tk-btn {
            grid-column: 2;
            grid-row: 2;
        }

        #bloqueTarifaKm .tk-i-m {
            grid-column: 3;
            grid-row: 2;
        }

        #bloqueTarifaKm .tk-err {
            grid-column: 3;
            grid-row: 3;
            align-self: start;
            min-height: 0;
        }

        @media (max-width: 767.98px) {
            #bloqueTarifaKm .tarifa-km-grid {
                grid-template-columns: 1fr;
            }

            #bloqueTarifaKm .tk-spacer-label {
                display: none;
            }

            #bloqueTarifaKm .tk-l-km {
                grid-column: 1;
                grid-row: 1;
            }

            #bloqueTarifaKm .tk-i-km {
                grid-column: 1;
                grid-row: 2;
            }

            #bloqueTarifaKm .tk-btn {
                grid-column: 1;
                grid-row: 3;
                justify-self: start;
            }

            #bloqueTarifaKm .tk-l-m {
                grid-column: 1;
                grid-row: 4;
            }

            #bloqueTarifaKm .tk-i-m {
                grid-column: 1;
                grid-row: 5;
            }

            #bloqueTarifaKm .tk-err {
                grid-column: 1;
                grid-row: 6;
            }
        }
    </style>

<body>
    <script src="assets/static/js/initTheme.js"></script>

    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <!--Header-->
            <header>

                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>

                        <!--btn para expandir Menú lateral-->

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <!--Llamado a las opciones del header-->

                        <div id="header-container"></div>

                        <script src="./assets/static/js/header.js"></script>

                    </div>
                </nav>
            </header>

            <div class="page-heading">

                <!--Comienzo sección de la tabla-->
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">
                        <div class="card-header">

                            <!--Notificaciones de Alta, Editar y Eliminar-->

                            <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
                                <div class="toast align-items-center text-white bg-success border-0" role="alert"
                                    id="alert-success" aria-live="assertive" aria-atomic="true" style="display: none;">
                                    <div class="d-flex">
                                        <div class="toast-body">
                                        </div>
                                        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                            data-bs-dismiss="toast" aria-label="Close"></button>
                                    </div>
                                </div>
                                <div id="toastError" class="toast align-items-center text-white bg-danger border-0 mt-2"
                                    role="alert" aria-live="assertive" aria-atomic="true">
                                    <div class="d-flex">
                                        <div id="toastErrorMessage" class="toast-body"></div>
                                        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                            data-bs-dismiss="toast" aria-label="Close"></button>
                                    </div>
                                </div>
                            </div>


                            <h5 class="card-title">
                                Gestionar viajes
                            </h5>
                        </div>

                        <div class="card-body">
                            <div class="row">
                                <!-- Columna izquierda - Filtros -->
                                <div class="col-md-6">
                                    <fieldset class="border p-4">
                                        <form id="busquedaViajeForm" class="form">
                                            <!-- Fila 1 -->
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label for="idviajeinput">Número de viaje</label>
                                                    <input type="number" class="form-control" id="idviajeinput"
                                                        placeholder="123">
                                                </div>
                                                <div class="col-md-6">
                                                    <label for="fechaRangoInicioViaje">Fecha de inicio</label>
                                                    <input type="text" class="form-control" id="fechaRangoInicioViaje"
                                                        placeholder="Desde y hasta">
                                                </div>
                                            </div>
                                            <!-- Fila 2 -->
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label for="fechaRangoFinViaje">Fecha de fin</label>
                                                    <input type="text" class="form-control" id="fechaRangoFinViaje"
                                                        placeholder="Desde y hasta">
                                                </div>
                                                <div class="col-md-6 d-flex justify-content-end align-items-end">
                                                    <button type="button" class="btn btn-light"
                                                        onclick="buscarViajes()">Buscar</button>
                                                </div>
                                            </div>
                                        </form>
                                    </fieldset>
                                </div>

                                <!-- Columna derecha - Alta y reporte -->
                                <div class="col-md-6 text-end">
                                    <button type="button" class="btn btn-success" onclick="abrirModalAltaViaje()"
                                        data-bs-toggle="tooltip" data-bs-placement="top" title="Registrar viaje">
                                        <i class="bi bi-calendar-check"></i>
                                        <i class="bi bi-plus"></i>
                                    </button>
                                    <label>&nbsp;</label>
                                    <button type="button" class="btn btn-secondary" onclick="generarReporteCSV()"
                                        data-bs-toggle="tooltip" data-bs-placement="top" title="Generar reporte">
                                        <i class="bi bi-download"></i>
                                    </button>
                                </div>

                                <!-- Tabla de resultados -->
                                <div class="table-responsive mt-4">
                                    <table class="table table-striped" id="tablaViajes">
                                        <thead>
                                            <tr>
                                                <th>Número de viaje</th>
                                                <th>Fecha de inicio</th>
                                                <th>Fecha de fin</th>
                                                <th>Origen</th>
                                                <th>Destino</th>
                                                <th>Número de remito</th>
                                                <th>Cantidad de KM</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Contenido dinámico -->
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Paginación -->
                                <nav>
                                    <ul class="pagination justify-content-end" id="pagination">
                                    </ul>
                                </nav>
                            </div>
                        </div>

                    </div>
                </section>
            </div>

            <!--Fin sección de la tabla-->

            <!--Footer-->

            <footer>
                <div id="footer-container"></div>
                <script src="./assets/static/js/footer.js"></script>
            </footer>
        </div>

    </div>


    <!-- Alta Modal -->
    <div class="modal fade text-left" id="ModalAltaViaje" tabindex="-1" role="dialog"
        aria-labelledby="ModalAltaViajelabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="ModalAltaViajelabel">Registrar viaje</h4>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <i data-feather="x"></i>
                    </button>
                </div>
                <div class="modal-body mt-2 mb-4 mx-2">
                    <div id="alertaCompletaCampos" class="alert alert-light-danger color-danger" style="display: none;"
                        role="alert"></div>
                    <form class="form" id="FormAltaViaje">
                        <div class="row mb-3">
                            <div class="col-12 col-lg-5">
                                <label for="clienteSelect" class="form-label fw-bold">Cliente <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" id="clienteSelect" name="cliente">
                                    <option value="">Seleccione un cliente</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3 g-3 align-items-stretch">
                            <div class="col-lg-5">
                                <div class="mb-3">
                                    <label for="origenSelect" class="form-label fw-bold">Origen <span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" id="origenSelect" name="origen" disabled>
                                        <option value="">Primero seleccione un cliente</option>
                                    </select>
                                </div>
                                <div class="mt-4">
                                    <label for="destinoSelect" class="form-label fw-bold">Destino <span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" id="destinoSelect" name="destino" disabled>
                                        <option value="">Primero seleccione un cliente</option>
                                    </select>
                                </div>
                                <div class="mt-4">
                                    <label for="fechaInicioViaje" class="form-label fw-bold">Fecha y hora de inicio
                                        <span class="text-danger">*</span></label>
                                    <input type="datetime-local" class="form-control" id="fechaInicioViaje"
                                        name="fechaInicioViaje">
                                </div>
                                <div class="mt-3">
                                    <label for="fechaFinViaje" class="form-label fw-bold">Fecha y hora de fin <span
                                            class="text-danger">*</span></label>
                                    <input type="datetime-local" class="form-control" id="fechaFinViaje"
                                        name="fechaFinViaje">
                                </div>
                            </div>
                            <div class="col-lg-7">
                                <div id="mapaRutaViajeWrap" style="display: none;">
                                    <label id="mapaRutaViajeTitulo" class="form-label small mb-1 text-break"
                                        for="mapaRutaViaje">Ruta de Google Maps</label>
                                    <div id="mapaRutaViaje" role="presentation"></div>
                                    <p id="mapaRutaViajeEstado" class="mb-0 mt-2"></p>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label d-block fw-bold">Tipo de tarifa <span
                                        class="text-danger">*</span></label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tarifaTipo" id="tarifaTipoFija"
                                        value="fija" checked>
                                    <label class="form-check-label" for="tarifaTipoFija">Tarifa fija</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tarifaTipo" id="tarifaTipoKm"
                                        value="km">
                                    <label class="form-check-label" for="tarifaTipoKm">Tarifa por km</label>
                                </div>
                            </div>
                        </div>
                        <div id="tarifaRutaPendiente" class="mb-3">
                            <p class="text-muted mb-0 small">Completá cliente, origen y destino para cargar o calcular
                                la
                                tarifa.</p>
                        </div>
                        <div id="tarifaDetalleActivo" class="mb-0" style="display: none;">
                            <div id="bloqueTarifaFija" class="mb-3">
                                <label class="form-label">Valores de tarifa fija</label>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped table-sm mb-0"
                                        id="tablaTarifaFijaModal">
                                        <thead class="table-secondary">
                                            <tr>
                                                <th>Valor ruta</th>
                                                <th>Valor vuelta vacío</th>
                                                <th>Valor fijo neto</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr id="filaTarifaFijaDatos">
                                                <td id="celValorRuta">—</td>
                                                <td id="celValorVueltaVacio">—</td>
                                                <td id="celValorFijoNeto">—</td>
                                            </tr>
                                            <tr id="filaTarifaFijaMensajeFull" style="display: none;">
                                                <td colspan="3" class="text-secondary py-3"
                                                    id="celTarifaFijaMensajeFull"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div id="bloqueTarifaKm" class="mb-3" style="display: none;">
                                <div class="tarifa-km-grid">
                                    <label for="kmViajeInput" class="form-label fw-bold tk-l-km">Kilómetros del
                                        viaje</label>
                                    <span class="tk-spacer-label" aria-hidden="true"></span>
                                    <label for="montoCalculadoKm" class="form-label fw-bold tk-l-m">Monto
                                        calculado</label>
                                    <input type="text" class="form-control tk-i-km" id="kmViajeInput" name="kmViaje"
                                        inputmode="decimal" autocomplete="off" placeholder="Definí la ruta en el mapa"
                                        readonly>
                                    <button type="button" class="btn btn-outline-primary tk-btn"
                                        id="btnCalcularMontoKm">
                                        Calcular

            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadHeader();
            window.loadFooter();

                await loadSettings();  // o tu equivalente que llame applyStyles

                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

        const pageSize = 6;
        let currentPage = 1;

        // Datepicker para el filtro de fecha de inicio de viaje
        $('#fechaRangoInicioViaje').daterangepicker({
            autoUpdateInput: false,
            locale: {

                    'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                ]
            }
        });

        $('#fechaRangoInicioViaje').on('apply.daterangepicker', function (ev, picker) {
            $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
            $(this).data('start', picker.startDate.format('YYYY-MM-DD'));
            $(this).data('end', picker.endDate.format('YYYY-MM-DD'));

        $('#fechaRangoInicioViaje').on('cancel.daterangepicker input', function () {
            $(this).val('');
            $(this).removeData('start').removeData('end');
            buscarViajes(currentPage);
        });

        // Datepicker para el filtro de fecha de fin de viaje
        $('#fechaRangoFinViaje').daterangepicker({
            autoUpdateInput: false,
            locale: {
                cancelLabel: 'Borrar',
                format: 'DD/MM/YYYY',
                applyLabel: 'Aplicar',
                cancelLabel: 'Cancelar',
                daysOfWeek: ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'],
                monthNames: [
                    'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                ]
            }
        });

        $('#fechaRangoFinViaje').on('apply.daterangepicker', function (ev, picker) {
            $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
            $(this).data('start', picker.startDate.format('YYYY-MM-DD'));
            $(this).data('end', picker.endDate.format('YYYY-MM-DD'));
        });

        $('#fechaRangoFinViaje').on('cancel.daterangepicker input', function () {
            $(this).val('');
            $(this).removeData('start').removeData('end');
            buscarViajes(currentPage);
        });


        function formatearFecha(fecha) {
            if (!fecha) return '';
            const fechaObj = new Date(fecha);
            const dia = String(fechaObj.getDate()).padStart(2, '0');
            const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
            const anio = fechaObj.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        function buscarViajes(page = 1) {
            const idViaje = $('#idviajeinput').val().trim();
            const fechaDesde = $('#fechaRangoInicioViaje').data('start') || null;
            const fechaHasta = $('#fechaRangoInicioViaje').data('end') || null;

            const requestData = {
                idViaje: idViaje || null,
                fechaDesde,
                fechaHasta,
                page,
                pageSize
            };

            $.ajax({
                url: 'http://localhost:50222/api/Viajes/Buscar',
                type: 'GET',
                data: requestData,
                success: function (data) {
                    const tbody = $('#tablaViajes tbody');
                    tbody.empty();

                    if (data.Results.length === 0) {
                        tbody.html('<tr><td colspan="8" class="text-center">No se encontraron registros</td></tr>');
                    } else {
                        data.Results.forEach(function (viaje) {
                            const row = `
                                <tr>
                                    <td>${viaje.Viaje_ID}</td>
                                    <td>${formatearFecha(viaje.Fecha_Inicio)}</td>
                                    <td>${formatearFecha(viaje.Fecha_Fin)}</td>
                                    <td>${viaje.Origen}</td>
                                    <td>${viaje.Destino}</td>
                                    <td>${viaje.Num_Remito}</td>
                                    <td>${viaje.Distancia_KM}</td>
                                    <td>
                <button class="btn btn-primary btn-sm"
                    data-bs-toggle="tooltip"
                    data-bs-placement="top"
                    title="Editar"
                    onclick="abrirModalEditarViaje('${viaje.Viaje_ID}')">
                    <i class="bi bi-pencil"></i>
                </button>

                <span data-bs-toggle="tooltip" data-bs-placement="top"
                      title="${viaje.Estado === 'Activo' ? 'No se puede eliminar un viaje activo' : 'Eliminar'}">
                    <button class="btn btn-danger btn-sm ms-1 ${viaje.Estado === 'Activo' ? 'disabled' : ''}"
                        onclick="abrirModalEliminarViaje('${viaje.Viaje_ID}', '${viaje.Estado}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </span>

                <button class="btn btn-light btn-sm ms-1"
                    data-bs-toggle="tooltip"
                    data-bs-placement="top"
                    title="${viaje.Estado === 'Activo' ? 'Inactivar' : 'Activar'}"
                    onclick="abrirModalEstadoViaje('${viaje.Viaje_ID}', '${viaje.Estado}')">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
            </td>
                                </tr>
                            `;
                            tbody.append(row);
                        });
                    }

                    renderPagination(data.TotalRecords, pageSize, page);
                },
                error: function (xhr) {
                    console.error('Error al buscar viajes:', xhr);
                }
            });
        }

        function renderPagination(totalRecords, pageSize, currentPage) {
            const totalPages = Math.ceil(totalRecords / pageSize);
            const paginationContainer = $('#pagination');
            paginationContainer.empty();

            const prevDisabled = currentPage === 1 ? 'disabled' : '';
            const nextDisabled = currentPage === totalPages ? 'disabled' : '';

            paginationContainer.append(`
                <li class="page-item ${prevDisabled}">
                    <a class="page-link" href="#" onclick="buscarViajes(${currentPage - 1})">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
            `);

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = currentPage === i ? 'active' : '';
                paginationContainer.append(`
                    <li class="page-item ${activeClass}">
                        <a class="page-link" href="#" onclick="buscarViajes(${i})">${i}</a>
                    </li>
                `);
            }

            paginationContainer.append(`
                <li class="page-item ${nextDisabled}">
                    <a class="page-link" href="#" onclick="buscarViajes(${currentPage + 1})">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            `);
        }

        $(document).ready(function () {
            buscarViajes(currentPage);
        });

    </script>

    <!-- Alta viaje: modal, APIs y toasts -->
    <script>
        (function () {
            const API_BASE = 'http://localhost:50222';

            /* Google Maps: pegá tu clave entre comillas (si el <meta> del head queda vacío o no se guarda, usá esto). */
            const GMAP_API_KEY_LOCAL = 'AIzaSyDLmcAK6pkkh-OaRz7xCietaKcqSmMDnNc';

            let cacheOrigenes = [];
            let cacheDestinos = [];
            let cacheClientesCargado = false;
            let tarifaFijaActual = null;
            let choferViajeBuscarTimer = null;

            let mapaViajeTicket = 0;
            let mapGoogleMap = null;
            let mapDirectionsService = null;
            let mapDirectionsRenderer = null;
            var googleMapsScriptPromise = null;

            function obtenerClaveGoogleMaps() {
                try {
                    var k = (typeof GMAP_API_KEY_LOCAL === 'string' && GMAP_API_KEY_LOCAL.trim() !== '')
                        ? GMAP_API_KEY_LOCAL.trim()
                        : '';
                    if (k) return k;
                    if (typeof window !== 'undefined' && window.GMAP_API_KEY != null && String(window.GMAP_API_KEY).trim() !== '') {
                        return String(window.GMAP_API_KEY).trim();
                    }
                    var m = document.querySelector('meta[name="google-maps-api-key"]');
                    if (m) {
                        var c = (m.getAttribute('content') || '').trim();
                        if (c) return c;
                    }
                } catch (e) { /* ignore */ }
                return '';
            }

            function destruirMapaGoogle() {
                if (mapDirectionsRenderer) {
                    if (window.google && google.maps && google.maps.event) {
                        try { google.maps.event.clearInstanceListeners(mapDirectionsRenderer); } catch (e0) { }
                    }
                    try { mapDirectionsRenderer.setMap(null); } catch (e1) { }
                    mapDirectionsRenderer = null;
                }
                mapDirectionsService = null;
                if (mapGoogleMap) {
                    if (window.google && google.maps && google.maps.event) {
                        try { google.maps.event.clearInstanceListeners(mapGoogleMap); } catch (e2) { }
                    }
                    mapGoogleMap = null;
                }
                var el = document.getElementById('mapaRutaViaje');
                if (el) el.innerHTML = '';
            }

            function cargarScriptGoogleMaps(apiKey) {
                if (!apiKey) return Promise.reject(new Error('sin-clave'));
                if (window.google && window.google.maps && google.maps.Map) return Promise.resolve();
                if (googleMapsScriptPromise) return googleMapsScriptPromise;
                googleMapsScriptPromise = new Promise(function (resolve, reject) {
                    var cb = '__gmapsInitCb_' + Date.now();
                    window[cb] = function () {
                        try {
                            delete window[cb];
                            resolve();
                        } catch (e) {
                            reject(e);
                        }
                    };
                    var s = document.createElement('script');
                    s.async = true;
                    s.defer = true;
                    s.onerror = function () {
                        try { delete window[cb]; } catch (e3) { }
                        googleMapsScriptPromise = null;
                        reject(new Error('script-maps'));
                    };
                    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(apiKey)
                        + '&language=es&region=AR&loading=async&callback=' + cb;
                    document.head.appendChild(s);
                });
                return googleMapsScriptPromise;
            }

            function limpiarMontoKmFeedback() {
                $('#montoCalculadoKm').removeClass('is-invalid');
                $('#montoKmErrorFeedback').text('').addClass('d-none');
            }

            function mostrarErrorMontoKm(mensaje) {
                $('#montoCalculadoKm').addClass('is-invalid');
                $('#montoKmErrorFeedback').text(mensaje).removeClass('d-none');
            }

            function sincronizarKmDesdeRutaMapa() {
                if (!$('#tarifaTipoKm').is(':checked')) return;
                if (!mapDirectionsRenderer || !window.google || !google.maps) return;
                try {
                    var dir = mapDirectionsRenderer.getDirections();
                    if (!dir || !dir.routes || !dir.routes.length) return;
                    var meters = dir.routes[0].legs[0].distance.value;
                    var km = meters / 1000;
                    $('#kmViajeInput').val(km.toFixed(1) + ' km').attr('data-km-numeric', String(km));
                    $('#montoCalculadoKm').removeData('listo').val('');
                    limpiarMontoKmFeedback();
                } catch (e) { /* ignore */ }
            }

            function actualizarTextoResumenRutaGoogle() {
                try {
                    if (!mapDirectionsRenderer) return;
                    var dir = mapDirectionsRenderer.getDirections();
                    if (!dir || !dir.routes || !dir.routes.length) return;
                    var leg = dir.routes[0].legs[0];
                    $('#mapaRutaViajeEstado').text(
                        'Distancia: ' + leg.distance.text + ' · Tiempo estimado en auto: ' + leg.duration.text +
                        '. Arrastrá la ruta azul para ver una alternativa. Mapa y rutas © Google.'
                    );
                } catch (e) { /* ignore */ }
                sincronizarKmDesdeRutaMapa();
            }

            function inicializarMapaGoogleSiCorresponde() {
                if (mapGoogleMap || !window.google || !google.maps) return;
                var el = document.getElementById('mapaRutaViaje');
                if (!el) return;
                mapGoogleMap = new google.maps.Map(el, {
                    center: { lat: -34.6, lng: -58.38 },
                    zoom: 6,
                    mapTypeControl: true,
                    streetViewControl: true,
                    fullscreenControl: true,
                    zoomControl: true,
                    scaleControl: true,
                    gestureHandling: 'cooperative',
                    mapTypeControlOptions: { style: google.maps.MapTypeControlStyle.DROPDOWN_MENU },
                    streetViewControlOptions: { position: google.maps.ControlPosition.RIGHT_BOTTOM }
                });
                mapDirectionsService = new google.maps.DirectionsService();
                mapDirectionsRenderer = new google.maps.DirectionsRenderer({
                    map: mapGoogleMap,
                    draggable: true,
                    preserveViewport: false,
                    suppressMarkers: false,
                    polylineOptions: { strokeColor: '#2563eb', strokeWeight: 5, strokeOpacity: 0.92 }
                });
                google.maps.event.addListener(mapDirectionsRenderer, 'directions_changed', actualizarTextoResumenRutaGoogle);
            }

            function obtenerOrigenDestinoSeleccionados() {
                var oid = $('#origenSelect').val();
                var did = $('#destinoSelect').val();
                var o = cacheOrigenes.find(function (x) { return String(x.Origen_ID) === String(oid); });
                var d = cacheDestinos.find(function (x) { return String(x.Destino_ID) === String(did); });
                return { origen: o, destino: d };
            }

            function construirConsultaDireccion(item) {
                if (!item) return '';
                var calle = String(item.Calle || '').trim();
                var alt = String(item.AlturaCalle || '').trim();
                if (!calle || !alt) return '';
                var loc = String(item.NombreLocalidad || item.nombreLocalidad || '').trim();
                var prov = String(item.NombreProvincia || item.nombreProvincia || '').trim();
                var partes = [calle + ' ' + alt];
                if (loc) partes.push(loc);
                if (prov) partes.push(prov);
                partes.push('Argentina');
                return partes.join(', ');
            }

            /** Texto para el título del mapa: calle y altura, localidad y provincia (sin «Argentina»). */
            function formatearDireccionTituloMapa(item) {
                if (!item) return '';
                var calle = String(item.Calle || '').trim();
                var alt = String(item.AlturaCalle || '').trim();
                var loc = String(item.NombreLocalidad || item.nombreLocalidad || '').trim();
                var prov = String(item.NombreProvincia || item.nombreProvincia || '').trim();
                var calleAlt = '';
                if (calle && alt) calleAlt = calle + ' ' + alt;
                else if (calle) calleAlt = calle;
                else if (alt) calleAlt = alt;
                if (!calleAlt && item.Descripcion) calleAlt = String(item.Descripcion).trim();
                var partes = [];
                if (calleAlt) partes.push(calleAlt);
                if (loc) partes.push(loc);
                if (prov) partes.push(prov);
                return partes.length ? partes.join(', ') : '';
            }

            function actualizarTituloMapaRuta() {
                var sel = obtenerOrigenDestinoSeleccionados();
                var desde = formatearDireccionTituloMapa(sel.origen);
                var hasta = formatearDireccionTituloMapa(sel.destino);
                var texto = 'Ruta de Google Maps desde ' + (desde || '—') + ' hasta ' + (hasta || '—');
                $('#mapaRutaViajeTitulo').text(texto);
            }

            function actualizarMapaRutaViaje() {
                if (!rutaTarifaCompleta()) {
                    mapaViajeTicket++;
                    $('#mapaRutaViajeWrap').hide();
                    $('#mapaRutaViajeEstado').text('');
                    destruirMapaGoogle();
                    return;
                }

                var ticket = ++mapaViajeTicket;
                $('#mapaRutaViajeWrap').show();
                actualizarTituloMapaRuta();

                var apiKey = obtenerClaveGoogleMaps();
                if (!apiKey) {
                    $('#mapaRutaViajeEstado').text(
                        'Falta la clave de Google Maps. En gestion-viajes.html: (1) línea del meta google-maps-api-key en el head, content="tu_clave", o (2) constante GMAP_API_KEY_LOCAL en el script del modal (buscá esa palabra). Guardá el archivo y recargá con Ctrl+F5. En Google Cloud: Maps JavaScript API + Directions API, facturación y referrer de la clave acorde a la URL de esta página.'
                    );
                    return;
                }

                var sel = obtenerOrigenDestinoSeleccionados();
                var qo = construirConsultaDireccion(sel.origen);
                var qd = construirConsultaDireccion(sel.destino);

                function dispararResizeMapa() {
                    setTimeout(function () {
                        if (ticket === mapaViajeTicket && mapGoogleMap && window.google && google.maps) {
                            google.maps.event.trigger(mapGoogleMap, 'resize');
                        }
                    }, 280);
                }

                if (!qo || !qd) {
                    $('#mapaRutaViajeEstado').text('Cargá calle y altura en origen y destino para ver la ruta en el mapa.');
                    cargarScriptGoogleMaps(apiKey)
                        .then(function () {
                            if (ticket !== mapaViajeTicket) return;
                            inicializarMapaGoogleSiCorresponde();
                            if (mapGoogleMap) {
                                mapGoogleMap.setCenter({ lat: -34.6, lng: -58.38 });
                                mapGoogleMap.setZoom(6);
                            }
                            dispararResizeMapa();
                        })
                        .catch(function () {
                            if (ticket !== mapaViajeTicket) return;
                            $('#mapaRutaViajeEstado').text('No se pudo cargar Google Maps. Revisá la clave y la facturación del proyecto en Google Cloud.');
                        });
                    return;
                }

                $('#mapaRutaViajeEstado').text('Calculando ruta con Google Maps…');

                cargarScriptGoogleMaps(apiKey)
                    .then(function () {
                        if (ticket !== mapaViajeTicket) throw new Error('cancel');
                        inicializarMapaGoogleSiCorresponde();
                        if (!mapDirectionsService || !mapDirectionsRenderer || !mapGoogleMap) {
                            throw new Error('sin-mapa');
                        }
                        mapDirectionsService.route({
                            origin: qo,
                            destination: qd,
                            travelMode: google.maps.TravelMode.DRIVING,
                            region: 'AR',
                            provideRouteAlternatives: false
                        }, function (result, status) {
                            if (ticket !== mapaViajeTicket) return;
                            if (status === 'OK') {
                                mapDirectionsRenderer.setMap(mapGoogleMap);
                                mapDirectionsRenderer.setDirections(result);
                                actualizarTextoResumenRutaGoogle();
                                dispararResizeMapa();
                            } else {
                                var msg = 'No se pudo trazar la ruta (' + status + '). Revisá las direcciones.';
                                if (status === 'ZERO_RESULTS' || status === 'NOT_FOUND') {
                                    msg = 'Google Maps no encontró una ruta entre esas direcciones. Revisá calle, altura, localidad y provincia.';
                                }
                                $('#mapaRutaViajeEstado').text(msg);
                                dispararResizeMapa();
                            }
                        });
                    })
                    .catch(function (err) {
                        if (err && err.message === 'cancel') return;
                        if (ticket !== mapaViajeTicket) return;
                        $('#mapaRutaViajeEstado').text(
                            'No se pudo cargar o usar Google Maps. Verificá la clave, que estén habilitadas «Maps JavaScript API» y «Directions API», y la cuenta de facturación.'
                        );
                        console.warn('Google Maps:', err);
                    });
            }

            function formatearMoneda(val) {
                if (val === null || val === undefined || val === '') return '—';
                const n = Number(val);
                if (Number.isNaN(n)) return '—';
                return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function mostrarToastExito(mensaje) {
                var toastElement = $('#alert-success');
                toastElement.hide();
                toastElement.find('.toast-body').text(mensaje);
                var toast = new bootstrap.Toast(toastElement[0]);
                toast.show();
                setTimeout(function () { toast.hide(); }, 5000);
            }

            function mostrarToastError(mensaje) {
                $('#toastErrorMessage').text(mensaje);
                var el = document.getElementById('toastError');
                var toast = new bootstrap.Toast(el);
                toast.show();
                setTimeout(function () {
                    try { bootstrap.Toast.getInstance(el).hide(); } catch (e) { }
                }, 6000);
            }

            function mostrarSoloFilaTarifaFijaDatos() {
                $('#filaTarifaFijaDatos').show();
                $('#filaTarifaFijaMensajeFull').hide();
            }

            function mostrarSoloFilaTarifaFijaMensaje(texto) {
                $('#filaTarifaFijaDatos').hide();
                $('#celTarifaFijaMensajeFull').text(texto);
                $('#filaTarifaFijaMensajeFull').show();
            }

            function limpiarTablaTarifaFija() {
                tarifaFijaActual = null;
                mostrarSoloFilaTarifaFijaDatos();
                $('#celValorRuta, #celValorVueltaVacio, #celValorFijoNeto').text('—');
            }

            function aplicarTarifaFijaEnTabla(data) {
                tarifaFijaActual = data;
                mostrarSoloFilaTarifaFijaDatos();
                $('#celValorRuta').text(formatearMoneda(data.ValorRuta));
                $('#celValorVueltaVacio').text(formatearMoneda(data.ValorVueltaVacio));
                $('#celValorFijoNeto').text(formatearMoneda(data.ValorFijoNeto));
            }

            function cargarTarifaFijaSiCorresponde() {
                if (!$('#tarifaTipoFija').is(':checked')) return;

                const clienteId = $('#clienteSelect').val();
                const origenId = $('#origenSelect').val();
                const destinoId = $('#destinoSelect').val();

                if (!clienteId || !origenId || !destinoId) {
                    limpiarTablaTarifaFija();
                    return;
                }

                $.ajax({
                    url: API_BASE + '/api/TarifasFijas/PorRuta',
                    type: 'GET',
                    data: { clienteId: clienteId, origenId: origenId, destinoId: destinoId },
                    success: function (data) {
                        aplicarTarifaFijaEnTabla(data);
                    },
                    error: function (xhr) {
                        tarifaFijaActual = null;
                        if (xhr.status === 404) {
                            mostrarSoloFilaTarifaFijaMensaje('No hay tarifa fija registrada para esta ruta y cliente.');
                        } else {
                            mostrarSoloFilaTarifaFijaMensaje('No se pudo obtener la tarifa fija. Intentá de nuevo.');
                        }
                    }
                });
            }

            function poblarSelectOrigenDestino() {
                const clienteId = parseInt($('#clienteSelect').val(), 10);
                const $origen = $('#origenSelect');
                const $destino = $('#destinoSelect');

                $origen.empty();
                $destino.empty();

                if (!clienteId) {
                    $origen.append('<option value="">Primero seleccione un cliente</option>');
                    $destino.append('<option value="">Primero seleccione un cliente</option>');
                    $origen.prop('disabled', true);
                    $destino.prop('disabled', true);
                    limpiarTablaTarifaFija();
                    actualizarVisibilidadTarifaDetalle();
                    return;
                }

                const origenes = cacheOrigenes.filter(function (o) { return o.ClienteID === clienteId; });
                const destinos = cacheDestinos.filter(function (d) { return d.ClienteID === clienteId; });

                $origen.append('<option value="">Seleccione un origen</option>');
                origenes.forEach(function (o) {
                    $origen.append('<option value="' + o.Origen_ID + '">' + (o.Descripcion || 'Origen ' + o.Origen_ID) + '</option>');
                });

                $destino.append('<option value="">Seleccione un destino</option>');
                destinos.forEach(function (d) {
                    $destino.append('<option value="' + d.Destino_ID + '">' + (d.Descripcion || 'Destino ' + d.Destino_ID) + '</option>');
                });

                $origen.prop('disabled', false);
                $destino.prop('disabled', false);
                limpiarTablaTarifaFija();
                actualizarVisibilidadTarifaDetalle();
            }

            function cargarOrigenesYDestinos(callback) {
                var pendientes = 2;
                function listo() {
                    pendientes--;
                    if (pendientes === 0 && typeof callback === 'function') callback();
                }

                $.ajax({
                    url: API_BASE + '/api/Origen',
                    type: 'GET',
                    success: function (data) {
                        cacheOrigenes = Array.isArray(data) ? data : [];
                        listo();
                    },
                    error: function () {
                        cacheOrigenes = [];
                        listo();
                    }
                });

                $.ajax({
                    url: API_BASE + '/api/Destino',
                    type: 'GET',
                    success: function (data) {
                        cacheDestinos = Array.isArray(data) ? data : [];
                        listo();
                    },
                    error: function () {
                        cacheDestinos = [];
                        listo();
                    }
                });
            }

            function cargarClientesSelect(callback) {
                $.ajax({
                    url: API_BASE + '/api/Clientes/Buscar',
                    type: 'GET',
                    data: { page: 1, pageSize: 10000 },
                    success: function (res) {
                        var $sel = $('#clienteSelect');
                        $sel.find('option:not(:first)').remove();
                        var results = (res && res.Results) ? res.Results : [];
                        results.forEach(function (c) {
                            var id = c.Cliente_ID;
                            var nombre = c.RazonSocial || c.Razon_Social || ('Cliente ' + id);
                            $sel.append('<option value="' + id + '">' + nombre + '</option>');
                        });
                        cacheClientesCargado = true;
                        if (typeof callback === 'function') callback();
                    },
                    error: function () {
                        mostrarToastError('No se pudieron cargar los clientes. Verificá que la API esté en ejecución.');
                        if (typeof callback === 'function') callback();
                    }
                });
            }

            function limpiarDropChoferViaje() {
                $('#choferViajeResultados').empty().addClass('d-none').removeAttr('data-open');
            }

            function limpiarChoferViajeSeleccion() {
                $('#choferViajeId').val('');
                $('#choferViajeBuscarInput').val('');
                $('#choferViajeResumen').addClass('d-none').empty();
                $('#choferViajeLimpiar').addClass('d-none');
                limpiarDropChoferViaje();
            }

            function ejecutarBusquedaChoferViaje() {
                var q = $('#choferViajeBuscarInput').val().trim();
                if (q.length < 2) {
                    limpiarDropChoferViaje();
                    return;
                }
                $.ajax({
                    url: API_BASE + '/api/Choferes/Buscar',
                    type: 'GET',
                    data: { busqueda: q, page: 1, pageSize: 15 },
                    success: function (res) {
                        var $box = $('#choferViajeResultados');
                        $box.empty();
                        var rows = (res && res.Results) ? res.Results : [];
                        if (!rows.length) {
                            $box.append(
                                $('<button type="button" class="list-group-item list-group-item-action disabled" disabled></button>')
                                    .text('No se encontraron choferes')
                            );
                        } else {
                            rows.forEach(function (c) {
                                var nom = (c.Nombre || '').trim();
                                var ape = (c.Apellido || '').trim();
                                var dni = (c.DNI || '').trim();
                                var nombreCompleto = [nom, ape].filter(Boolean).join(' ');
                                var linea = (nombreCompleto || 'Sin nombre') + ' — DNI: ' + (dni || '—');
                                var $btn = $('<button type="button" class="list-group-item list-group-item-action"></button>')
                                    .text(linea)
                                    .attr('data-chofer-id', c.Chofer_ID)
                                    .data('linea', linea);
                                $box.append($btn);
                            });
                        }
                        $box.removeClass('d-none').attr('data-open', '1');
                    },
                    error: function () {
                        limpiarDropChoferViaje();
                    }
                });
            }

            function resetFormularioAltaViaje() {
                $('#FormAltaViaje')[0].reset();
                $('#clienteSelect').val('');
                $('#origenSelect').empty().append('<option value="">Primero seleccione un cliente</option>').prop('disabled', true);
                $('#destinoSelect').empty().append('<option value="">Primero seleccione un cliente</option>').prop('disabled', true);
                $('#tarifaTipoFija').prop('checked', true);
                limpiarTablaTarifaFija();
                $('#alertaCompletaCampos').hide().text('');
                limpiarMontoKmFeedback();
                $('#montoCalculadoKm').val('').removeData('listo');
                limpiarChoferViajeSeleccion();
                actualizarVisibilidadTarifaDetalle();
            }

            function rutaTarifaCompleta() {
                return !!($('#clienteSelect').val() && $('#origenSelect').val() && $('#destinoSelect').val());
            }

            function actualizarVisibilidadTarifaDetalle() {
                if (!rutaTarifaCompleta()) {
                    $('#tarifaRutaPendiente').show();
                    $('#tarifaDetalleActivo').hide();
                    limpiarTablaTarifaFija();
                    $('#kmViajeInput').val('').removeAttr('data-km-numeric').removeClass('bg-light');
                    $('#montoCalculadoKm').val('').removeData('listo');
                    limpiarMontoKmFeedback();
                    actualizarMapaRutaViaje();
                    return;
                }
                $('#tarifaRutaPendiente').hide();
                $('#tarifaDetalleActivo').show();
                alternarBloquesTarifa();
                actualizarMapaRutaViaje();
            }

            function alternarBloquesTarifa() {
                const esFija = $('#tarifaTipoFija').is(':checked');
                if (esFija) {
                    $('#bloqueTarifaFija').show();
                    $('#bloqueTarifaKm').hide();
                    $('#kmViajeInput').val('').removeAttr('data-km-numeric').removeClass('bg-light');
                    $('#montoCalculadoKm').val('').removeData('listo');
                    limpiarMontoKmFeedback();
                    cargarTarifaFijaSiCorresponde();
                } else {
                    $('#bloqueTarifaFija').hide();
                    $('#bloqueTarifaKm').show();
                    $('#kmViajeInput').prop('readonly', true).addClass('bg-light');
                    sincronizarKmDesdeRutaMapa();
                }
            }

            window.abrirModalAltaViaje = function () {
                resetFormularioAltaViaje();
                $('#ModalAltaViaje').modal('show');

                cargarOrigenesYDestinos(function () {
                    if (!cacheClientesCargado) {
                        cargarClientesSelect();
                    }
                });
            };

            $('#ModalAltaViaje').on('show.bs.modal', function () {
                if (!cacheClientesCargado) {
                    cargarClientesSelect();
                }
            });

            $('#ModalAltaViaje').on('shown.bs.modal', function () {
                setTimeout(function () {
                    if (mapGoogleMap && window.google && google.maps) {
                        google.maps.event.trigger(mapGoogleMap, 'resize');
                    }
                }, 200);
            });

            $('#clienteSelect').on('change', function () {
                poblarSelectOrigenDestino();
            });

            $('#origenSelect, #destinoSelect').on('change', function () {
                actualizarVisibilidadTarifaDetalle();
            });

            $('#fechaInicioViaje, #fechaFinViaje').on('change input', function () {
                if (!$('#tarifaTipoKm').is(':checked')) return;
                $('#montoCalculadoKm').val('').removeData('listo');
                limpiarMontoKmFeedback();
            });

            $('#choferViajeBuscarInput').on('input', function () {
                clearTimeout(choferViajeBuscarTimer);
                choferViajeBuscarTimer = setTimeout(ejecutarBusquedaChoferViaje, 320);
            });

            $('#choferViajeBuscarInput').on('keydown', function (e) {
                if (e.key === 'Escape') limpiarDropChoferViaje();
            });

            $('#choferViajeResultados').on('click', 'button.list-group-item-action:not([disabled])', function () {
                var id = $(this).attr('data-chofer-id');
                var linea = $(this).data('linea') || $(this).text();
                $('#choferViajeId').val(id);
                var $res = $('#choferViajeResumen');
                $res.removeClass('d-none').empty();
                $('<strong></strong>').text('Chofer elegido: ').appendTo($res);
                $res.append(document.createTextNode(linea));
                $('#choferViajeLimpiar').removeClass('d-none');
                limpiarDropChoferViaje();
                $('#choferViajeBuscarInput').val('');
            });

            $('#choferViajeLimpiar').on('click', function () {
                limpiarChoferViajeSeleccion();
            });

            $(document).on('click', function (e) {
                if (!$(e.target).closest('#wrapChoferViajeBusqueda').length) {
                    limpiarDropChoferViaje();
                }
            });

            $('input[name="tarifaTipo"]').on('change', function () {
                alternarBloquesTarifa();
            });

            var mensajeSinTarifaKm = 'No hay tarifa registrada para ese periodo de viaje y cantidad de kilómetros.';

            $('#btnCalcularMontoKm').on('click', function () {
                var kmAttr = $('#kmViajeInput').attr('data-km-numeric');
                var km = kmAttr !== undefined && kmAttr !== '' ? parseFloat(kmAttr, 10) : NaN;
                limpiarMontoKmFeedback();
                $('#montoCalculadoKm').removeData('listo').val('');

                var fi = $('#fechaInicioViaje').val();
                var ff = $('#fechaFinViaje').val();
                if (!fi || !ff) {
                    mostrarErrorMontoKm('Completá fecha y hora de inicio y de fin del viaje para calcular.');
                    return;
                }
                if (new Date(fi) > new Date(ff)) {
                    mostrarErrorMontoKm('La fecha de inicio no puede ser posterior a la fecha de fin.');
                    return;
                }

                if (Number.isNaN(km) || km <= 0) {
                    mostrarErrorMontoKm('No hay kilómetros de ruta. Esperá el trazado en el mapa o ajustá la ruta.');
                    return;
                }

                var $btn = $(this);
                $btn.prop('disabled', true);

                $.ajax({
                    url: API_BASE + '/api/TarifasKm/Calcular',
                    type: 'GET',
                    data: { fechaInicio: fi, fechaFin: ff, km: km },
                    success: function (data) {
                        limpiarMontoKmFeedback();
                        var monto = data && data.MontoCalculado != null ? data.MontoCalculado : null;
                        if (monto === null || monto === undefined) {
                            mostrarErrorMontoKm(mensajeSinTarifaKm);
                            return;
                        }
                        $('#montoCalculadoKm').val(formatearMoneda(monto)).data('listo', true);
                    },
                    error: function (xhr) {
                        $('#montoCalculadoKm').val('');
                        if (xhr.status === 404) {
                            var msg = mensajeSinTarifaKm;
                            try {
                                var j = xhr.responseJSON;
                                if (j && j.Mensaje) msg = j.Mensaje;
                            } catch (e1) { /* ignore */ }
                            mostrarErrorMontoKm(msg);
                            return;
                        }
                        var detalle = 'No se pudo calcular el monto. Intentá de nuevo.';
                        if (xhr.status === 400) {
                            try {
                                var j400 = xhr.responseJSON;
                                if (typeof j400 === 'string') detalle = j400;
                                else if (j400 && j400.Message) detalle = j400.Message;
                            } catch (e2) { /* ignore */ }
                            mostrarErrorMontoKm(detalle);
                            return;
                        }
                        mostrarErrorMontoKm(detalle);
                        mostrarToastError(detalle);
                    },
                    complete: function () {
                        $btn.prop('disabled', false);
                    }
                });
            });

            $('#confirmarAltaViajeBtn').on('click', function (e) {
                e.preventDefault();
                $('#alertaCompletaCampos').hide().text('');

                const clienteId = $('#clienteSelect').val();
                const origenId = $('#origenSelect').val();
                const destinoId = $('#destinoSelect').val();
                const fi = $('#fechaInicioViaje').val();
                const ff = $('#fechaFinViaje').val();
                const esFija = $('#tarifaTipoFija').is(':checked');

                if (!clienteId || !origenId || !destinoId || !fi || !ff) {
                    $('#alertaCompletaCampos').text('Completá todos los campos obligatorios.').show();
                    return;
                }

                if (new Date(fi) > new Date(ff)) {
                    $('#alertaCompletaCampos').text('La fecha de inicio no puede ser posterior a la fecha de fin.').show();
                    return;
                }

                if (esFija) {
                    if (!tarifaFijaActual) {
                        $('#alertaCompletaCampos').text('No hay tarifa fija disponible para la ruta elegida. Revisá origen, destino y cliente.').show();
                        return;
                    }
                } else {
                    var kmNum = parseFloat($('#kmViajeInput').attr('data-km-numeric'), 10);
                    if (Number.isNaN(kmNum) || kmNum <= 0) {
                        $('#alertaCompletaCampos').text('No hay distancia en km desde el mapa. Completá la ruta y esperá el trazado.').show();
                        return;
                    }
                    if (!$('#montoCalculadoKm').data('listo')) {
                        $('#alertaCompletaCampos').text('Pulsá «Calcular» para obtener el monto del viaje.').show();
                        return;
                    }
                }

                // Aquí se conectará POST a api/Viajes cuando el endpoint de alta esté disponible
                mostrarToastExito('Viaje registrado correctamente.');
                $('#ModalAltaViaje').modal('hide');
                if (typeof buscarViajes === 'function') {
                    buscarViajes(typeof currentPage !== 'undefined' ? currentPage : 1);
                }
            });

            $('#ModalAltaViaje').on('hidden.bs.modal', function () {
                $('#confirmarAltaViajeBtn').prop('disabled', false);
            });

            $(document).ready(function () {
                cargarOrigenesYDestinos();
            });
        })();
    </script>

</body>


</html>
