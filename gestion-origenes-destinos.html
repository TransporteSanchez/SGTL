    <!-- Carga de diseño y roles -->
    <script>
        window.onload = function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            // Cargar header, footer y configuración
            window.loadHeader();
            window.loadFooter();

            loadSettings()
                .then(() => {
                    adjustVisibilityBasedOnRole();
                    loadingMessage.style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    if (typeof window.loadSidebar === 'function') { window.loadSidebar(); }
                })
                .catch((error) => {
                    console.error('Error al cargar el header, footer o los datos:', error);
                    loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
                });
        };

        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');

            if (userRole && userRole.toLowerCase() === 'admin') {
                gestionarContenidoBtn.style.display = 'block';
            } else {
                gestionarContenidoBtn.style.display = 'none';
            }
        }

        async function loadSettings() {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        if (data) {
                            const { Logo: logoUrl, ColorFondo: colorFondo, ColorBotonesMenu: colorBotonesMenu, ContenidoPiePagina: contenidoPiePagina } = data;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }

    </script>

    <!-- ================= ABM Orígenes y Destinos ================= -->
    <script>
        const API_OD = 'http://localhost:50222/api';
        let odElimTipo = null, odElimId = null;

        function usuarioActual() { return localStorage.getItem('username') || 'sistema'; }
        function rutaOD(tipo) { return tipo === 'origen' ? '/Origen' : '/Destino'; }
        function idCampo(tipo, o) { return tipo === 'origen' ? o.Origen_ID : o.Destino_ID; }

        function parseErr(xhr) {
            try {
                let r = xhr.responseJSON;
                if (!r && xhr.responseText) { r = JSON.parse(xhr.responseText); }
                if (Array.isArray(r)) { return r.map(function (e) { return e.ErrorMessage || e; }).join(' '); }
                if (r && r.Message) { return r.Message; }
                if (r && r.ExceptionMessage) { return r.ExceptionMessage; }
            } catch (e) { }
            return 'Ocurrio un error. Revise los datos e intente nuevamente.';
        }

        function cargarCombo(url, sel, ph, map) {
            const s = $(sel);
            const d = $.Deferred();
            $.ajax({ url: url, type: 'GET' })
                .done(function (data) { s.empty().append('<option value="">' + ph + '</option>'); (data || []).forEach(function (it) { s.append(map(it)); }); })
                .fail(function () { s.empty().append('<option value="">' + ph + '</option>'); })
                .always(function () { d.resolve(); });
            return d.promise();
        }

        function cargarClientesOD() {
            return cargarCombo(API_OD + '/Clientes', '#odCliente', 'Seleccione un cliente',
                function (c) { return '<option value="' + c.Cliente_ID + '">' + c.Razon_Social + '</option>'; });
        }
        function cargarProvinciasOD() {
            return cargarCombo(API_OD + '/Provincias', '#odProvincia', 'Seleccione una provincia',
                function (p) { return '<option value="' + p.Prov_ID + '">' + p.Nombre_Provincia + '</option>'; });
        }
        function cargarLocalidadesOD(provId, locSel) {
            const s = $('#odLocalidad');
            const d = $.Deferred();
            if (!provId) { s.prop('disabled', true).empty().append('<option value="">Seleccione una localidad</option>'); d.resolve(); return d.promise(); }
            $.ajax({ url: API_OD + '/Provincias/' + provId + '/Localidades', type: 'GET' })
                .done(function (data) {
                    s.prop('disabled', false).empty().append('<option value="">Seleccione una localidad</option>');
                    (data || []).forEach(function (l) { s.append('<option value="' + l.Loc_ID + '">' + l.Nombre_Localidad + '</option>'); });
                    if (locSel) { s.val(locSel); }
                })
                .fail(function () { s.prop('disabled', false).empty().append('<option value="">Seleccione una localidad</option>'); })
                .always(function () { d.resolve(); });
            return d.promise();
        }

        function listarOD(tipo) {
            $.ajax({ url: API_OD + rutaOD(tipo), type: 'GET' })
                .done(function (data) {
                    const tb = $('#tabla_' + tipo + ' tbody').empty();
                    if (!data || !data.length) { tb.html('<tr><td colspan="7" class="text-center">Sin registros</td></tr>'); return; }
                    data.forEach(function (o) {
                        const id = idCampo(tipo, o);
                        const dir = ((o.Calle || '') + ' ' + (o.AlturaCalle || '')).trim();
                        tb.append('<tr>' +
                            '<td>' + id + '</td>' +
                            '<td>' + (o.Descripcion || '') + '</td>' +
                            '<td>' + (o.ClienteRazon || '') + '</td>' +
                            '<td>' + (o.NombreProvincia || '') + '</td>' +
                            '<td>' + (o.NombreLocalidad || '') + '</td>' +
                            '<td>' + dir + '</td>' +
                            '<td><button class="btn btn-primary btn-sm" onclick="abrirEditarOD(\'' + tipo + '\',' + id + ')"><i class="bi bi-pencil"></i></button> ' +
                            '<button class="btn btn-danger btn-sm ms-1" onclick="abrirEliminarOD(\'' + tipo + '\',' + id + ')"><i class="bi bi-trash"></i></button></td>' +
                            '</tr>');
                    });
                })
                .fail(function () { $('#tabla_' + tipo + ' tbody').html('<tr><td colspan="7" class="text-center">Sin registros</td></tr>'); });
        }

        function abrirAltaOD(tipo) {
            document.getElementById('formOD').reset();
            $('#odId').val('');
            $('#odTipo').val(tipo);
            $('#tituloOD').text(tipo === 'origen' ? 'Nuevo origen' : 'Nuevo destino');
            $('#alertaOD').hide().empty();
            $('#odLocalidad').prop('disabled', true).empty().append('<option value="">Seleccione una localidad</option>');
            $.when(cargarClientesOD(), cargarProvinciasOD()).always(function () {
                $('#modalOD').modal('show');
            });
        }

        function abrirEditarOD(tipo, id) {
            document.getElementById('formOD').reset();
            $('#odId').val(id);
            $('#odTipo').val(tipo);
            $('#tituloOD').text(tipo === 'origen' ? 'Editar origen' : 'Editar destino');
            $('#alertaOD').hide().empty();
            $.when(cargarClientesOD(), cargarProvinciasOD()).always(function () {
                $.ajax({ url: API_OD + rutaOD(tipo) + '/' + id, type: 'GET' })
                    .done(function (o) {
                        $('#odCliente').val(o.ClienteID);
                        $('#odDescripcion').val(o.Descripcion);
                        $('#odCalle').val(o.Calle);
                        $('#odAltura').val(o.AlturaCalle);
                        $('#odProvincia').val(o.ProvID);
                        cargarLocalidadesOD(o.ProvID, o.LocID).always(function () {
                            $('#modalOD').modal('show');
                        });
                    })
                    .fail(function () { alert('No se pudo cargar el registro.'); });
            });
        }

        function guardarOD() {
            const tipo = $('#odTipo').val();
            const dto = {
                Descripcion: ($('#odDescripcion').val() || '').trim(),
                ClienteID: parseInt($('#odCliente').val()) || 0,
                ProvID: parseInt($('#odProvincia').val()) || 0,
                LocID: parseInt($('#odLocalidad').val()) || 0,
                Calle: ($('#odCalle').val() || '').trim(),
                AlturaCalle: ($('#odAltura').val() || '').trim(),
                Usu_Alta: usuarioActual(),
                Usu_Modi: usuarioActual()
            };
            const falt = [];
            if (!dto.Descripcion) falt.push('Descripción');
            if (!dto.ClienteID) falt.push('Cliente');
            if (!dto.ProvID) falt.push('Provincia');
            if (!dto.LocID) falt.push('Localidad');
            if (falt.length) { $('#alertaOD').html('Complete los campos: ' + falt.join(', ') + '.').show(); return; }

            const id = $('#odId').val();
            const edit = id !== '' && id != null;
            $.ajax({
                url: edit ? (API_OD + rutaOD(tipo) + '/' + id) : (API_OD + rutaOD(tipo)),
                type: edit ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(dto),
                success: function () {
                    $('#modalOD').modal('hide');
                    alert(edit ? 'Registro actualizado.' : 'Registro creado.');
                    listarOD(tipo);
                },
                error: function (xhr) { $('#alertaOD').html(parseErr(xhr)).show(); }
            });
        }

        function abrirEliminarOD(tipo, id) { odElimTipo = tipo; odElimId = id; $('#modalEliminarOD').modal('show'); }
        function confirmarEliminarOD() {
            if (!odElimTipo || !odElimId) { return; }
            $.ajax({ url: API_OD + rutaOD(odElimTipo) + '/' + odElimId, type: 'DELETE' })
                .done(function () {
                    $('#modalEliminarOD').modal('hide');
                    alert('Registro eliminado correctamente.');
                    const t = odElimTipo; odElimTipo = null; odElimId = null;
                    listarOD(t);
                })
                .fail(function (xhr) { $('#modalEliminarOD').modal('hide'); alert(parseErr(xhr)); });
        }

        $(document).ready(function () {
            $('#odProvincia').on('change', function () { cargarLocalidadesOD($(this).val(), null); });
            listarOD('origen');
            listarOD('destino');
        });
    </script>

</body>
