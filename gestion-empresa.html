<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Sánchez - Gestionar empresa</title>
    <link rel="shortcut icon" href="assets/static/images/logo/sgtl-icono.png" type="image/png">
    <link rel="stylesheet" href="assets/compiled/css/app.css">
    <link rel="stylesheet" href="assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="assets/static/css/sgtl.css">
</head>
<body>
    <div id="app">
        <div id="sidebar"></div>
        <div id="main" class="layout-navbar navbar-fixed">
            <header>
                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block" aria-label="Abrir menú">
                            <i class="bi bi-justify fs-3" aria-hidden="true"></i>
                        </a>
                        <div id="header-container"></div>
                    </div>
                </nav>
            </header>
            <main class="page-heading">
                <section class="section mx-3 mx-md-4 mt-4" aria-labelledby="tituloEmpresa">
                    <form id="formEmpresa" class="card rounded" novalidate>
                        <div class="card-header">
                            <h1 id="tituloEmpresa" class="card-title h5 mb-1"><i class="bi bi-gear me-2" aria-hidden="true"></i>Gestionar empresa</h1>
                            <p class="text-muted mb-0">Estos datos salen en los documentos.</p>
                        </div>
                        <div class="card-body">
                            <div id="avisoEmpresa" class="alert alert-danger d-none" role="alert"></div>
                            <div class="row g-3">
                                <div class="col-12"><div class="sgtl-bloque-titulo">Datos fiscales</div></div>
                                <div class="col-12 col-md-8">
                                    <label for="empresaRazonSocial" class="form-label">Razón social <span class="text-danger">*</span></label>
                                    <input type="text" id="empresaRazonSocial" class="form-control" maxlength="200" autocomplete="organization">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="empresaNombreComercial" class="form-label">Nombre comercial</label>
                                    <input type="text" id="empresaNombreComercial" class="form-control" maxlength="100" autocomplete="off">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="empresaCuit" class="form-label">CUIT <span class="text-danger">*</span></label>
                                    <input type="text" inputmode="numeric" id="empresaCuit" class="form-control" maxlength="13" autocomplete="off">
                                    <div class="form-text">11 números.</div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="empresaCondIva" class="form-label">Condición de IVA <span class="text-danger">*</span></label>
                                    <select id="empresaCondIva" class="form-select">
                                        <option value="">Seleccioná una condición</option>
                                        <option value="1">Responsable inscripto</option>
                                        <option value="2">Monotributista</option>
                                        <option value="3">Exento</option>
                                    </select>
                                </div>
                                <div class="col-12"><div class="sgtl-bloque-titulo">Logo para los documentos</div></div>
                                <div class="col-12">
                                    <span class="form-label d-block" id="etiquetaLogo">Logo</span>
                                    <div class="border rounded p-3 d-flex flex-wrap align-items-center gap-3">
                                        <span class="text-muted" id="empresaLogoIcono"><i class="bi bi-image" aria-hidden="true"></i></span>
                                        <img id="empresaLogoPreview" class="d-none mw-100 object-fit-contain" height="64" alt="Logo de la empresa">
                                        <div>
                                            <div class="small text-muted" id="empresaLogoDetalle">Sin logo: en los documentos sale el nombre.</div>
                                            <div class="d-flex flex-wrap gap-2 mt-2">
                                                <button type="button" class="btn btn-primary" id="btnLogoEmpresa">Elegir logo</button>
                                                <button type="button" class="btn btn-outline-danger d-none" id="btnQuitarLogoEmpresa">Quitar logo</button>
                                            </div>
                                            <div class="form-text">PNG, JPG, SVG, WEBP o ICO, hasta 1 MB.</div>
                                        </div>
                                        <input type="file" id="empresaLogoArchivo" class="d-none" accept=".png,.svg,.jpg,.jpeg,.webp,.ico,image/png,image/jpeg,image/svg+xml,image/webp,image/x-icon">
                                    </div>
                                </div>
                                <div class="col-12"><div class="sgtl-bloque-titulo">Domicilio</div></div>
                                <div class="col-12 col-md-6">
                                    <label for="empresaProvincia" class="form-label">Provincia <span class="text-danger">*</span></label>
                                    <select id="empresaProvincia" class="form-select">
                                        <option value="">Seleccioná una provincia</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="empresaLocalidad" class="form-label">Localidad <span class="text-danger">*</span></label>
                                    <select id="empresaLocalidad" class="form-select" disabled>
                                        <option value="">Seleccioná una localidad</option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="empresaCalle" class="form-label">Calle <span class="text-danger">*</span></label>
                                    <input type="text" id="empresaCalle" class="form-control" maxlength="100" autocomplete="address-line1">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label for="empresaAltura" class="form-label">Altura <span class="text-danger">*</span></label>
                                    <input type="text" id="empresaAltura" class="form-control" maxlength="10" autocomplete="off">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label for="empresaCodigoPostal" class="form-label">Código postal</label>
                                    <input type="text" id="empresaCodigoPostal" class="form-control" maxlength="20" autocomplete="postal-code">
                                </div>
                                <div class="col-12"><div class="sgtl-bloque-titulo">Contacto</div></div>
                                <div class="col-12 col-md-4">
                                    <label for="empresaTelefono" class="form-label">Teléfono</label>
                                    <input type="text" inputmode="numeric" id="empresaTelefono" class="form-control" maxlength="15" autocomplete="tel">
                                    <div class="form-text">Hasta 10 números.</div>
                                </div>
                                <div class="col-12 col-md-8">
                                    <label for="empresaEmail" class="form-label">E-mail</label>
                                    <input type="email" id="empresaEmail" class="form-control" maxlength="320" autocomplete="email">
                                    <div class="form-text">Tiene que tener @ y un dominio.</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <small class="text-muted" id="registroEmpresa"></small>
                            <button type="submit" class="btn btn-primary" id="btnGuardarEmpresa">Guardar</button>
                        </div>
                    </form>
                </section>
            </main>
            <footer><div id="footer-container"></div></footer>
        </div>
    </div>
    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/static/js/header.js"></script>
    <script src="assets/static/js/footer.js"></script>
    <script src="assets/static/gestionContenido.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="assets/static/js/gestion-empresa.js"></script>
</body>
</html>
