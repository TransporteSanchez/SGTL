<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar contenido · SGTL</title>
    <style>
        /* Estilo para ocultar el contenido por defecto */
        #app {
            display: none;
            /* Ocultar el contenido de la aplicación por defecto */
        }

        /* Estilo para centrar el spinner de carga */
        #loading-message {
            position: fixed;
            /* Posiciona el mensaje de carga en el medio de la pantalla */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Centra el div */
            z-index: 9999;
            /* Asegúrate de que esté por encima de otros elementos */
        }
    </style>


    <link rel="shortcut icon" href="./assets/static/images/logo/sgtl-icono.png" type="image/png">



    <link rel="stylesheet" href="./assets/compiled/css/app.css">
    <link rel="stylesheet" href="./assets/compiled/css/iconly.css">
    <link rel="stylesheet" href="./assets/static/css/sgtl.css">

</head>

<body>
    <div id="loading-message" style="display: none;">
        <div class="spinner-border" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando…</span>
        </div>
    </div>

    <script src="assets/static/js/initTheme.js"></script>
    <div id="app">
        <div id="sidebar"></div>

        <div id="main" class='layout-navbar navbar-fixed'>
            <!--Header-->
            <header>

                <nav class="navbar navbar-expand navbar-light navbar-top">
                    <div class="container-fluid">
                        <a href="#" class="burger-btn d-block">
                            <i class="bi bi-justify fs-3"></i>
                        </a>

                        <!--btn para expandir Menú lateral-->

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div id="header-container"></div>
                        <script src="./assets/static/js/header.js"></script>
                    </div>
                </nav>
            </header>

            <div class="page-heading">

                <!--Comienzo sección de la tabla-->
                <section class="section">
                    <div class="card rounded me-4 ms-4 mt-4">
                        <div class="card-header">
                            <h5 class="card-title mb-1">
                                <i class="bi bi-gear me-2"></i>Gestionar contenido
                            </h5>
                            <p class="text-muted mb-0">Elegí el logo, los colores y el pie de página que ve todo el sistema.</p>
                        </div>
                        <div class="card-body">
                            <form id="settings" class="form form-horizontal">
                                <div class="row">
                                    <div class="col-md-3">
                                        <label for="logoInput" class="form-label">Logo</label>
                                    </div>
                                    <div class="col-md-9 form-group">
                                        <div class="d-flex align-items-center gap-3 mb-2">
                                            <img id="logoPreview" src="./assets/static/images/logo/sgtl-logo.png"
                                                alt="Vista previa del logo"
                                                style="height:48px; max-width:200px; object-fit:contain; background:#fff; border:1px solid #e5e7eb; border-radius:6px; padding:4px;">
                                            <div class="d-flex align-items-center">
                                                <button type="button" class="btn btn-light-secondary btn-sm" id="btnExaminarLogo">
                                                    <i class="bi bi-upload me-1"></i>Examinar…
                                                </button>
                                                <button type="button" class="btn btn-sm btn-link text-danger d-none" id="btnQuitarLogo">Quitar archivo</button>
                                                <input type="file" id="logoFile" class="d-none"
                                                    accept=".png,.svg,.jpg,.jpeg,.webp,.ico,image/*">
                                            </div>
                                        </div>
                                        <input type="text" id="logoInput" class="form-control" name="logoInput"
                                            placeholder="Pegá una URL o ruta de imagen (o usá Examinar)">
                                        <small class="text-muted d-block mt-1" id="logoHelp">
                                            Pegá una URL/ruta (ej. <code>./assets/static/images/logo/sgtl-logo.png</code>) o subí un archivo
                                            (.png, .svg, .jpg, .webp, .ico). Máximo 1&nbsp;MB.
                                        </small>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="backgroundColorInput" class="form-label">Color de fondo</label>
                                    </div>
                                    <div class="col-md-9 form-group">
                                        <input type="color" id="backgroundColorInput" class="form-control"
                                            name="backgroundColorInput">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="menuColorInput" class="form-label">Color del menú</label>
                                    </div>
                                    <div class="col-md-9 form-group">
                                        <input type="color" id="menuColorInput" class="form-control"
                                            name="menuColorInput">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="footerContentInput" class="form-label">Contenido del pie de página</label>
                                    </div>
                                    <div class="col-md-9 form-group">
                                        <textarea id="footerContentInput" class="form-control" name="footerContentInput"
                                            placeholder="SGTL | un producto de Integra Analistas ®" rows="3"></textarea>
                                    </div>
                                    <div class="col-sm-12 d-flex justify-content-end">
                                        <button type="button" class="btn btn-light-secondary me-1 mb-1"
                                            id="btnRestablecer"><i class="bi bi-arrow-counterclockwise me-1"></i>Restablecer valores por defecto</button>
                                        <button type="submit" class="btn btn-primary mb-1"
                                            id="saveSettingsBtn">Guardar</button>

                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </div>


            <!--Fin sección de la tabla-->

            <!-- Footer -->
            <footer>
                <div id="footer-container"></div>
                <script src="./assets/static/js/footer.js"></script>
            </footer>

        </div>

    </div>


    <!--Scripts-->

    <script src="assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="assets/extensions/jquery/jqueryajax.js"></script>
    <script src="assets/compiled/js/app.js"></script>
    <script src="assets/static/js/components/sidebar.js"></script>
    <script src="assets/static/js/sidebar-loader.js"></script>
    <script src="assets/static/js/sgtl-ui.js"></script>
    <script src="./assets/static/gestionContenido.js"></script>

    <script>
        window.onload = async function () {
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.style.display = 'block';
            document.getElementById('app').style.display = 'none';

            window.loadFooter();

            try {
                await window.loadHeader();
                if (typeof window.loadSidebar === 'function') {
                    await window.loadSidebar();
                }
                await loadSettings();  // o tu equivalente que llame applyStyles
                adjustVisibilityBasedOnRole();  // si la página lo define
                loadingMessage.style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Error al cargar el header, footer o los datos:', error);
                loadingMessage.innerText = 'Error al cargar el header, footer o los datos.';
            }
        };

        // Define la visibilidad de elementos según el rol (esta pantalla no tiene botón
        // dependiente de rol, pero la función debe existir para no romper el window.onload).
        function adjustVisibilityBasedOnRole() {
            const userRole = localStorage.getItem('userRole');
            const gestionarContenidoBtn = document.getElementById('gestionarContenidoBtn');
            if (!gestionarContenidoBtn) return;
            gestionarContenidoBtn.style.display =
                (userRole && userRole.toLowerCase() === 'admin') ? 'block' : 'none';
        }

        async function loadSettings() {
            console.log('Llamando a la API de Gestión de Contenido...');

            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://localhost:50222/api/GestionContenido/1', true);

            return new Promise((resolve, reject) => {
                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        console.log('Respuesta de la API:', data);

                        if (data) {
                            const logoUrl = data.Logo;
                            const colorFondo = data.ColorFondo;
                            const colorBotonesMenu = data.ColorBotonesMenu;
                            const contenidoPiePagina = data.ContenidoPiePagina;

                            if (esDataUri(logoUrl)) {
                                uploadedLogoDataUrl = logoUrl;
                                marcarArchivoCargado(true);
                            } else {
                                document.getElementById('logoInput').value = logoUrl || './assets/static/images/logo/sgtl-logo.png';
                            }
                            setLogoPreview(logoUrl || './assets/static/images/logo/sgtl-logo.png');
                            document.getElementById('backgroundColorInput').value = colorFondo || window.SGTL_CONTENIDO_DEFAULT.fondo;
                            document.getElementById('menuColorInput').value = colorBotonesMenu || window.SGTL_CONTENIDO_DEFAULT.menu;
                            document.getElementById('footerContentInput').value = contenidoPiePagina || window.SGTL_CONTENIDO_DEFAULT.pie;

                            applyStyles(logoUrl, colorFondo, colorBotonesMenu, contenidoPiePagina);
                            resolve();
                        } else {
                            console.error('La respuesta de la API no contiene los datos esperados.');
                            notifyError('No se pudo cargar el contenido guardado.');
                            reject(new Error('Datos vacíos o inexistentes en la respuesta de la API'));
                        }
                    } else {
                        console.error('Error en la petición:', xhr.statusText);
                        notifyError("Ocurrió un error al cargar el contenido de la página.");
                        reject(new Error('Error en la carga de la API'));
                    }
                };

                xhr.onerror = function () {
                    console.error('Error al cargar la configuración de la API.');
                    notifyError('No se pudo cargar el contenido guardado.');
                    reject(new Error('Error de red'));
                };

                xhr.send();
            });
        }


        // Guardar cambios de gestión de contenido
        document.getElementById('saveSettingsBtn').addEventListener('click', function (event) {
            event.preventDefault();
            const listo = SGTL.procesando('#saveSettingsBtn', 'Guardando…');

            const logo = valorLogoEfectivo();
            const backgroundColor = document.getElementById('backgroundColorInput').value;
            const menuColor = document.getElementById('menuColorInput').value;
            const footerContent = document.getElementById('footerContentInput').value;

            const settingsData = {
                Logo: logo,
                ColorFondo: backgroundColor,
                ColorBotonesMenu: menuColor,
                ContenidoPiePagina: footerContent,
                Fecha_Modi: new Date().toISOString(),
                Usu_Modi: localStorage.getItem('username') || 'UsuarioDesconocido'
            };

            SGTL.ajax({
                url: 'http://localhost:50222/api/GestionContenido/1',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(settingsData)
            }, 'No se pudo guardar el contenido. Revisá la conexión y probá de nuevo.').then(function () {
                // Aplica los cambios en vivo (sin recargar la página).
                try { applyStyles(logo, backgroundColor, menuColor, footerContent); } catch (e) { }
                mostrarToastExito();
            }, function (error) {
                notifyError(error.mensajeUsuario);
            }).finally(listo);
        });

        function loadDefaultValues() {
            var marca = window.SGTL_CONTENIDO_DEFAULT;
            console.log('Cargando valores por defecto...');
            document.getElementById('logoInput').value = marca.logo;
            document.getElementById('backgroundColorInput').value = marca.fondo;
            document.getElementById('menuColorInput').value = marca.menu;
            document.getElementById('footerContentInput').value = marca.pie;

            applyStyles(marca.logo, marca.fondo, marca.menu, marca.pie);
        }

        // Obtener el nombre de usuario desde localStorage
        const usuarioModificador = localStorage.getItem('username') || 'UsuarioDesconocido';

        // Vuelve a la marca SGTL (fondo, menú y pie); el logo queda como está.
        function restablecerContenido() {
            var marca = window.SGTL_CONTENIDO_DEFAULT;
            const logoActual = valorLogoEfectivo() || marca.logo;
            const settingsData = {
                Logo: logoActual,
                ColorFondo: marca.fondo,
                ColorBotonesMenu: marca.menu,
                ContenidoPiePagina: marca.pie,
                Fecha_Modi: new Date().toISOString(),
                Usu_Modi: usuarioModificador
            };
            return SGTL.ajax({
                url: 'http://localhost:50222/api/GestionContenido/1',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(settingsData)
            }, 'No se pudo restablecer el contenido. Probá de nuevo.').then(function () {
                document.getElementById('backgroundColorInput').value = marca.fondo;
                document.getElementById('menuColorInput').value = marca.menu;
                document.getElementById('footerContentInput').value = marca.pie;
                applyStyles(logoActual, marca.fondo, marca.menu, marca.pie);
            });
        }

        document.getElementById('btnRestablecer').addEventListener('click', function () {
            SGTL.confirmar({
                titulo: '¿Restablecer los valores por defecto?',
                mensaje: 'El fondo, el menú y el pie vuelven a los de SGTL. El logo no cambia.',
                verbo: 'Restablecer',
                accion: restablecerContenido
            }).then(function (hecho) {
                if (hecho) SGTL.toastExito('Valores por defecto restablecidos.');
            });
        });

        var MAX_LOGO_BYTES = 1024 * 1024; // 1 MB
        var uploadedLogoDataUrl = null;   // si hay archivo subido, tiene prioridad al guardar

        function esDataUri(v) { return typeof v === 'string' && v.indexOf('data:') === 0; }

        function notifyError(msg) {
            SGTL.toastError(msg);
        }

        // Muestra el toast de éxito de forma segura (sin romper el flujo si algo falla).
        function mostrarToastExito() {
            SGTL.toastExito('Cambios guardados.');
        }

        function setLogoPreview(src) {
            var img = document.getElementById('logoPreview');
            if (img) img.src = src || './assets/static/images/logo/sgtl-logo.png';
        }

        function marcarArchivoCargado(cargado) {
            var quitar = document.getElementById('btnQuitarLogo');
            var input = document.getElementById('logoInput');
            if (quitar) quitar.classList.toggle('d-none', !cargado);
            if (!input) return;
            if (cargado) {
                input.value = '';
                input.setAttribute('disabled', 'disabled');
                input.setAttribute('placeholder', 'Archivo cargado \u2714  (usá "Quitar archivo" para volver a URL)');
            } else {
                input.removeAttribute('disabled');
                input.setAttribute('placeholder', 'Pegá una URL o ruta de imagen (o usá Examinar)');
            }
        }

        // Valor que se guardará: el archivo subido tiene prioridad; si no, la URL escrita.
        function valorLogoEfectivo() {
            return uploadedLogoDataUrl || document.getElementById('logoInput').value;
        }

        (function initLogoControls() {
            var btnExaminar = document.getElementById('btnExaminarLogo');
            var btnQuitar = document.getElementById('btnQuitarLogo');
            var fileInput = document.getElementById('logoFile');
            var urlInput = document.getElementById('logoInput');
            if (!btnExaminar || !fileInput || !urlInput) return;

            btnExaminar.addEventListener('click', function () { fileInput.click(); });

            btnQuitar.addEventListener('click', function () {
                uploadedLogoDataUrl = null;
                fileInput.value = '';
                marcarArchivoCargado(false);
                setLogoPreview(urlInput.value);
            });

            fileInput.addEventListener('change', function (e) {
                var file = e.target.files && e.target.files[0];
                if (!file) return;
                var extOk = /\.(png|svg|jpe?g|webp|ico)$/i.test(file.name);
                var tiposOk = ['image/png', 'image/svg+xml', 'image/jpeg', 'image/webp', 'image/x-icon', 'image/vnd.microsoft.icon'];
                if (!extOk && tiposOk.indexOf(file.type) === -1) {
                    notifyError('Formato no permitido. Usá .png, .svg, .jpg, .webp o .ico.');
                    fileInput.value = ''; return;
                }
                if (file.size > MAX_LOGO_BYTES) {
                    notifyError('El archivo supera 1 MB. Elegí una imagen más liviana.');
                    fileInput.value = ''; return;
                }
                var reader = new FileReader();
                reader.onload = function (ev) {
                    uploadedLogoDataUrl = ev.target.result; // data URI base64
                    setLogoPreview(uploadedLogoDataUrl);
                    marcarArchivoCargado(true);
                };
                reader.onerror = function () { notifyError('No se pudo leer el archivo.'); };
                reader.readAsDataURL(file);
            });

            // Vista previa en vivo al escribir/pegar una URL
            urlInput.addEventListener('input', function () {
                if (!uploadedLogoDataUrl) setLogoPreview(this.value);
            });
        })();
    </script>





</body>

</html>
